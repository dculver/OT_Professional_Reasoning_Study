<!DOCTYPE html>
<!--
  =====================================================================
  OT PROFESSIONAL REASONING STUDY — jsPsych INTEGRATION, CHUNK 1
  Session scaffolding: capability gate → browser-check → permissions →
  ★ SCREEN SHARE + FULLSCREEN (moved FIRST) → chinrest → calibration.
  ---------------------------------------------------------------------
  WHY THIS ORDER (the correction from the original):
    In the original index.html, screen recording started PER CASE, right
    before each case ran, and therefore AFTER calibration. But entering
    fullscreen and starting a tab share CHANGES THE VIEWPORT. WebGazer
    calibration maps camera features to screen coordinates in ONE viewport;
    if the viewport changes after calibration, every gaze estimate is
    referred to the wrong coordinate space. So the viewport-changing steps
    (fullscreen + getDisplayMedia) must happen BEFORE calibration, and
    calibration then records that final viewport. This file does exactly
    that: SHARE FIRST, then chinrest, then calibrate at the shared viewport.

  Recording is now ONE continuous session stream (id "session"), not
  per-case. study.recording_started_at anchors the recording clock so
  each case's start offset can be computed later for RTA time-sync.

  SCOPE: sink-agnostic and mount-agnostic. Ends at a "Chunk 1 complete"
  placeholder. Chunk 2 mounts the renderCase engine (Option B wrapper
  trial); Chunk 3 is the paused cued-RTA; save = Qualtrics file upload.

  Reused VERBATIM from the original (proven, unchanged logic):
    checkBrowser gate · permissionGate · pickVideoMime/startScreenRecording/
    stopScreenRecording · virtual chinrest config · calibration/validation
    trials + gaze scoring · Whisper warmup worker.
  Requires the same js/ library folder as the original.
  =====================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>OT Professional Reasoning Study</title>

  <script src="js/jspsych.js"></script>
  <link href="js/jspsych.css" rel="stylesheet" type="text/css" />
  <script src="js/plugin-html-keyboard-response.js"></script>
  <script src="js/plugin-survey-text.js"></script>
  <script src="js/plugin-preload.js"></script>
  <script src="js/plugin-call-function.js"></script>

  <script src="js/webgazer.js"></script>
  <script src="js/extension-webgazer.js"></script>
  <script src="js/plugin-webgazer-init-camera.js"></script>
  <script src="js/plugin-webgazer-init-calibrate.js"></script>
  <script src="js/plugin-webgazer-validate.js"></script>
  <script src="js/plugin-initialize-microphone.js"></script>
  <script src="js/plugin-virtual-chinrest.js"></script>
  <script src="js/plugin-browser-check.js"></script>

  <style>
    /* Calibration/validation dot styling (from original) */
    .jspsych-webgazer-calibrate-point,.jspsych-webgazer-validate-point,
    .calibration-point,.validation-point,
    div[id^="calibration-point"],div[id^="validation-point"],#webgazerGazeDot { z-index: 2147483000 !important; }
    body { font-family: 'Segoe UI', Arial, sans-serif; }
    /* Session-level stream-ended banner (never auto-advances) */
    #session_stream_warn {
      position: fixed; inset: 0; z-index: 2147483600; background: rgba(20,30,40,.94);
      color: #fff; display: flex; align-items: center; justify-content: center; text-align: left;
    }
    #session_stream_warn .box { max-width: 620px; padding: 0 24px; }
    #session_stream_warn h2 { color: #ffb4a2; margin: 0 0 14px; }
    #session_stream_warn p { font-size: 16px; line-height: 1.7; }
    #session_stream_warn button {
      margin-top: 18px; padding: 12px 26px; background: #1e8e4e; color: #fff; border: none;
      border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer;
    }
  </style>

  <!-- Whisper transcription worker — warmed up during Chunk 1; used by the RTA in Chunk 3.
       (Inline Blob Worker: no external file, no CORS issues on GitHub Pages.) -->
  <script>
    let __whisperWorker = null, __workerReady = false, __modelProgress = 0;
    const WORKER_CODE = `
      import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
      env.allowLocalModels = false;
      let transcriber = null, MODEL = 'Xenova/whisper-small.en';
      self.onmessage = async (e) => {
        const { type } = e.data;
        if (type === 'warmup') {
          MODEL = e.data.model || MODEL;
          try {
            transcriber = await pipeline('automatic-speech-recognition', MODEL, {
              progress_callback: (p) => { if (p && p.progress != null) self.postMessage({ type:'progress', progress: p.progress }); }
            });
            self.postMessage({ type:'ready' });
          } catch (err) { self.postMessage({ type:'error', message: String(err) }); }
        } else if (type === 'transcribe') {
          try {
            if (!transcriber) transcriber = await pipeline('automatic-speech-recognition', MODEL);
            const out = await transcriber(e.data.audioData, { chunk_length_s: 30, stride_length_s: 5 });
            self.postMessage({ type:'result', text: out && out.text ? out.text : '' });
          } catch (err) { self.postMessage({ type:'error', message: String(err) }); }
        }
      };`;
    function initWhisperWorker() {
      if (__whisperWorker) return;
      const url = URL.createObjectURL(new Blob([WORKER_CODE], { type: 'text/javascript' }));
      __whisperWorker = new Worker(url, { type: 'module' });
      __whisperWorker.onmessage = (e) => {
        const { type, progress } = e.data || {};
        if (type === 'progress') __modelProgress = progress || 0;
        else if (type === 'ready') __workerReady = true;
        else if (type === 'error') console.error('Whisper worker error:', e.data.message);
      };
      __whisperWorker.onerror = (e) => console.error('Whisper worker onerror:', e);
      __whisperWorker.postMessage({ type: 'warmup', model: CONFIG.WHISPER_MODEL });
    }
    function warmUpTranscriber() { initWhisperWorker(); }
  </script>
</head>
<body>
<script>
/* =====================================================================
   CAPABILITY GATE (hard) — from original checkBrowser. Fails fast on
   browsers lacking getDisplayMedia / getUserMedia / WebM MediaRecorder /
   WASM / Fullscreen, and on mobile.
   ===================================================================== */
(function checkBrowser() {
  const ua = navigator.userAgent;
  const isMobile  = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  const isFirefox = /Firefox\//i.test(ua);
  const isSafari  = /^((?!chrome|android|crios|edg|edge).)*safari/i.test(ua);
  const missing = [];
  if (!(navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === "function")) missing.push("screen recording (getDisplayMedia)");
  if (!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function"))    missing.push("microphone/camera access (getUserMedia)");
  let webmOK = false;
  if (typeof MediaRecorder !== "undefined" && typeof MediaRecorder.isTypeSupported === "function") {
    webmOK = MediaRecorder.isTypeSupported("video/webm") ||
             MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ||
             MediaRecorder.isTypeSupported("video/webm;codecs=vp8");
  }
  if (!webmOK) missing.push("WebM video recording (MediaRecorder)");
  if (typeof WebAssembly !== "object") missing.push("WebAssembly (speech processing)");
  const el = document.documentElement;
  if (!(el.requestFullscreen || el.webkitRequestFullscreen)) missing.push("fullscreen mode");

  if (isMobile || missing.length > 0) {
    let reason;
    if (isMobile)       reason = "mobile browsers (this study must run on a desktop or laptop)";
    else if (isFirefox) reason = "Firefox, which does not support tab-level screen recording";
    else if (isSafari)  reason = "Safari, which does not support the required recording format";
    else                reason = "this browser, which is missing: " + missing.join(", ");
    document.body.style.background = "#e3e9f0";
    document.body.innerHTML = `
      <div style="max-width:580px;margin:12% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;padding:0 20px;">
        <h2 style="color:#c0392b;">Unsupported Browser</h2>
        <p style="font-size:17px;line-height:1.7;">This study requires a <strong>Chromium-based desktop browser</strong> such as Google Chrome, Microsoft Edge, Arc, Brave, or Vivaldi.</p>
        <p style="font-size:15px;color:#566673;">The study uses tab-level screen recording and local speech processing that are not supported in ${reason}. Please reopen this link in a supported browser on a desktop or laptop computer.</p>
      </div>`;
    throw new Error("Unsupported browser — study halted (" + (isMobile ? "mobile" : missing.join("; ") || "ua") + ").");
  }
})();

/* =====================================================================
   CONFIG / SESSION STATE
   Experimental scaffolding removed per the pivot: no condition, no phase,
   no persistent-identifier survey, no OSF/DataPipe. Save = Qualtrics upload.
   ===================================================================== */
const CONFIG = {
  WHISPER_MODEL: "Xenova/whisper-small.en",
  SCREEN_FPS: 15,
  RTA_MAX_SECONDS: 240,
  /* Fullscreen viewport height at/above which gaze tracking is collected.
     Below this, calibration is skipped and the session runs no-gaze (all
     other data streams unaffected). Measured against AOI separability vs.
     the WebGazer error envelope; see the methods chapter. */
  GAZE_MIN_HEIGHT: 660,
  /* Qualtrics survey the participant returns to (to upload the session file).
     Filled in when the save chunk is built. */
  QUALTRICS_UPLOAD_URL: "REPLACE_WITH_QUALTRICS_UPLOAD_URL"
};

const study = {
  sub_id_from_url: new URLSearchParams(location.search).get("sub_id"),
  calibration: {},
  calibration_viewport: null,
  fullscreen_viewport: null,       // viewport measured right after programmatic fullscreen
  gaze_enabled: true,              // set false when fullscreen height < GAZE_MIN_HEIGHT
  gaze_skip_reason: null,
  gaze_threshold_used: null,       // the height cutoff this session was judged against (self-documenting)
  screen_geometry: {},
  browser_check: null,
  permissions: {},
  recording_started_at: null,      // ms epoch when the session recording began (RTA clock anchor)
  recording_viewport: null,        // viewport captured right after share+fullscreen settle
  cases: {},
  user_agent: navigator.userAgent,
  started_at: new Date().toISOString()
};
const caseMedia = {};              // keyed by recording id; here just "session"

/* =====================================================================
   SCREEN RECORDING (from original, unchanged)
   ===================================================================== */
function pickVideoMime() {
  for (const c of ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  return "";
}
async function startScreenRecording(id) {
  const stream = await navigator.mediaDevices.getDisplayMedia({
    video: { frameRate: CONFIG.SCREEN_FPS },
    audio: false,
    preferCurrentTab: true,        // Chrome/Edge 94+: pre-selects this tab in the picker
    selfBrowserSurface: "include"
  });
  const mime = pickVideoMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  caseMedia[id] = { stream, recorder: rec, chunks, blob: null, url: null };
  rec.start(1000);
  return stream;
}
function stopScreenRecording(id) {
  return new Promise(res => {
    const m = caseMedia[id];
    if (!m || !m.recorder || m.recorder.state === "inactive") return res();
    m.recorder.onstop = () => {
      m.blob = new Blob(m.chunks, { type: m.recorder.mimeType || "video/webm" });
      m.url  = URL.createObjectURL(m.blob);
      m.stream.getTracks().forEach(t => t.stop());
      res();
    };
    try { m.recorder.stop(); } catch (e) { res(); }
  });
}

/* =====================================================================
   PERMISSION GATE (from original, unchanged) — converts an unanswered
   getUserMedia prompt into visible, actionable text via a 30s timeout,
   asks from a user gesture, and records granted/no_response/error/abandoned.
   ===================================================================== */
function permissionGate(kind) {
  const isMic = (kind === "microphone");
  const constraint = isMic ? { audio: true } : { video: true };
  const why = isMic
    ? "Your microphone is used only for the think-aloud after each case. The audio is turned into text on your own computer. The recording itself is never uploaded, and only the text is kept."
    : "Your webcam is used only to estimate where you are looking on screen. This happens entirely on your own computer. No video is recorded or uploaded.";
  return {
    type: jsPsychHtmlKeyboardResponse,
    choices: "NO_KEYS",
    data: { trial_tag: "permission_gate_" + kind },
    stimulus: `<div style="max-width:560px;margin:8% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
        <h3 style="color:#1565c0;margin:0 0 12px;">${isMic ? "Microphone access" : "Webcam access"}</h3>
        <p style="font-size:15px;line-height:1.7;margin:0 0 20px;">${why}</p>
        <p id="pg_msg" style="font-size:14px;line-height:1.7;color:#44545f;margin:0 0 20px;">
          Click the button below. Your browser will ask for permission. Choose <strong>Allow</strong>.</p>
        <button id="pg_btn" style="background:#1565c0;color:#fff;border:none;border-radius:6px;padding:11px 22px;font-size:15px;cursor:pointer;font-family:inherit;">
          Enable ${isMic ? "microphone" : "webcam"}</button>
        <div id="pg_exit_wrap" style="display:none;margin-top:22px;">
          <button id="pg_exit" style="background:transparent;color:#7a8894;border:none;font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;">
            I'm unable to enable this. End the session</button>
        </div>
      </div>`,
    on_load: function () {
      const btn = document.getElementById("pg_btn");
      const msg = document.getElementById("pg_msg");
      const exitWrap = document.getElementById("pg_exit_wrap");
      const exitBtn  = document.getElementById("pg_exit");
      let settled = false, attempts = 0;
      function record(state, detail) {
        study.permissions[kind] = { state, detail: detail || null, attempts, t: new Date().toISOString() };
      }
      btn.addEventListener("click", async () => {
        if (settled) return;
        attempts++; btn.disabled = true; btn.style.opacity = ".6"; btn.textContent = "Waiting for your response…";
        msg.innerHTML = `Look for the permission prompt near your browser's address bar and click <strong>Allow</strong>. If you don't see it, check for a small ${isMic ? "microphone" : "camera"} icon at the right-hand end of the address bar.`;
        let timer;
        const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("PENDING_TIMEOUT")), 30000); });
        try {
          const stream = await Promise.race([ navigator.mediaDevices.getUserMedia(constraint), timeout ]);
          clearTimeout(timer);
          stream.getTracks().forEach(t => t.stop());   // release; the plugin reopens it
          settled = true; record("granted");
          msg.innerHTML = `<span style="color:#16692f;">Access granted. Continuing…</span>`;
          btn.style.display = "none";
          setTimeout(() => jsPsych.finishTrial(), 600);
        } catch (e) {
          clearTimeout(timer);
          const pending = (e && e.message === "PENDING_TIMEOUT");
          record(pending ? "no_response" : "error", e && e.name ? e.name : String(e));
          btn.disabled = false; btn.style.opacity = "1"; btn.textContent = "Try again";
          const devWord = isMic ? "Microphone" : "Camera";
          const osHelp = `<br><br><strong>If no prompt appeared at all</strong>, your browser may not have permission from your operating system:<br>
               &bull; <strong>macOS</strong>: System Settings &rsaquo; Privacy &amp; Security &rsaquo; ${devWord}, and switch on your browser.<br>
               &bull; <strong>Windows</strong>: Settings &rsaquo; Privacy &amp; security &rsaquo; ${devWord}, and allow desktop apps.<br>
               You may need to restart the browser afterwards.`;
          msg.innerHTML = pending
            ? `<strong style="color:#c0392b;">No response received.</strong> If a prompt appeared, choose <strong>Allow</strong>. If it is hidden, click the padlock icon at the left of the address bar and set <strong>${devWord}</strong> to <strong>Allow</strong>.${osHelp}`
            : (e && e.name === "NotFoundError")
              ? `<strong style="color:#c0392b;">No ${isMic ? "microphone" : "camera"} found.</strong> Your browser reports no device of this type is connected. Connect one and click Try again.`
              : `<strong style="color:#c0392b;">Access was blocked.</strong> Click the padlock icon at the left of the address bar, set <strong>${devWord}</strong> to <strong>Allow</strong>, then click Try again.${osHelp}`;
          if (attempts >= 2 && exitWrap) exitWrap.style.display = "block";
        }
      });
      if (exitBtn) exitBtn.addEventListener("click", () => {
        if (settled) return;
        settled = true; record("abandoned");
        jsPsych.endExperiment(`<div style="max-width:560px;margin:10% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
             <h3 style="color:#1565c0;">Session ended</h3>
             <p style="font-size:15px;line-height:1.7;">This study can't run without ${isMic ? "microphone" : "webcam"} access. Nothing has been recorded. Please email
             <a href="mailto:dennis.culver@drake.edu" style="color:#1565c0;">dennis.culver@drake.edu</a> if you'd like to take part on a different device.</p>
           </div>`);
      });
    }
  };
}

/* =====================================================================
   SESSION-LEVEL STREAM-ENDED HANDLER
   If the participant stops sharing (Esc, "Stop sharing", tab switch), do
   NOT advance the timeline. Show a persistent banner and require an explicit
   decision to re-share. (Refined further when the sim exists — Chunk 2.)
   ===================================================================== */
function attachStreamEndedHandler(stream) {
  const track = stream.getVideoTracks()[0];
  if (!track) return;
  track.addEventListener("ended", () => {
    if (document.getElementById("session_stream_warn")) return;
    const warn = document.createElement("div");
    warn.id = "session_stream_warn";
    warn.innerHTML = `<div class="box">
        <h2>Screen sharing stopped</h2>
        <p>The screen recording was interrupted, so nothing is being captured right now. The study can't continue until you resume sharing this tab.</p>
        <p>Click below, then choose <strong>this study's tab</strong> in the browser's share picker.</p>
        <button id="session_reshare">Resume screen sharing</button>
      </div>`;
    document.body.appendChild(warn);
    document.getElementById("session_reshare").addEventListener("click", async () => {
      try {
        try { await document.documentElement.requestFullscreen(); } catch (e) {}
        const s = await startScreenRecording("session");
        if (!document.fullscreenElement) { try { await document.documentElement.requestFullscreen(); } catch (e) {} }
        attachStreamEndedHandler(s);
        warn.remove();
      } catch (e) {
        // stays on the banner; participant can click again
        console.warn("Re-share failed:", e);
      }
    });
  });
}

/* =====================================================================
   GAZE SCORING HELPER (from original) — offset fallback when
   percent_in_roi is null.
   ===================================================================== */
function gazeQualityFromOffsets(offsets, roiRadius) {
  if (!offsets || !offsets.length) return { pct: null, quality: "unknown" };
  const mean = offsets.reduce((s, o) => s + (o.r || 0), 0) / offsets.length;
  const syntheticPct = Math.max(0, Math.min(100, Math.round((1 - mean / roiRadius) * 100)));
  const quality = syntheticPct >= 75 ? "good" : syntheticPct >= 55 ? "acceptable" : "poor";
  return { pct: syntheticPct, quality };
}

/* =====================================================================
   jsPsych INIT (WebGazer extension attached)
   ===================================================================== */
var jsPsych = initJsPsych({
  extensions: [{ type: jsPsychExtensionWebgazer }],
  on_finish: function () {
    // Chunk 1 placeholder end. (Real save = Qualtrics file upload, built later.)
    document.body.innerHTML = `<div style="max-width:620px;margin:12% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
        <h2 style="color:#1565c0;">Chunk 1 complete</h2>
        <p style="font-size:16px;line-height:1.7;">Scaffolding ran end to end: permissions → screen share + fullscreen → chinrest → calibration, all at the shared viewport. The session recording is running and the calibration viewport is locked to the task viewport.</p>
        <pre style="background:#f2f6fa;border:1px solid #d5dee7;border-radius:8px;padding:14px;font-size:12px;overflow:auto;">${
          JSON.stringify({
            recording_started_at: study.recording_started_at,
            fullscreen_viewport: study.fullscreen_viewport,
            recording_viewport: study.recording_viewport,
            gaze_enabled: study.gaze_enabled,
            gaze_skip_reason: study.gaze_skip_reason,
            gaze_threshold_used: study.gaze_threshold_used,
            calibration_viewport: study.calibration_viewport,
            calibration: study.calibration,
            screen_geometry: study.screen_geometry,
            permissions: study.permissions
          }, null, 2)
        }</pre>
        <p style="font-size:14px;color:#566673;">Next: Chunk 2 mounts the reasoning interface as an Option-B wrapper trial (practice → Florence → Yvonne).</p>
      </div>`;
  }
});

/* =====================================================================
   TIMELINE
   ===================================================================== */
var timeline = [];

/* 1 — ★ PROGRAMMATIC FULLSCREEN (button, no keyboard shortcut).
   Participants can't be relied on to press F11/Fn+F11. A single button
   enters fullscreen for them. We then measure the FULLSCREEN viewport and
   decide the gaze branch on it (not the smaller windowed viewport). */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  choices: "NO_KEYS",
  data: { trial_tag: "enter_fullscreen" },
  stimulus: `<div style="max-width:640px;margin:9% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <h2 style="color:#1565c0;">Full screen to begin</h2>
      <p style="font-size:17px;line-height:1.7;">This study runs in full screen so the whole interface fits and the eye tracking stays accurate. Click the button to continue in full screen.</p>
      <button id="fs_btn" style="margin-top:10px;padding:14px 30px;background:#1565c0;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;">Continue in full screen</button>
      <p id="fs_err" style="color:#c0392b;margin-top:10px;"></p>
    </div>`,
  on_load: function () {
    const btn = document.getElementById("fs_btn");
    const err = document.getElementById("fs_err");
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try { await document.documentElement.requestFullscreen(); }
      catch (fe) { console.warn("requestFullscreen (front) failed:", fe); }
      /* let the fullscreen resize settle before measuring */
      setTimeout(() => {
        const vh = window.innerHeight, vw = window.innerWidth;
        study.fullscreen_viewport = { w: vw, h: vh };
        study.gaze_threshold_used = CONFIG.GAZE_MIN_HEIGHT;
        study.gaze_enabled = vh >= CONFIG.GAZE_MIN_HEIGHT;
        study.gaze_skip_reason = study.gaze_enabled ? null : "viewport_height_below_threshold";
        jsPsych.finishTrial();
      }, 350);
    });
  }
});

/* 2 — Browser-check: WIDTH is a hard gate (below 1000 the columns collide);
   HEIGHT no longer rejects (minimum_height 0). Short screens proceed and run
   no-gaze instead of being turned away. Runs AFTER fullscreen, so it measures
   the real task viewport. Custom message wording uses "study", not the
   plugin default. */
timeline.push({
  type: jsPsychBrowserCheck,
  minimum_width: 1000,
  minimum_height: 0,
  allow_window_resize: true,
  window_resize_message: `<div style="max-width:620px;margin:10% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <p style="font-size:16px;line-height:1.7;">Your browser window is too narrow to complete this study. Please widen or maximize the window. The minimum width is 1000&nbsp;px.</p></div>`,
  inclusion_function: () => true,   // hard capability gating already handled by checkBrowser()
  on_finish: function (data) {
    study.browser_check = {
      browser: data.browser, browser_version: data.browser_version, os: data.os, mobile: data.mobile,
      width: data.width, height: data.height, webaudio: data.webaudio, fullscreen: data.fullscreen,
      vsync_rate: data.vsync_rate, webcam: data.webcam, microphone: data.microphone
    };
  }
});

/* 3 — Microphone permission + init (ALWAYS — the RTA needs audio regardless
   of the gaze branch). Camera is requested later, only in the gaze branch. */
timeline.push(permissionGate("microphone"));
timeline.push({
  type: jsPsychInitializeMicrophone,
  data: { trial_tag: "init_microphone" }
});

/* 4 — ★ SCREEN SHARE + FULLSCREEN re-assertion (ALWAYS). Recording is one
   continuous session stream. Re-asserts fullscreen in case it dropped, and
   captures recording_viewport (the definitive task viewport). */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  choices: "NO_KEYS",
  data: { trial_tag: "session_screen_share" },
  stimulus: `<div style="max-width:680px;margin:8% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <h2 style="color:#1565c0;">Share your screen to begin</h2>
      <p style="font-size:17px;line-height:1.7;">This tab is recorded so you can watch it back and talk through your reasoning after each case. The video stays on your computer and is never uploaded. Only your spoken reasoning (saved as text) and a record of your on-screen actions are kept. The recording is cleared at the end of the session.</p>
      <div style="background:#d3e4f5;border-left:4px solid #1565c0;padding:16px 20px;border-radius:6px;margin:18px 0;">
        <p style="margin:0;font-size:16px;">Click the button, then your browser asks you to <strong>select a tab to share</strong>. Choose <strong>this study's tab</strong> (not Window or Entire Screen).</p>
      </div>
      <button id="share_btn" style="margin-top:6px;padding:14px 30px;background:#1e8e4e;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;">Start recording</button>
      <p id="share_err" style="color:#c0392b;margin-top:10px;"></p>
    </div>`,
  on_load: function () {
    const btn = document.getElementById("share_btn");
    const err = document.getElementById("share_err");
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        /* requestFullscreen SYNCHRONOUSLY inside the gesture BEFORE any await —
           transient activation is consumed by the first await (getDisplayMedia). */
        try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (fe) { console.warn("requestFullscreen (pre-share) failed:", fe); }
        const s = await startScreenRecording("session");
        study.recording_started_at = Date.now();
        /* Re-enter fullscreen if the share picker dismissed it (common on macOS). */
        if (!document.fullscreenElement) { try { await document.documentElement.requestFullscreen(); } catch (fe) { console.warn("requestFullscreen (post-share re-enter) failed:", fe); } }
        study.recording_viewport = { w: window.innerWidth, h: window.innerHeight };
        attachStreamEndedHandler(s);
        setTimeout(() => jsPsych.finishTrial(), 400);
      } catch (e) {
        btn.disabled = false;
        err.textContent = "Screen share cancelled. Click the button again and select this study's tab from the list.";
        console.warn("getDisplayMedia failed/cancelled:", e);
      }
    });
  }
});

/* Gaze steps as named consts, mounted inside the conditional block below. */

/* Virtual chinrest (from original, unchanged). Measures px2deg for
   degrees-of-visual-angle gaze error. resize_units:"none" — measure only,
   never rescale (would move AOI coordinates). Runs at the shared viewport. */
const GAZE_CHINREST = {
  type: jsPsychVirtualChinrest,
  blindspot_reps: 5,
  resize_units: "none",
  item_path: null,
  adjustment_prompt: `<div style="max-width:560px;margin:0 auto;color:#16263d;font-family:'Segoe UI',Arial,sans-serif;text-align:left;">
      <p style="font-size:16px;line-height:1.6;">Hold a <strong>credit card, driver's license, or any card of that size</strong> up to the screen. Click and drag the lower-right corner of the image until it is exactly the same size as your card.</p>
      <p style="font-size:14px;color:#444;">No card handy? A standard card is 85.6&nbsp;mm wide (3.37&nbsp;inches). You can measure with a ruler instead.</p>
    </div>`,
  blindspot_prompt: `<div style="max-width:560px;margin:0 auto;color:#16263d;font-family:'Segoe UI',Arial,sans-serif;text-align:left;">
      <p style="font-size:16px;line-height:1.6;">Your distance from the screen will now be measured quickly.</p>
      <ul style="font-size:15px;line-height:1.9;padding-left:20px;">
        <li>Put your <strong>left hand on the space bar</strong>.</li>
        <li>Cover your <strong>right eye</strong> with your right hand.</li>
        <li>With your left eye, <strong>focus on the black square</strong> and keep focusing on it.</li>
        <li>A red ball will move left and disappear. Press the <strong>space bar the moment it disappears</strong>.</li>
      </ul>
      <p style="font-size:15px;">Press the space bar when you are ready to begin.</p>
    </div>`,
  on_finish: function (data) {
    study.screen_geometry = {
      px2deg: data.px2deg != null ? data.px2deg : null,
      px2mm:  data.px2mm  != null ? data.px2mm  : null,
      view_dist_mm: data.view_dist_mm != null ? data.view_dist_mm : null,
      win_width_deg: data.win_width_deg, win_height_deg: data.win_height_deg,
      scale_factor: data.scale_factor,
      measured: data.px2deg != null
    };
  }
};

/* Calibration → stabilise → validate (from original, unchanged).
   calibration_viewport is captured here and now MATCHES the task viewport,
   because share+fullscreen already happened above. */
var calib_points = [[10,10],[50,10],[90,10],[10,50],[50,50],[90,50],[10,90],[50,90],[90,90],[30,30],[70,30],[30,70],[70,70]];

var calibration_instructions = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div style="max-width:620px;margin:10% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <h2 style="color:#1565c0;margin-bottom:20px;">Eye-Tracking Calibration</h2>
      <p style="font-size:17px;margin-bottom:16px;">A series of yellow dots will appear one at a time around the screen.</p>
      <div style="background:#d3e4f5;border-left:4px solid #1565c0;padding:14px 18px;border-radius:6px;margin-bottom:16px;">
        <p style="font-size:17px;margin:0;"><strong>Click each dot</strong> as it appears. Look directly at it before clicking.</p>
      </div>
      <p style="font-size:15px;color:#44545f;margin-bottom:8px;">Tips for best accuracy:</p>
      <ul style="font-size:15px;color:#44545f;line-height:1.8;padding-left:20px;margin-bottom:24px;">
        <li>Sit approximately 50cm (20 inches) from your screen</li>
        <li>Keep your head still, move only your eyes</li>
        <li>Ensure your face is evenly lit from the front</li>
        <li>Maximize your screen brightness</li>
      </ul>
      <p style="color:#44545f;">Press any key to begin calibration.</p>
    </div>`
};
var calibration_grid = {
  type: jsPsychWebgazerCalibrate, calibration_mode: "click", calibration_points: calib_points, point_size: 26,
  on_finish: function () { study.calibration_viewport = { w: window.innerWidth, h: window.innerHeight }; }
};
var calibration_stabilise = {
  type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS", trial_duration: 1500,
  stimulus: `<div style="max-width:620px;margin:10% auto;text-align:center;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <p style="font-size:17px;color:#1565c0;">Calibrating…</p></div>`
};
var validation_instructions = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div style="max-width:620px;margin:10% auto;text-align:center;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <h2 style="color:#1565c0;margin-bottom:20px;">Testing Accuracy</h2>
      <p style="font-size:17px;">Another set of dots will appear. This time:</p>
      <div style="background:#d3e4f5;border-left:4px solid #16692f;padding:14px 18px;border-radius:6px;margin:20px auto;max-width:420px;text-align:left;">
        <p style="font-size:17px;margin:0;"><strong>Do not click.</strong> Just <strong>look</strong> directly at each dot until it disappears.</p>
      </div>
      <p style="color:#44545f;margin-top:24px;">Press any key to begin.</p>
    </div>`
};
const GAZE_CALIBRATION = {
  timeline: [ calibration_instructions, calibration_grid, calibration_stabilise, validation_instructions, {
    type: jsPsychWebgazerValidate,
    validation_points: calib_points,
    roi_radius: 150,
    time_limit: 2200,
    show_validation_data: false,
    on_finish: function (data) {
      const pct = data.percent_in_roi;
      const offsets = data.average_offset;
      const scored = (pct != null)
        ? { pct: Math.round(pct), quality: pct >= 75 ? "good" : pct >= 55 ? "acceptable" : "poor" }
        : gazeQualityFromOffsets(offsets, 150);
      const px2deg = (study.screen_geometry && study.screen_geometry.px2deg) || null;
      let meanOffsetPx = null, meanOffsetDeg = null;
      if (offsets && offsets.length) {
        meanOffsetPx = offsets.reduce((s, o) => s + (o.r || 0), 0) / offsets.length;
        if (px2deg != null && px2deg > 0) meanOffsetDeg = +(meanOffsetPx / px2deg).toFixed(3);
      }
      study.calibration = {
        calibration_pct: scored.pct, calibration_pct_raw: pct,
        average_offset: offsets, roi_radius_used: 150,
        gaze_quality: scored.quality,
        score_method: pct != null ? "percent_in_roi" : "offset_fallback",
        mean_offset_px: meanOffsetPx != null ? Math.round(meanOffsetPx) : null,
        mean_offset_deg: meanOffsetDeg, px2deg_used: px2deg,
        view_dist_mm: (study.screen_geometry && study.screen_geometry.view_dist_mm) || null
      };
    }
  }]
};

/* 5 — ★ GAZE BRANCH (conditional). Camera permission, camera init, chinrest,
   and calibration/validation run ONLY when the fullscreen viewport cleared
   GAZE_MIN_HEIGHT. Below it, this whole block is skipped: no webcam is even
   requested, and the session proceeds no-gaze. All other streams unaffected. */
timeline.push({
  conditional_function: function () { return study.gaze_enabled; },
  timeline: [
    permissionGate("camera"),
    { type: jsPsychWebgazerInitCamera, data: { trial_tag: "init_camera" } },
    GAZE_CHINREST,
    GAZE_CALIBRATION
  ]
});

/* 6 — Whisper warmup (background). Loads the model while the participant
   reads; used by the RTA in Chunk 3. */
timeline.push({
  type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
  data: { trial_tag: "whisper_warmup" },
  stimulus: `<div style="max-width:580px;margin:12% auto;text-align:center;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <h3 style="color:#1565c0;margin-bottom:16px;">Preparing speech analysis tools</h3>
      <p style="color:#44545f;margin-bottom:20px;">A speech model is loading in a background thread. The page stays responsive.<br>This only happens once.</p>
      <p style="color:#8a9aa7;font-size:14px;">Continuing automatically…</p>
    </div>`,
  trial_duration: 1500,
  on_load: function () { warmUpTranscriber(); }
});

/* END OF CHUNK 1 — on_finish placeholder renders the captured session state. */
jsPsych.run(timeline);
</script>
</body>
</html>
