<!DOCTYPE html>
<!-- OT Professional Reasoning Study - FULL INSTRUMENT (Chunks 1-4 integrated). Assembled from index_chunk2.html scaffolding + Option-B engine/replay + integration layer. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>OT Professional Reasoning Study</title>

  <script src="js/jspsych.js"></script>
  <link href="js/jspsych.css" rel="stylesheet" type="text/css" />
  <script src="js/plugin-html-keyboard-response.js"></script>

  <script src="js/plugin-initialize-microphone.js"></script>
  <script src="js/plugin-browser-check.js"></script>

  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; }
  
  /* ============== OT REASONING ENGINE STYLES (verified prototype) ============== */
  :root{
    --page:#E7ECF1; --panel:#FFFFFF; --line:#D5DEE7; --line-soft:#E9EEF3;
    --ink:#17232E; --ink-soft:#566574; --ink-faint:#8A9AA7;
    --accent:#1E6BB8; --accent-ink:#12507f;
    --occ:#6C4BB0; --occ-soft:#EFEBF8; --occ-line:#CBC0EB; --occ-ink:#4A3184;
    --sup:#0F766E; --sup-soft:#E2F1EF; --sup-line:#A6D3CD; --sup-ink:#0B5750;
    --bar:#C2540C; --bar-soft:#FBEADD; --bar-line:#E9BE9C; --bar-ink:#8A3B0C;
    --gutter:36px; --r:9px;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  /* jsPsych owns <body>; engine host is #ot_mount (fixed, full viewport). */
  #ot_mount{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;z-index:1;text-align:left}
  button{font-family:inherit}
  ::selection{background:#bcd7ef}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* in-text classification marks — painted via CSS Custom Highlight API, no DOM mutation */
  ::highlight(ot-support){background-color:#CFE9E4;}
  ::highlight(ot-barrier){background-color:#F8DCC6;}

  .proto{background:#22333f;color:#cfe0ec;font-size:12px;letter-spacing:.04em;padding:5px 16px;display:flex;align-items:center;gap:14px;flex-shrink:0}
  .proto strong{color:#fff;font-weight:600}
  .proto .sp{flex:1}
  .proto button{background:transparent;color:#bcd0df;border:1px solid #3d5160;border-radius:5px;padding:4px 12px;font-size:12px;cursor:pointer}
  .proto button:hover{background:#2c4150;color:#fff}
  .case-switch{display:flex;gap:4px;margin-left:12px;padding-left:12px;border-left:1px solid #3d5160}
  .case-switch button{padding:3px 11px;border-radius:5px;border:1px solid #3d5160;background:transparent;color:#9fb4c4;font-size:12px;cursor:pointer}
  .case-switch button.active{background:#e7ecf1;color:#22333f;border-color:#e7ecf1;font-weight:600}
  .banner .role-badge{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:2px 9px;border-radius:20px;margin-left:2px}
  .banner .role-badge.practice{font-size:13px;font-weight:800;letter-spacing:.1em;padding:4px 14px;margin-left:8px;background:#F5A623;color:#3a2600;border:1px solid #d98c0e;box-shadow:0 1px 3px rgba(245,166,35,.4)}
  .banner .role-badge.real{background:var(--occ-soft);color:var(--occ-ink);border:1px solid var(--occ-line)}

  .banner{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:18px;flex-shrink:0}
  .banner h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
  .banner .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
  .banner .chip{font-size:12px;color:var(--ink-soft);background:#F1F5F9;border:1px solid var(--line);border-radius:20px;padding:2px 11px}
  .banner .chip b{color:var(--ink);font-weight:600}

  /* Synthesis panel fields */
  .syn-field{margin-bottom:16px}
  .syn-field:last-child{margin-bottom:0}
  .syn-lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:3px}
  .syn-hint{font-size:12px;color:var(--ink-faint);line-height:1.4;margin-bottom:7px}
  #synthesis_impression{width:100%;resize:vertical;min-height:88px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 12px;font-family:inherit;font-size:14px;color:var(--ink);line-height:1.45}
  #synthesis_impression:focus{outline:none;border-color:var(--accent)}
  .syn-field .stamp{font-size:11px;color:var(--ink-faint);font-family:var(--mono);text-align:right;margin-top:4px}
  .btn-syn{background:var(--occ);color:#fff}
  .btn-syn:hover{background:#5c3f97}
  .out-card{background:var(--occ-soft);border:1px solid var(--occ-line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
  .out-card .out-top{display:flex;align-items:center;gap:9px}
  .out-card .dot{width:9px;height:9px;border-radius:50%;background:var(--occ);flex:none}
  .out-card .nm{flex:1;font-size:13.5px;font-weight:600;color:var(--occ-ink);min-width:0}
  .out-card .rm{background:none;border:none;color:var(--occ-ink);opacity:.55;cursor:pointer;font-size:17px;line-height:1;padding:0 2px;flex:none}
  .out-card .rm:hover{opacity:1}
  .out-card .out-tag{width:100%;margin-top:7px;border:1px solid var(--occ-line);border-radius:6px;padding:5px 8px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--ink)}
  .out-card .out-tag:focus{outline:none;border-color:var(--occ)}

  /* #app is injected by renderCase and wraps banner + main.
     It MUST be a flex column that fills the remaining body height, or the
     height chain never reaches the panels and they grow with content
     instead of scrolling internally — which would break AOI-rect stability. */
  #app{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .main{flex:1;min-height:0;display:flex;gap:var(--gutter);padding:var(--gutter);background:var(--page);overflow:hidden}
  .col{display:flex;flex-direction:column;gap:var(--gutter);min-width:0;min-height:0;overflow:hidden}
  .col.case{flex:0 0 40%}
  .col.mid{flex:0 0 27%}
  .col.plan{flex:1}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;min-height:0}
  .panel.grow{flex:1}
  .panel-head{padding:11px 15px;border-bottom:1px solid var(--line-soft);flex-shrink:0;display:flex;align-items:center;gap:10px}
  .panel-head .ey{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .panel-head .count{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-faint);background:#F1F5F9;border-radius:20px;padding:1px 9px;font-family:var(--mono)}
  .panel-body{padding:14px 15px;overflow-y:auto;flex:1;min-height:0}
  .panel-body::-webkit-scrollbar{width:10px}
  .panel-body::-webkit-scrollbar-thumb{background:#cdd8e2;border-radius:5px;border:3px solid var(--panel)}

  .tabs{display:flex;gap:2px;padding:0 15px;border-bottom:1px solid var(--line-soft);flex-shrink:0;background:var(--panel)}
  .tab{padding:11px 13px 9px;background:none;border:none;border-bottom:2.5px solid transparent;color:var(--ink-soft);font-size:12.5px;font-weight:600;letter-spacing:.01em;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tabpage{display:none}
  .tabpage.active{display:block}

  .sect{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)}
  .sect:first-child{margin-top:0}
  .clin{margin:0 0 11px}
  .clin p{margin:0 0 9px}
  .kv{display:flex;gap:10px;margin:0 0 6px;font-size:14px}
  .kv .k{flex:none;width:150px;color:var(--ink-soft);font-weight:600}
  .kv .v{flex:1}
  .num{font-family:var(--mono);font-size:13px}
  .dtbl{border-collapse:collapse;margin:8px 0 4px;font-size:13.5px}
  .dtbl th,.dtbl td{border:1px solid var(--line);padding:5px 16px;text-align:left}
  .dtbl th{background:#F4F8FB;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
  .dtbl td.n{font-family:var(--mono)}
  .libcard{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin:0 0 12px;background:#FCFDFE}
  .libcard h4{margin:0 0 7px;font-size:14.5px;color:var(--ink);font-weight:650}
  .libcard p{margin:0 0 8px;font-size:13.5px;color:#33424f}
  .libcard .cite{font-size:11.5px;color:var(--ink-faint);font-style:italic;line-height:1.45;border-top:1px solid var(--line-soft);padding-top:7px;margin-top:9px}
  .libcard.ref{background:var(--occ-soft);border-color:var(--occ-line)}
  .libcard.ref h4{color:var(--occ-ink)}
  .libcard ul{margin:6px 0;padding-left:20px}
  .libcard li{margin:3px 0;font-size:13.5px;color:#33424f}
  .interim{background:#FFF6E9;border:1px solid #EBD9B4;border-radius:7px;padding:10px 13px;margin:12px 0;font-size:13.5px}
  .interim .tag{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8a5a12;display:block;margin-bottom:3px}

  .occ-add{display:flex;gap:7px;margin-bottom:12px}
  .occ-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-family:inherit;font-size:13.5px}
  .occ-add input:focus{outline:none;border-color:var(--occ)}
  .btn{border:none;border-radius:7px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-occ{background:var(--occ);color:#fff}
  .btn-occ:hover{background:#5c3f97}
  .occ-card{display:flex;align-items:center;gap:9px;background:var(--occ-soft);border:1px solid var(--occ-line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
  .occ-card .dot{width:9px;height:9px;border-radius:50%;background:var(--occ);flex:none}
  .occ-card .nm{flex:1;font-size:13.5px;font-weight:600;color:var(--occ-ink);min-width:0}
  .occ-card .tally{font-size:11px;font-family:var(--mono);color:var(--occ-ink);opacity:.7;flex:none}
  .occ-card .rm{background:none;border:none;color:var(--occ-ink);opacity:.55;cursor:pointer;font-size:17px;line-height:1;padding:0 2px;flex:none}
  .occ-card .rm:hover{opacity:1}
  .empty{color:var(--ink-faint);font-size:13px;line-height:1.5;text-align:center;padding:18px 8px}
  .empty b{color:var(--ink-soft);display:block;margin-bottom:3px;font-weight:600}

  .pa-occ{margin-bottom:15px}
  .pa-occ-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--occ-ink);margin-bottom:6px}
  .pa-occ-h .dot{width:8px;height:8px;border-radius:50%;background:var(--occ);flex:none}
  .pa-entry{border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;border:1px solid}
  .pa-entry.sup{background:var(--sup-soft);border-color:var(--sup-line)}
  .pa-entry.bar{background:var(--bar-soft);border-color:var(--bar-line)}
  .pa-entry .top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .pa-entry .glyph{font-size:11px;font-weight:800}
  .pa-entry.sup .glyph,.pa-entry.sup .lab{color:var(--sup-ink)}
  .pa-entry.bar .glyph,.pa-entry.bar .lab{color:var(--bar-ink)}
  .pa-entry .lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .pa-entry .aspect{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:20px;border:1px solid currentColor;opacity:.85}
  .pa-entry .rm{margin-left:auto;background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;opacity:.5}
  .pa-entry .rm:hover{opacity:1}
  .pa-entry .exc{color:#3a4650;font-style:italic;line-height:1.4}
  .pa-entry .mech{margin-top:4px;font-size:11.5px}
  .pa-entry.sup .mech{color:var(--sup-ink)}
  .pa-entry.bar .mech{color:var(--bar-ink)}
  .pa-entry .mech b{font-weight:700}
  .unlinked{opacity:.75}

  .ip-step{margin-bottom:16px}
  .ip-step > .lbl{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;display:block}
  .ip-step > .hint{font-size:12px;color:var(--ink-faint);margin:-2px 0 7px}
  .ip-bar-pick{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--bar-line);background:var(--bar-soft);border-radius:7px;margin-bottom:6px;cursor:pointer}
  .ip-bar-pick input{margin-top:3px;accent-color:var(--bar)}
  .ip-bar-pick .txt{font-size:12.5px;color:var(--bar-ink)}
  .ip-bar-pick .txt .mech{font-weight:700}
  textarea.ip,.ip-card textarea{width:100%;resize:vertical;min-height:52px;border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-family:inherit;font-size:13.5px;line-height:1.45}
  textarea.ip:focus{outline:none;border-color:var(--accent)}
  .ip-card{border:1px solid var(--line);border-left:3px solid var(--bar);border-radius:8px;padding:12px 13px;margin-bottom:11px;background:#FCFDFE}
  .ip-card .cardh{font-size:12.5px;font-weight:700;color:var(--bar-ink);margin-bottom:9px;line-height:1.4}
  .ip-field{margin-bottom:9px}
  .ip-field label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:4px}
  select.ip{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
  select.ip:focus{outline:none;border-color:var(--accent)}

  .pop{position:fixed;z-index:1000;background:#fff;border:1px solid #cdd8e2;border-radius:10px;box-shadow:0 10px 34px rgba(20,40,60,.22);padding:12px;width:290px;font-size:13px;animation:pop .13s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pop .exc{font-style:italic;color:#3a4650;background:#F4F8FB;border-radius:6px;padding:7px 9px;margin-bottom:10px;font-size:12.5px;line-height:1.4;max-height:70px;overflow:auto}
  .pop .q{font-size:12px;font-weight:700;color:var(--ink);margin:8px 0 6px}
  .pop .q .opt{font-weight:600;color:var(--ink-faint);text-transform:none;letter-spacing:0}
  .pop .row2{display:flex;gap:8px}
  .pop .pick{flex:1;border:1.5px solid;border-radius:8px;padding:9px 6px;cursor:pointer;background:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:5px}
  .pop .pick.sup{border-color:var(--sup-line);color:var(--sup-ink)}
  .pop .pick.sup:hover{background:var(--sup-soft)}
  .pop .pick.bar{border-color:var(--bar-line);color:var(--bar-ink)}
  .pop .pick.bar:hover{background:var(--bar-soft)}
  .pop input[type=text],.pop select{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;margin-bottom:2px}
  .pop input[type=text]:focus,.pop select:focus{outline:none;border-color:var(--accent)}
  .pop .confirm{width:100%;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:9px;font-weight:700;font-size:13px;cursor:pointer;margin-top:8px}
  .pop .confirm:hover{background:var(--accent-ink)}
  .pop .confirm:disabled{background:#c3cfda;cursor:not-allowed}
  .pop .back{background:none;border:none;color:var(--ink-faint);font-size:12px;cursor:pointer;padding:2px 0;margin-bottom:4px}
  .pop .back:hover{color:var(--ink-soft)}
  .pop .warn{color:var(--bar-ink);font-size:12px;line-height:1.45;background:var(--bar-soft);border:1px solid var(--bar-line);border-radius:7px;padding:9px 10px}
  /* ── PRACTICE WALKTHROUGH (practice case only) ── */
  .coach{position:fixed;z-index:1200;width:300px;background:#22333f;color:#eaf1f6;border-radius:11px;
    box-shadow:0 14px 40px rgba(10,25,40,.34);padding:15px 16px 13px;font-size:13.5px;line-height:1.5;animation:pop .14s ease-out}
  .coach h5{margin:0 0 6px;font-size:13px;font-weight:700;color:#fff;letter-spacing:.01em}
  .coach p{margin:0 0 12px;color:#c6d4de}
  .coach .cbtns{display:flex;align-items:center;gap:8px}
  .coach .cbtns .step{font-size:11px;color:#8fa6b6;font-family:var(--mono);margin-right:auto}
  .coach button{border:1px solid #3d5160;background:transparent;color:#cfe0ec;border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .coach button.primary{background:#e7ecf1;color:#22333f;border-color:#e7ecf1}
  .coach button:hover{background:#2c4150;color:#fff}
  .coach button.primary:hover{background:#fff}
  .coach .arrow{position:absolute;width:12px;height:12px;background:#22333f;transform:rotate(45deg)}

  .cl{position:fixed;bottom:16px;right:16px;z-index:1150;
    background:#FFF7EA;border:1.5px solid #E7C588;border-radius:12px;box-shadow:0 10px 34px rgba(80,55,10,.22);
    width:min(330px,calc(100vw - 32px));overflow:hidden}
  .cl-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;user-select:none}
  .cl-bar .badge{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#8a5a12;background:#FEF3E2;border:1px solid #EBD9B4;border-radius:20px;padding:2px 9px}
  .cl-bar .prog{font-size:13px;font-weight:600;color:var(--ink)}
  .cl-bar .prog b{color:var(--accent)}
  .cl-bar .sp{flex:1}
  .cl-bar .guide{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;font-weight:600}
  .cl-bar .caret{color:var(--ink-faint);font-size:12px;transition:transform .15s}

  .cl-body{display:none;border-top:1px solid #EBD3A0;padding:10px 14px 13px}
  .cl.open .cl-body{display:block}
  .cl-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px}
  .cl-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
  .cl-item .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .cl-item.done{color:var(--ink)}
  .cl-item.done .box{background:var(--sup);border-color:var(--sup)}
  .cl-continue{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13.5px;font-weight:700;cursor:pointer}
  .cl-continue:hover{background:var(--accent-ink)}
  .cl-continue:disabled{background:#c3cfda;cursor:not-allowed}
</style>

  <!-- Whisper transcription worker — warmed up during Chunk 1; used by the RTA in Chunk 3.
       (Inline Blob Worker: no external file, no CORS issues on GitHub Pages.) -->
  <script>
    let __whisperWorker = null, __workerReady = false, __modelProgress = 0;
    const WORKER_CODE = `
      import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
      env.allowLocalModels = false;
      let transcriber = null, MODEL = 'Xenova/whisper-small.en', MODEL_REVISION = 'fa16a75f5d91e83ecb6a2ccb690f14d91ef00ca4';
      self.onmessage = async (e) => {
        const { type } = e.data;
        if (type === 'warmup') {
          MODEL = e.data.model || MODEL;
          try {
            transcriber = await pipeline('automatic-speech-recognition', MODEL, {
              revision: MODEL_REVISION,
              progress_callback: (p) => { if (p && p.progress != null) self.postMessage({ type:'progress', progress: p.progress }); }
            });
            self.postMessage({ type:'ready' });
          } catch (err) { self.postMessage({ type:'error', message: String(err) }); }
        } else if (type === 'transcribe') {
          try {
            if (!transcriber) transcriber = await pipeline('automatic-speech-recognition', MODEL, { revision: MODEL_REVISION });
            const out = await transcriber(e.data.audioData, { chunk_length_s: 30, stride_length_s: 5, return_timestamps: true });
            self.postMessage({ type:'result', id: e.data.id, text: out && out.text ? out.text : '', chunks: out && out.chunks ? out.chunks : [] });
          } catch (err) { self.postMessage({ type:'error', id: e.data.id, message: String(err) }); }
        }
      };`;
    function initWhisperWorker() {
      if (__whisperWorker) return;
      if (typeof window!=='undefined' && window.setWhisperStatus) window.setWhisperStatus('init');
      const url = URL.createObjectURL(new Blob([WORKER_CODE], { type: 'text/javascript' }));
      __whisperWorker = new Worker(url, { type: 'module' });
      __whisperWorker.onmessage = (e) => {
        const { type, progress } = e.data || {};
        if (type === 'progress') { __modelProgress = progress || 0; if (typeof window!=='undefined' && window.setWhisperStatus) window.setWhisperStatus('downloading',{progress:__modelProgress}); }
        else if (type === 'ready') { __workerReady = true; if (typeof window!=='undefined' && window.setWhisperStatus) window.setWhisperStatus('ready'); }
        else if (type === 'error') { console.error('Whisper worker error:', e.data.message); if (typeof window!=='undefined' && window.setWhisperStatus) window.setWhisperStatus('error'); if (typeof window!=='undefined' && window.__onWhisperError) window.__onWhisperError(e.data); }
        else if (type === 'result') { if (typeof window!=='undefined' && window.__onWhisperResult) window.__onWhisperResult(e.data); }
      };
      __whisperWorker.onerror = (e) => { console.error('Whisper worker onerror:', e); if (typeof window!=='undefined' && window.setWhisperStatus) window.setWhisperStatus('error'); if (typeof window!=='undefined' && window.__onWhisperError) window.__onWhisperError({ message: (e && e.message) || 'worker error' }); };
      __whisperWorker.postMessage({ type: 'warmup', model: CONFIG.WHISPER_MODEL });
    }
    function warmUpTranscriber() { initWhisperWorker(); }

    window.__whisperUI = { state:'idle', progress:0, compact:false };
    window.setWhisperStatus = function(state, detail){
      var w = window.__whisperUI; w.state = state;
      if (detail && detail.progress != null) w.progress = detail.progress;
      w.compact = false;
      if (state === 'ready') { clearTimeout(w._c); w._c = setTimeout(function(){ w.compact = true; window.__renderWhisperChip(); }, 5000); }
      if (state === 'transcribed' || state === 'empty') { clearTimeout(w._r); w._r = setTimeout(function(){ window.setWhisperStatus('ready'); }, 6000); }
      window.__renderWhisperChip();
    };
    window.__renderWhisperChip = function(){
      if (!document.body) return;
      var w = window.__whisperUI, st = w.state;
      if (st === 'idle') { var ex=document.getElementById('whisper_status'); if(ex) ex.remove(); return; }
      var el = document.getElementById('whisper_status');
      if (!el) { el = document.createElement('div'); el.id = 'whisper_status';
        el.style.cssText = 'position:fixed;top:10px;right:12px;z-index:10009;font:600 12px system-ui;padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 6px rgba(0,0,0,.15);pointer-events:none;transition:opacity .3s';
        document.body.appendChild(el); }
      var M = { init:['#4b5563','#f3f4f6','Preparing speech model…'],
                downloading:['#92400e','#fef3c7','Loading speech model… '+Math.round(w.progress||0)+'%'],
                ready:['#166534','#dcfce7','Speech model ready'],
                transcribing:['#1e40af','#dbeafe','Transcribing your narration…'],
                transcribed:['#166534','#dcfce7','Narration transcribed'],
                empty:['#92400e','#fef3c7','No speech detected'],
                error:['#991b1b','#fee2e2','Speech model unavailable'] };
      var m = M[st] || M.init;
      el.style.color = m[0]; el.style.background = m[1];
      var dot = '<span style="width:8px;height:8px;border-radius:50%;background:'+m[0]+';display:inline-block;flex:0 0 auto"></span>';
      el.innerHTML = (w.compact && st==='ready') ? dot : dot + '<span>'+m[2]+'</span>';
    };

  </script>

<body>
<script>

/* =====================================================================
   CAPABILITY GATE (hard) — from original checkBrowser. Fails fast on
   browsers lacking getUserMedia / WebM MediaRecorder /
   WASM / Fullscreen, and on mobile.
   ===================================================================== */
(function checkBrowser() {
  const ua = navigator.userAgent;
  const isMobile  = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  const isFirefox = /Firefox\//i.test(ua);
  const isSafari  = /^((?!chrome|android|crios|edg|edge).)*safari/i.test(ua);
  const missing = [];
  if (!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function"))    missing.push("microphone/camera access (getUserMedia)");
  const recOK = (typeof MediaRecorder !== "undefined");
  if (!recOK) missing.push("audio recording (MediaRecorder)");
  if (typeof WebAssembly !== "object") missing.push("WebAssembly (speech processing)");
  const el = document.documentElement;
  if (!(el.requestFullscreen || el.webkitRequestFullscreen)) missing.push("fullscreen mode");

  if (isMobile || missing.length > 0) {
    let reason;
    if (isMobile)       reason = "mobile browsers (this study must run on a desktop or laptop)";
    else                reason = "this browser, which is missing: " + missing.join(", ");
    document.body.style.background = "#e3e9f0";
    document.body.innerHTML = `
      <div style="max-width:580px;margin:12% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;padding:0 20px;">
        <h2 style="color:#c0392b;">Unsupported Browser</h2>
        <p style="font-size:17px;line-height:1.7;">This study runs in an up-to-date <strong>desktop web browser</strong> such as Chrome, Edge, Firefox, or Safari.</p>
        <p style="font-size:15px;color:#566673;">The study uses local speech processing that is not supported in ${reason}. Please reopen this link in a supported browser on a desktop or laptop computer.</p>
      </div>`;
    throw new Error("Unsupported browser — study halted (" + (isMobile ? "mobile" : missing.join("; ") || "ua") + ").");
  }
})();

/* =====================================================================
   CONFIG / SESSION STATE
   ===================================================================== */
const CONFIG = {
  WHISPER_MODEL: "Xenova/whisper-small.en",
  /* Qualtrics survey the participant returns to (to upload the session file).
     Filled in when the save chunk is built. */
  QUALTRICS_UPLOAD_URL: "REPLACE_WITH_QUALTRICS_UPLOAD_URL"
};

const __q = new URLSearchParams(location.search);
const study = {
  sub_id_from_url: __q.get("sub_id"),
  group: __q.get("group"),
  year_in_program: __q.get("year"),
  url_params: Object.fromEntries(__q.entries()),
  browser_check: null,
  permissions: {},
  session_started_at_ms: null,     // ms epoch session clock anchor (set at fullscreen); RTA/case-offset zero
  task_viewport: null,             // task viewport captured right after fullscreen settle
  cases: {},
  user_agent: navigator.userAgent,
  started_at: new Date().toISOString()
};
/* =====================================================================
   MICROPHONE PERMISSION GATE - converts an unanswered getUserMedia prompt
   into visible, actionable text via a 30s timeout, asks from a user gesture,
   and records granted/no_response/error/abandoned.
   ===================================================================== */
function permissionGate(kind) {
  return {
    type: jsPsychHtmlKeyboardResponse,
    choices: "NO_KEYS",
    data: { trial_tag: "permission_gate_" + kind },
    stimulus: `<div style="max-width:560px;margin:8% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
        <h3 style="color:#1565c0;margin:0 0 12px;">Microphone access</h3>
        <p style="font-size:15px;line-height:1.7;margin:0 0 20px;">Your microphone is used only for the think-aloud after each case. The audio is turned into text on your own computer. The recording itself is never uploaded, and only the text is kept.</p>
        <p id="pg_msg" style="font-size:14px;line-height:1.7;color:#44545f;margin:0 0 20px;">
          Click the button below. Your browser will ask for permission. Choose <strong>Allow</strong>.</p>
        <button id="pg_btn" style="background:#1565c0;color:#fff;border:none;border-radius:6px;padding:11px 22px;font-size:15px;cursor:pointer;font-family:inherit;">
          Enable microphone</button>
        <div id="pg_exit_wrap" style="display:none;margin-top:22px;">
          <button id="pg_exit" style="background:transparent;color:#7a8894;border:none;font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;">
            I'm unable to enable this. End the session</button>
        </div>
      </div>`,
    on_load: function () {
      const btn = document.getElementById("pg_btn");
      const msg = document.getElementById("pg_msg");
      const exitWrap = document.getElementById("pg_exit_wrap");
      const exitBtn  = document.getElementById("pg_exit");
      let settled = false, attempts = 0;
      function record(state, detail) {
        study.permissions[kind] = { state, detail: detail || null, attempts, t: new Date().toISOString() };
      }
      btn.addEventListener("click", async () => {
        if (settled) return;
        attempts++; btn.disabled = true; btn.style.opacity = ".6"; btn.textContent = "Waiting for your response...";
        msg.innerHTML = `Look for the permission prompt near your browser's address bar and click <strong>Allow</strong>. If you don't see it, check for a small microphone icon at the right-hand end of the address bar.`;
        let timer;
        const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("PENDING_TIMEOUT")), 30000); });
        try {
          const stream = await Promise.race([ navigator.mediaDevices.getUserMedia({ audio: true }), timeout ]);
          clearTimeout(timer);
          stream.getTracks().forEach(t => t.stop());   // release; the plugin reopens it
          settled = true; record("granted");
          msg.innerHTML = `<span style="color:#16692f;">Access granted. Continuing...</span>`;
          btn.style.display = "none";
          setTimeout(() => jsPsych.finishTrial(), 600);
        } catch (e) {
          clearTimeout(timer);
          const pending = (e && e.message === "PENDING_TIMEOUT");
          record(pending ? "no_response" : "error", e && e.name ? e.name : String(e));
          btn.disabled = false; btn.style.opacity = "1"; btn.textContent = "Try again";
          const osHelp = `<br><br><strong>If no prompt appeared at all</strong>, your browser may not have permission from your operating system:<br>
               &bull; <strong>macOS</strong>: System Settings &rsaquo; Privacy &amp; Security &rsaquo; Microphone, and switch on your browser.<br>
               &bull; <strong>Windows</strong>: Settings &rsaquo; Privacy &amp; security &rsaquo; Microphone, and allow desktop apps.<br>
               You may need to restart the browser afterwards.`;
          msg.innerHTML = pending
            ? `<strong style="color:#c0392b;">No response received.</strong> If a prompt appeared, choose <strong>Allow</strong>. If it is hidden, click the padlock icon at the left of the address bar and set <strong>Microphone</strong> to <strong>Allow</strong>.${osHelp}`
            : (e && e.name === "NotFoundError")
              ? `<strong style="color:#c0392b;">No microphone found.</strong> Your browser reports no microphone is connected. Connect one and click Try again.`
              : `<strong style="color:#c0392b;">Access was blocked.</strong> Click the padlock icon at the left of the address bar, set <strong>Microphone</strong> to <strong>Allow</strong>, then click Try again.${osHelp}`;
          if (attempts >= 2 && exitWrap) exitWrap.style.display = "block";
        }
      });
      if (exitBtn) exitBtn.addEventListener("click", () => {
        if (settled) return;
        settled = true; record("abandoned");
        jsPsych.endExperiment(`<div style="max-width:560px;margin:10% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
             <h3 style="color:#1565c0;">Session ended</h3>
             <p style="font-size:15px;line-height:1.7;">This study can't run without microphone access. Nothing has been recorded. Please email
             <a href="mailto:dennis.culver@drake.edu" style="color:#1565c0;">dennis.culver@drake.edu</a> if you'd like to take part on a different device.</p>
           </div>`);
      });
    }
  };
}

/* =====================================================================
   jsPsych INIT
   ===================================================================== */
var jsPsych = initJsPsych({
  on_finish: function () { /* terminal screen is the Chunk 4 export trial */ }
});

/* =====================================================================
   TIMELINE
   ===================================================================== */
var timeline = [];

/* 2 — ★ FULLSCREEN (Option 3), on its own fresh click AFTER share. Because no
   browser dialog follows, fullscreen HOLDS. We then measure the fullscreen
   viewport (the task viewport) and set the session clock anchor. */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  choices: "NO_KEYS",
  data: { trial_tag: "enter_fullscreen" },
  stimulus: `<div style="max-width:640px;margin:9% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <h2 style="color:#1565c0;">Continue in full screen</h2>
      <p style="font-size:17px;line-height:1.7;">The study runs in full screen so the whole interface fits. Click the button to continue. Stay in full screen for the rest of the session.</p>
      <button id="fs_btn" style="margin-top:10px;padding:14px 30px;background:#1565c0;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;">Continue in full screen</button>
      <p id="fs_err" style="color:#c0392b;margin-top:10px;"></p>
    </div>`,
  on_load: function () {
    const btn = document.getElementById("fs_btn");
    btn.addEventListener("click", async () => {
      btn.disabled = true; if(!study.session_started_at_ms) study.session_started_at_ms = Date.now();   /* kept on resume */
      try { await document.documentElement.requestFullscreen(); }
      catch (fe) { console.warn("requestFullscreen failed:", fe); }
      /* let the fullscreen resize settle before measuring the task viewport */
      setTimeout(() => {
        const vh = window.innerHeight, vw = window.innerWidth;
        study.task_viewport = { w: vw, h: vh };   // definitive task viewport
        study.__fsActive = true; if(typeof installFullscreenGuardian==="function") installFullscreenGuardian();
        jsPsych.finishTrial();
      }, 350);
    });
  }
});

/* 2 — Browser-check: WIDTH is a hard gate (below 1000 the columns collide);
   HEIGHT no longer rejects (minimum_height 0). Short screens proceed rather than being turned away. Runs after fullscreen,
   so it measures the real task viewport. Custom message wording uses "study", not the
   plugin default. */
timeline.push({
  type: jsPsychBrowserCheck,
  minimum_width: 1000,
  minimum_height: 0,
  allow_window_resize: true,
  window_resize_message: `<div style="max-width:620px;margin:10% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <p style="font-size:16px;line-height:1.7;">Your browser window is too narrow to complete this study. Please widen or maximize the window. The minimum width is 1000&nbsp;px.</p></div>`,
  inclusion_function: () => true,   // hard capability gating already handled by checkBrowser()
  on_finish: function (data) {
    study.browser_check = {
      browser: data.browser, browser_version: data.browser_version, os: data.os, mobile: data.mobile,
      width: data.width, height: data.height, webaudio: data.webaudio, fullscreen: data.fullscreen,
      vsync_rate: data.vsync_rate, webcam: data.webcam, microphone: data.microphone
    };
  }
});

/* 3 — Microphone permission + init (ALWAYS — the RTA needs audio). */
timeline.push(permissionGate("microphone"));
timeline.push({
  type: jsPsychInitializeMicrophone,
  data: { trial_tag: "init_microphone" }
});

/* 6 — Whisper warmup (background). Loads the model while the participant
   reads; used by the RTA in Chunk 3. */
timeline.push({
  type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
  data: { trial_tag: "whisper_warmup" },
  stimulus: `<div style="max-width:580px;margin:12% auto;text-align:center;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
      <h3 style="color:#1565c0;margin-bottom:16px;">Preparing speech analysis tools</h3>
      <p style="color:#44545f;margin-bottom:20px;">A speech model is loading in a background thread. The page stays responsive.<br>This only happens once.</p>
      <p style="color:#8a9aa7;font-size:14px;">Continuing automatically…</p>
    </div>`,
  trial_duration: 1500,
  on_load: function () { warmUpTranscriber(); }
});

/* END OF CHUNK 1 — on_finish placeholder renders the captured session state. */


</script>
<script>

/* ---- CASE CLOCK + HUMAN-READABLE LOG (Option B) ----

   readable mm:ss.s string for eyeballing. Ids are kept (stable linkage) AND a

let caseStart = Date.now();

function clockStr(ms){ const s=ms/1000; const m=Math.floor(s/60); const r=(s-m*60); return (m<10?"0":"")+m+":"+(r<10?"0":"")+r.toFixed(1); }

/* Source-element id -> plain-ASCII section label (case-independent; case is known
   at the session level, so it is not duplicated into every event). */
const SRC_SECTION = {
  "ch_ref":"Initial Evaluation - Referral", "ch_interim":"Initial Evaluation - Interim note",
  "ch_neuro":"Initial Evaluation - Neuromuscular/balance", "ch_pain":"Initial Evaluation - Sensory/pain",
  "ch_move":"Initial Evaluation - ROM/strength", "ch_mob":"Initial Evaluation - Functional mobility",
  "ch_adl":"Initial Evaluation - ADL", "ch_iadl":"Initial Evaluation - IADL",
  "ch_ment":"Initial Evaluation - Mental status/cognition", "ch_soc":"Initial Evaluation - Social history",
  "ch_sleep":"Initial Evaluation - Sleep", "ch_cp":"Initial Evaluation - Cardiopulmonary/MET",

function srcLabel(src){
  if(!src) return null;

  if(rest.indexOf("prof")===0){ const n=rest.split("_")[1]; return "Profile - para "+n; }

/* Add readable labels alongside ids, keyed by event kind (id means different
   things for different kinds, so resolve explicitly). Non-destructive. */
function enrich(kind, d){
  if(!d) return d;
  if(d.src != null && d.source === undefined) d.source = srcLabel(d.src);
  if(d.occId != null && d.occupation === undefined) d.occupation = occName(d.occId);

function recordDelta(op, payload){ state.recon.deltas.push(Object.assign({ op, t:nowRel() }, payload||{})); }

/* Serialize a selection Range as character offsets within its [data-src] element,
   so the in-text highlight can be faithfully repainted on replay (a live Range
   does not survive). Returns {srcId,start,end} or null if not locatable. */
function charOffsetInEl(el, node, offset){
  let count = 0; const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
  while((n = w.nextNode())){ if(n === node) return count + offset; count += n.textContent.length; }
  return count;
}
function serializeRange(range, srcId){
  if(!range || !srcId) return null;
  const el = document.querySelector('[data-src="'+srcId+'"]'); if(!el) return null;
  try {
    return { srcId, start: charOffsetInEl(el, range.startContainer, range.startOffset),
                    end:   charOffsetInEl(el, range.endContainer,   range.endOffset) };
  } catch(e){ return null; }
}
function rangeFromOffsets(loc){
  if(!loc) return null;
  const el = document.querySelector('[data-src="'+loc.srcId+'"]'); if(!el) return null;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let n, count = 0, setS = false, setE = false; const r = document.createRange();
  while((n = w.nextNode())){
    const len = n.textContent.length;
    if(!setS && count + len >= loc.start){ r.setStart(n, loc.start - count); setS = true; }
    if(!setE && count + len >= loc.end){ r.setEnd(n, loc.end - count); setE = true; break; }
    count += len;
  }
  return (setS && setE) ? r : null;
}

function wireSynthesis(){
  const ta=document.getElementById("synthesis_impression"), st=document.getElementById("syn_stamp");
  ta.value=state.synthesis.impression; let t=null;
  /* Append a discrete revision only when typing settles (debounced) or the
     field loses focus, and only if the text changed from the last snapshot.
     Yields a trajectory of settled impressions, not per-keystroke noise. */
  const snapshot=()=>{
    const text=ta.value, revs=state.synthesis.impression_revisions;
    const last=revs.length?revs[revs.length-1].text:null;
    if(text===last) return;
    const ts=Date.now();
    revs.push({version:revs.length+1, text, ts});
    updateWalkthrough();
    state.synthesis.impression=text; state.synthesis.impression_stamp=ts;
    logEvent("synthesis_revision",{version:revs.length, len:text.length});
    st.textContent="rev "+revs.length+" · "+new Date(ts).toLocaleTimeString();
  };
  ta.addEventListener("input", ()=>{ state.synthesis.impression=ta.value; recordDelta("impression",{text:ta.value}); clearTimeout(t); t=setTimeout(snapshot, 800); });
  ta.addEventListener("blur", ()=>{ clearTimeout(t); snapshot(); });
}

    input.value=""; if(desc) desc.value=""; recordDelta("occ_input",{value:""}); recordDelta("occ_desc_input",{value:""}); renderOccupations(); renderPlan(); };
  document.getElementById("occ_add").addEventListener("click", add);
  input.addEventListener("input", ()=>recordDelta("occ_input",{value:input.value}));
  if(desc) desc.addEventListener("input", ()=>recordDelta("occ_desc_input",{value:desc.value}));
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });
}
function renderOccupations(){

  if(!state.occupations.length){ list.innerHTML=`<div class="empty"><b>No occupations yet</b>Name and briefly describe the occupations this client needs or wants to do. Supports and barriers you identify link to these.</div>`; return; }

    return `<div class="occ-card"><span class="dot"></span><span class="nm">${esc(o.name)}</span><span class="tally">${n}</span><button class="rm" data-occ="${o.id}" aria-label="Remove ${esc(o.name)}">×</button>${o.description?`<div class="occ-desc">${esc(o.description)}</div>`:""}</div>`;
  }).join("");

    state.entries.forEach(e=>{ e.occIds=(e.occIds||[]).filter(x=>x!==id); });
    state.plan.selectedBarrierIds=state.plan.selectedBarrierIds.filter(bid=>{ const en=state.entries.find(x=>x.id===bid); return en&&(en.occIds||[]).length>0; });

  }));
}
function renderPerformance(){
  const body=document.getElementById("pa_body");
  document.getElementById("pa_count").textContent=state.entries.length;
  if(!state.entries.length){ body.innerHTML=`<div class="empty"><b>No supports or barriers identified yet</b>Highlight text in the case material, then mark it a support or a barrier.</div>`; return; }

  });

  if(orphans.length) html+=`<div class="pa-occ unlinked"><div class="pa-occ-h" style="color:var(--ink-faint)">Unlinked (occupation removed)</div>${orphans.map(entryHTML).join("")}</div>`;
  body.innerHTML=html;
  body.querySelectorAll(".rm").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.entry;
    logEvent("entry_remove",{id}); recordDelta("entry_remove",{id});
    state.entries=state.entries.filter(e=>e.id!==id);
    state.plan.selectedBarrierIds=state.plan.selectedBarrierIds.filter(x=>x!==id);

    renderOccupations(); renderPerformance(); renderPlan(); refreshHighlights();

}
function entryHTML(e){
  const isBar=e.type==="barrier";
  const verb=isBar?"limits":"enables";
  return `<div class="pa-entry ${isBar?'bar':'sup'}">
    <div class="top">
      <span class="glyph">${isBar?'▲':'●'}</span>
      <span class="lab">${isBar?'Barrier':'Support'}</span>
      ${e.aspect?`<span class="aspect">${esc(e.aspect)}</span>`:''}
      <button class="rm" data-entry="${e.id}" aria-label="Remove entry">×</button>
    </div>
    <div class="exc">"${esc(trunc(e.excerpt,140))}"</div>
    ${e.mechanism?`<div class="mech">${verb} <b>${esc(e.mechanism)}</b></div>`:''}
  </div>`;
}
function renderPlan(){
  const body=document.getElementById("ip_body");
  const barriers=state.entries.filter(e=>e.type==="barrier" && (e.occIds||[]).length);
  const barrierPick = barriers.length
    ? barriers.map(b=>{ const occ={name:occNames(b.occIds)}; const on=state.plan.selectedBarrierIds.includes(b.id);
        return `<label class="ip-bar-pick"><input type="checkbox" data-bar="${b.id}" ${on?'checked':''}/>
          <span class="txt"><span class="mech">${esc(b.mechanism||'—')}</span> — barrier to ${esc(occ?occ.name:'?')}<br>
          <span style="opacity:.8">"${esc(trunc(b.excerpt,90))}"</span></span></label>`; }).join("")
    : `<div class="empty"><b>No barriers to address yet</b>Barriers you classify (linked to an occupation) appear here to build the plan on.</div>`;

  const cards=state.plan.selectedBarrierIds.map(bid=>{
    const b=state.entries.find(e=>e.id===bid); if(!b) return "";
    const occ={name:occNames(b.occIds)};
    const pb=state.plan.perBarrier[bid]||{};
    return `<div class="ip-card">
      <div class="cardh">${esc(b.mechanism||'barrier')} — ${esc(occ?occ.name:'?')}</div>
      <div class="ip-field"><label>Describe your approach</label>
        <textarea data-bid="${bid}" data-f="approach" placeholder="1–2 sentences">${esc(pb.approach||'')}</textarea></div>
      <div class="ip-field"><label>Method (incl. safety / environment)</label>
        <textarea data-bid="${bid}" data-f="method" placeholder="2–3 sentences">${esc(pb.method||'')}</textarea></div>
      <div class="ip-field"><label>Grading up / down</label>
        <textarea data-bid="${bid}" data-f="grading" placeholder="1–2 sentences">${esc(pb.grading||'')}</textarea></div>
    </div>`;
  }).join("");

  body.innerHTML=`
    <div class="ip-step"><span class="lbl">1 · Select the barriers you will address</span>
      <span class="hint">Constrained to your own barrier classifications.</span>${barrierPick}</div>
    <div class="ip-step"><span class="lbl">2 · Why prioritize these over the others?</span>
      <textarea class="ip" id="ip_prioritization" placeholder="2–3 sentences">${esc(state.plan.prioritization)}</textarea></div>
    <div class="ip-step"><span class="lbl">3 · For each barrier: approach, method, grading</span>
      ${state.plan.selectedBarrierIds.length?cards:'<div class="empty">Select at least one barrier above.</div>'}</div>
    <div class="ip-step"><span class="lbl">4 · Objective, measurable, occupation-based long-term goals that address the desired outcomes</span>
      <textarea class="ip" id="ip_goal" placeholder="one goal per line">${esc(state.plan.goal)}</textarea></div>
    <div class="ip-step"><span class="lbl">5 · Which goal or objective needs the most immediate attention, and why?</span>
      <textarea class="ip" id="ip_immediate" placeholder="2–3 sentences">${esc(state.plan.immediate)}</textarea></div>`;

  body.querySelectorAll('input[data-bar]').forEach(cb=>cb.addEventListener("change",()=>{
    const id=cb.dataset.bar;
    if(cb.checked){ if(!state.plan.selectedBarrierIds.includes(id)) state.plan.selectedBarrierIds.push(id); }
    else state.plan.selectedBarrierIds=state.plan.selectedBarrierIds.filter(x=>x!==id);
    logEvent("barrier_select",{id,on:cb.checked}); recordDelta("barrier_select",{id,on:cb.checked}); renderPlan();
  }));
  /* Per-barrier and plan-level field edits emit timestamped events on settle
     (debounced) so the intervention-planning phase enters the analysis as a
     sequence of moves, matching synthesis/classification logging. Not per-keystroke. */
  const planDebounce = {};
  const logPlanEdit = (key, detail)=>{ clearTimeout(planDebounce[key]); planDebounce[key]=setTimeout(()=>logEvent("plan_edit",detail),700); };
  /* Plan free-text revision trajectory -- symmetric with impression_revisions:
     the settled text of each plan field (per-barrier + plan-level) is snapshotted
     on debounce/blur, only when it changed, so plan reasoning carries the same
     edit history as the impression (not just final text + a length count). */
  const planRevTimers = {};
  const planSnapshot = (scope, field, bid, text)=>{
    const revs=(state.plan.revisions=state.plan.revisions||[]);
    let last=null; for(let i=revs.length-1;i>=0;i--){ const r=revs[i]; if(r.field===field && (r.barrier_id||null)===(bid||null)){ last=r; break; } }
    if(last && last.text===text) return;
    const ts=Date.now(); revs.push({version:revs.length+1, scope:scope, field:field, barrier_id:(bid||null), text:text, ts:ts});
    logEvent("plan_revision",{scope:scope, field:field, barrier_id:(bid||null), version:revs.length, len:text.length});
  };
  const planRevSettle=(key, scope, field, bid, getText)=>{ clearTimeout(planRevTimers[key]); planRevTimers[key]=setTimeout(()=>planSnapshot(scope,field,bid,getText()),800); };
  body.querySelectorAll('[data-bid]').forEach(el=>{
    const handler=()=>{ const {bid,f}=el.dataset; state.plan.perBarrier[bid]=state.plan.perBarrier[bid]||{}; state.plan.perBarrier[bid][f]=el.value; updateWalkthrough();
      logPlanEdit("bar:"+bid+":"+f, {scope:"barrier", barrier_id:bid, field:f, len:el.value.length});
      planRevSettle("bar:"+bid+":"+f, "barrier", f, bid, ()=>el.value);
      recordDelta("plan_barrier",{bid, field:f, value:el.value}); };
    el.addEventListener("input", handler); el.addEventListener("change", handler);
    el.addEventListener("blur", ()=>{ const {bid,f}=el.dataset; clearTimeout(planRevTimers["bar:"+bid+":"+f]); planSnapshot("barrier", f, bid, el.value); });
  });
  const bind=(id,key)=>{ const el=document.getElementById(id); if(el){ el.addEventListener("input",()=>{ state.plan[key]=el.value; updateWalkthrough(); logPlanEdit("plan:"+key,{scope:"plan", field:key, len:el.value.length}); planRevSettle("plan:"+key, "plan", key, null, ()=>el.value); recordDelta("plan_field",{field:key, value:el.value}); });
    el.addEventListener("blur", ()=>{ clearTimeout(planRevTimers["plan:"+key]); planSnapshot("plan", key, null, el.value); }); } };
  bind("ip_prioritization","prioritization"); bind("ip_goal","goal"); bind("ip_immediate","immediate");
  updateWalkthrough();
}

/* =====================================================================
   SELECTION → CLASSIFY POPOVER  (symmetric support/barrier, OTPF-4 aspect)
   ===================================================================== */
let popEl=null, pendingRange=null;
function removePop(){ if(popEl){ if(state&&state.recon){ try{ recordDelta("pop_close",{}); }catch(e){} } popEl.remove();popEl=null;} pendingRange=null; }
document.addEventListener("mousedown", e=>{ if(popEl && !popEl.contains(e.target)) removePop(); });
window.addEventListener("scroll", e=>{
  const t=e.target;
  if(popEl && t && t.nodeType===1 && popEl.contains(t)) return;  /* inner scroll inside the popup */
  removePop();
}, true);

function attachSelectionHandlers(){
  const body=document.getElementById("case_body");
  body.addEventListener("mouseup", ()=>{
    setTimeout(()=>{
      const sel=window.getSelection();
      if(!sel||sel.isCollapsed) return;
      const text=sel.toString().trim(); if(text.length<3) return;
      let node=sel.anchorNode, srcEl=node&&(node.nodeType===1?node:node.parentElement);
      const body2=document.getElementById("case_body");
      while(srcEl && !(srcEl.dataset&&srcEl.dataset.src) && srcEl!==body2) srcEl=srcEl.parentElement;
      const src=(srcEl&&srcEl.dataset&&srcEl.dataset.src)||null;
      const rng=sel.getRangeAt(0);
      pendingRange=rng.cloneRange();
      openPopover(text, src, rng.getBoundingClientRect());
    },1);
  });
}
function attachScrollCapture(){
  document.querySelectorAll('#app .panel-body').forEach(function(pb){
    var panel=pb.closest('.panel'); if(!panel||!panel.id) return;
    var key=panel.id, lastTop=-1, lastT=-100000;
    pb.addEventListener('scroll', function(){
      if(window.__rtaReplaying) return;                 // don't capture programmatic replay scrolls
      var now=nowRel(); if(now-lastT<100) return;        // throttle
      var top=Math.round(pb.scrollTop); if(top===lastTop) return;
      lastTop=top; lastT=now; recordDelta('scroll',{key:key, top:top});
    });
  });
}
function openPopover(text, src, rect){
  removePopKeepRange();
  popEl=document.createElement("div"); popEl.className="pop"; popEl.innerHTML=choiceStep(text);
  document.body.appendChild(popEl); window.__popRect=rect; positionPop(rect); wireChoiceStep(text, src); recordDelta("pop_open",{excerpt:text, src:src, loc: serializeRange(pendingRange, src)});
}
function removePopKeepRange(){ if(popEl){popEl.remove();popEl=null;} } /* keep pendingRange */
function positionPop(rect){
  const pad=10, w=popEl.offsetWidth, h=popEl.offsetHeight;
  let left=rect.left+rect.width/2-w/2, top=rect.bottom+8;
  if(top+h>window.innerHeight-pad) top=rect.top-h-8;
  left=Math.max(pad,Math.min(left,window.innerWidth-w-pad)); top=Math.max(pad,Math.min(top,window.innerHeight-h-pad));
  popEl.style.left=left+"px"; popEl.style.top=top+"px";
}
function choiceStep(text){
  return `<div class="exc">"${esc(trunc(text,180))}"</div>
    <div class="q">Classify this text</div>
    <div class="row2"><button class="pick sup" id="pk_sup">● Support</button><button class="pick bar" id="pk_bar">▲ Barrier</button></div>`;
}
function wireChoiceStep(text, src){
  document.getElementById("pk_sup").onclick=()=>classifyStep("support",text,src);
  document.getElementById("pk_bar").onclick=()=>classifyStep("barrier",text,src);
}
/* Symmetric classify step; prompt wording varies by valence. */
function classifyStep(type, text, src){
  if(!state.occupations.length){ needOccupationsWarn(); return; }
  recordDelta("pop_choice",{valence:type});
  const isBar=type==="barrier";
  const mechQ = isBar ? "What is getting in the way of this occupation?" : "What capacity or resource enables this?";
  const mechPH= isBar ? "e.g., left shoulder active reach; sustained grip" : "e.g., intact cognition; home health aide support";
  const occQ = isBar ? "A barrier to which occupation(s)? Select all that apply." : "This supports which occupation(s)? Select all that apply.";
  popEl.innerHTML=`
    <button class="back" id="pk_back">← back</button>
    <div class="q">${mechQ}</div>
    <textarea id="pk_mech" rows="4" maxlength="1000" placeholder="${mechPH}"></textarea>
    <div class="q">${occQ}</div>
    <div class="pk-occs" id="pk_occ" role="group">${state.occupations.map(o=>`<label class="pk-occ"><input type="checkbox" value="${o.id}"/><span>${esc(o.name)}</span></label>`).join("")}</div>
    <button class="confirm" id="pk_go" disabled>${isBar?'Add barrier':'Add support'}</button>`;
  if(window.__popRect) positionPop(window.__popRect);
  document.getElementById("pk_back").onclick=()=>{ recordDelta("pop_back",{}); popEl.innerHTML=choiceStep(text); wireChoiceStep(text,src); if(window.__popRect) positionPop(window.__popRect); };
  const mech=document.getElementById("pk_mech"), occBox=document.getElementById("pk_occ"), go=document.getElementById("pk_go");
  const pickedOccs=()=>Array.from(occBox.querySelectorAll("input[type=checkbox]:checked")).map(cb=>cb.value);
  const check=()=> go.disabled=!(mech.value.trim() && pickedOccs().length);
  mech.oninput=()=>{ recordDelta("pop_mech",{value:mech.value}); check(); }; occBox.addEventListener("change",()=>{ recordDelta("pop_occ",{occIds:pickedOccs()}); check(); }); mech.focus();
  go.onclick=()=>{ commitEntry({ type, excerpt:text, src, mechanism:mech.value.trim().replace(/\s+/g," "), aspect:null, occIds:pickedOccs() }); removePop(); };
}
function needOccupationsWarn(){
  popEl.innerHTML=`<div class="warn"><b>Add an occupation first.</b><br>A support or barrier is classified <em>in relation to an occupation</em>. Name at least one occupation, then highlight again.</div>`;
}
function commitEntry(e){
  e.id=uid("ent_"); e.ts=Date.now(); e.range=pendingRange||null;
  e.occIds=(e.occIds||[]).slice(); e.loc=serializeRange(e.range, e.src);   /* loc kept for highlight restore on resume */
  state.entries.push(e);
  logEvent("classify",{type:e.type,excerpt:e.excerpt,entry_id:e.id,occIds:e.occIds.slice(),mechanism:e.mechanism,aspect:e.aspect,src:e.src});
  recordDelta("entry_add",{id:e.id, type:e.type, excerpt:e.excerpt, src:e.src, mechanism:e.mechanism, aspect:e.aspect, occIds:e.occIds.slice(), loc:e.loc});
  if(window.getSelection) window.getSelection().removeAllRanges();
