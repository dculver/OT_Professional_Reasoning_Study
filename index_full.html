let seq = 0; const uid = p => p + (++seq);
/* ---- CASE CLOCK + HUMAN-READABLE LOG (Option B) ----
   Timestamps are elapsed milliseconds from the moment the case began (not epoch),
   so the first event is near 0 and t reads as "time into this case". t_clock is a
   readable mm:ss.s string for eyeballing. Ids are kept (stable linkage) AND a
   plain-text label is added alongside each (source/occupation/entry/outcome). */
let caseStart = Date.now();
function beginCaseClock(){ caseStart = Date.now(); }
function nowRel(){ return Date.now() - caseStart; }
function clockStr(ms){ const s=ms/1000; const m=Math.floor(s/60); const r=(s-m*60); return (m<10?"0":"")+m+":"+(r<10?"0":"")+r.toFixed(1); }

/* Source-element id -> plain-ASCII section label (case-independent; case is known
   at the session level, so it is not duplicated into every event). */
const SRC_SECTION = {
  "ch_ref":"Chart - Referral", "ch_interim":"Chart - Interim note",
  "ch_neuro":"Chart - Neuromuscular/balance", "ch_pain":"Chart - Sensory/pain",
  "ch_move":"Chart - ROM/strength", "ch_mob":"Chart - Functional mobility",
  "ch_adl":"Chart - ADL", "ch_iadl":"Chart - IADL",
  "ch_ment":"Chart - Mental status/cognition", "ch_soc":"Chart - Social history",
  "ch_sleep":"Chart - Sleep", "ch_cp":"Chart - Cardiopulmonary/MET",
  "ch_dc":"Chart - Discharge plan"
};
function srcLabel(src){
  if(!src) return null;
  const rest = src.replace(/^[a-z]{2}_/, "");          // strip case prefix (fl_/yv_/pa_)
  if(rest.indexOf("prof")===0){ const n=rest.split("_")[1]; return "Profile - para "+n; }
  return SRC_SECTION[rest] || rest;
}
function occName(id){ const o=state.occupations.find(x=>x.id===id); return o?o.name:null; }
function entryExcerpt(id){ const e=state.entries.find(x=>x.id===id); return e?e.excerpt:null; }
function outcomeText(id){ const o=state.synthesis.desired_outcomes.find(x=>x.id===id); return o?o.text:null; }

/* Add readable labels alongside ids, keyed by event kind (id means different
   things for different kinds, so resolve explicitly). Non-destructive. */
function enrich(kind, d){
  if(!d) return d;
  if(d.src != null && d.source === undefined) d.source = srcLabel(d.src);
  if(d.occId != null && d.occupation === undefined) d.occupation = occName(d.occId);
  if(d.id != null){
    if(kind==="barrier_select" || kind==="entry_remove"){ const v=entryExcerpt(d.id); if(v!=null) d.entry=v; }
    else if(kind==="occupation_remove"){ const v=occName(d.id); if(v!=null) d.occupation=v; }
    else if(kind==="desired_outcome_remove" || kind==="desired_outcome_tag"){ const v=outcomeText(d.id); if(v!=null) d.outcome=v; }
  }
  return d;
}
function logEvent(kind, detail){ const t=nowRel(); state.log.push({ t, t_clock:clockStr(t), kind, detail:enrich(kind, detail)||null }); }

/* ---- RECONSTRUCTION CAPTURE (separate record; replay/cue infrastructure only) ---- */
function recordDelta(op, payload){ state.recon.deltas.push(Object.assign({ op, t:nowRel() }, payload||{})); }

/* Serialize a selection Range as character offsets within its [data-src] element,
   so the in-text highlight can be faithfully repainted on replay (a live Range
   does not survive). Returns {srcId,start,end} or null if not locatable. */
function charOffsetInEl(el, node, offset){
  let count = 0; const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
  while((n = w.nextNode())){ if(n === node) return count + offset; count += n.textContent.length; }
  return count;
}
function serializeRange(range, srcId){
  if(!range || !srcId) return null;
  const el = document.querySelector('[data-src="'+srcId+'"]'); if(!el) return null;
  try {
    return { srcId, start: charOffsetInEl(el, range.startContainer, range.startOffset),
                    end:   charOffsetInEl(el, range.endContainer,   range.endOffset) };
  } catch(e){ return null; }
}
function rangeFromOffsets(loc){
  if(!loc) return null;
  const el = document.querySelector('[data-src="'+loc.srcId+'"]'); if(!el) return null;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let n, count = 0, setS = false, setE = false; const r = document.createRange();
  while((n = w.nextNode())){
    const len = n.textContent.length;
    if(!setS && count + len >= loc.start){ r.setStart(n, loc.start - count); setS = true; }
    if(!setE && count + len >= loc.end){ r.setEnd(n, loc.end - count); setE = true; break; }
    count += len;
  }
  return (setS && setE) ? r : null;
}

/* In-text highlight marks via CSS Custom Highlight API (no DOM mutation). */
const supHL = (typeof Highlight!=="undefined") ? new Highlight() : null;
const barHL = (typeof Highlight!=="undefined") ? new Highlight() : null;
function registerHighlights(){ if(window.CSS && CSS.highlights && supHL){ CSS.highlights.set("ot-support",supHL); CSS.highlights.set("ot-barrier",barHL); } }
function refreshHighlights(){
  if(!supHL) return;
  supHL.clear(); barHL.clear();
  state.entries.forEach(e=>{ if(e.range){ try{ (e.type==="support"?supHL:barHL).add(e.range); }catch(err){} } });
}

function wireSynthesis(){
  const ta=document.getElementById("synthesis_impression"), st=document.getElementById("syn_stamp");
  ta.value=state.synthesis.impression; let t=null;
  /* Append a discrete revision only when typing settles (debounced) or the
     field loses focus, and only if the text changed from the last snapshot.
     Yields a trajectory of settled impressions, not per-keystroke noise. */
  const snapshot=()=>{
    const text=ta.value, revs=state.synthesis.impression_revisions;
    const last=revs.length?revs[revs.length-1].text:null;
    if(text===last) return;
    const ts=Date.now();
    revs.push({version:revs.length+1, text, ts});
    recordDelta("impression",{text});
    updateWalkthrough();
    state.synthesis.impression=text; state.synthesis.impression_stamp=ts;
    logEvent("synthesis_revision",{version:revs.length, len:text.length});
    st.textContent="rev "+revs.length+" · "+new Date(ts).toLocaleTimeString();
  };
  ta.addEventListener("input", ()=>{ state.synthesis.impression=ta.value; clearTimeout(t); t=setTimeout(snapshot, 800); });
  ta.addEventListener("blur", ()=>{ clearTimeout(t); snapshot(); });
}
function wireOutcomes(){
  const input=document.getElementById("outcome_input");
  const add=()=>{ const text=input.value.trim(); if(!text) return;
    const oid=uid("out_"); state.synthesis.desired_outcomes.push({id:oid, text, otpf4_outcome_type:null, ts:Date.now()});
    logEvent("desired_outcome_add",{text}); recordDelta("outcome_add",{id:oid, text});
    input.value=""; renderOutcomes(); updateWalkthrough(); };
  document.getElementById("outcome_add").addEventListener("click", add);
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });
}
function renderOutcomes(){
  const list=document.getElementById("outcome_list"); if(!list) return;
  const outs=state.synthesis.desired_outcomes;
  if(!outs.length){ list.innerHTML=`<div class="empty"><b>No desired outcomes yet</b>Name at least one desired outcome. Your intervention goals will address these.</div>`; return; }

    <div class="out-card">

      </select>
    </div>`).join("");
  list.querySelectorAll(".rm").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.out;
    logEvent("desired_outcome_remove",{id}); recordDelta("outcome_remove",{id});
    state.synthesis.desired_outcomes=state.synthesis.desired_outcomes.filter(o=>o.id!==id);
    renderOutcomes(); updateWalkthrough();
  }));
  list.querySelectorAll(".out-tag").forEach(sel=>sel.addEventListener("change",()=>{
    const o=state.synthesis.desired_outcomes.find(x=>x.id===sel.dataset.out);
    if(o){ o.otpf4_outcome_type=sel.value||null; logEvent("desired_outcome_tag",{id:o.id,type:o.otpf4_outcome_type}); recordDelta("outcome_tag",{id:o.id, type:o.otpf4_outcome_type}); }
  }));
}
function wireTabs(){

    tab.addEventListener("click", ()=>{

function wireOccupations(){

function renderPerformance(){
  const body=document.getElementById("pa_body");
  document.getElementById("pa_count").textContent=state.entries.length;
  if(!state.entries.length){ body.innerHTML=`<div class="empty"><b>No supports or barriers identified yet</b>Highlight text in the case material, then mark it a support or a barrier.</div>`; return; }
  let html="";
  state.occupations.forEach(o=>{
    const es=state.entries.filter(e=>e.occId===o.id); if(!es.length) return;
    html+=`<div class="pa-occ"><div class="pa-occ-h"><span class="dot"></span>${esc(o.name)}</div>${es.map(entryHTML).join("")}</div>`;
  });
  const orphans=state.entries.filter(e=>!e.occId);
  if(orphans.length) html+=`<div class="pa-occ unlinked"><div class="pa-occ-h" style="color:var(--ink-faint)">Unlinked (occupation removed)</div>${orphans.map(entryHTML).join("")}</div>`;

    const id=b.dataset.entry;

    state.plan.selectedBarrierIds=state.plan.selectedBarrierIds.filter(x=>x!==id);

function entryHTML(e){
  const isBar=e.type==="barrier";
  const verb=isBar?"limits":"enables";
  return `<div class="pa-entry ${isBar?'bar':'sup'}">
    <div class="top">
      <span class="glyph">${isBar?'▲':'●'}</span>
      <span class="lab">${isBar?'Barrier':'Support'}</span>
      ${e.aspect?`<span class="aspect">${esc(e.aspect)}</span>`:''}
      <button class="rm" data-entry="${e.id}" aria-label="Remove entry">×</button>
    </div>
    <div class="exc">"${esc(trunc(e.excerpt,140))}"</div>
    ${e.mechanism?`<div class="mech">${verb} <b>${esc(e.mechanism)}</b></div>`:''}
  </div>`;
}
function renderPlan(){
  const body=document.getElementById("ip_body");
  const barriers=state.entries.filter(e=>e.type==="barrier" && e.occId);
  const barrierPick = barriers.length
    ? barriers.map(b=>{ const occ=state.occupations.find(o=>o.id===b.occId); const on=state.plan.selectedBarrierIds.includes(b.id);
        return `<label class="ip-bar-pick"><input type="checkbox" data-bar="${b.id}" ${on?'checked':''}/>

    : `<div class="empty"><b>No barriers to address yet</b>Barriers you classify (linked to an occupation) appear here to build the plan on.</div>`;

  const cards=state.plan.selectedBarrierIds.map(bid=>{
    const b=state.entries.find(e=>e.id===bid); if(!b) return "";
    const occ=state.occupations.find(o=>o.id===b.occId);
    const pb=state.plan.perBarrier[bid]||{};
    return `<div class="ip-card">

      <div class="ip-field"><label>Method (incl. safety / environment)</label>

        <select class="ip" data-bid="${bid}" data-f="type"><option value="">— select —</option>

      <div class="ip-field"><label>Grading up / down</label>
        <textarea data-bid="${bid}" data-f="grading" placeholder="1–2 sentences">${esc(pb.grading||'')}</textarea></div>
    </div>`;
  }).join("");

  body.innerHTML=`
    <div class="ip-step"><span class="lbl">1 · Select the barriers you will address</span>
      <span class="hint">Constrained to your own barrier classifications.</span>${barrierPick}</div>
    <div class="ip-step"><span class="lbl">2 · Why prioritize these over the others?</span>
      <textarea class="ip" id="ip_prioritization" placeholder="2–3 sentences">${esc(state.plan.prioritization)}</textarea></div>
    <div class="ip-step"><span class="lbl">3 · For each barrier: approach, method, type, grading</span>
      ${state.plan.selectedBarrierIds.length?cards:'<div class="empty">Select at least one barrier above.</div>'}</div>
    <div class="ip-step"><span class="lbl">4 · One objective, measurable, occupation-based long-term goal that addresses a desired outcome</span>

    <div class="ip-step"><span class="lbl">5 · Which goal or objective needs the most immediate attention, and why?</span>
      <textarea class="ip" id="ip_immediate" placeholder="2–3 sentences">${esc(state.plan.immediate)}</textarea></div>`;

  body.querySelectorAll('input[data-bar]').forEach(cb=>cb.addEventListener("change",()=>{
    const id=cb.dataset.bar;
    if(cb.checked){ if(!state.plan.selectedBarrierIds.includes(id)) state.plan.selectedBarrierIds.push(id); }
    else state.plan.selectedBarrierIds=state.plan.selectedBarrierIds.filter(x=>x!==id);
    logEvent("barrier_select",{id,on:cb.checked}); recordDelta("barrier_select",{id,on:cb.checked}); renderPlan();
  }));
  /* Per-barrier and plan-level field edits emit timestamped events on settle
     (debounced) so the intervention-planning phase enters the analysis as a
     sequence of moves, matching synthesis/classification logging. Not per-keystroke. */
  const planDebounce = {};
  const logPlanEdit = (key, detail)=>{ clearTimeout(planDebounce[key]); planDebounce[key]=setTimeout(()=>logEvent("plan_edit",detail),700); };
  body.querySelectorAll('[data-bid]').forEach(el=>{
    const handler=()=>{ const {bid,f}=el.dataset; state.plan.perBarrier[bid]=state.plan.perBarrier[bid]||{}; state.plan.perBarrier[bid][f]=el.value; updateWalkthrough();
      logPlanEdit("bar:"+bid+":"+f, {scope:"barrier", barrier_id:bid, field:f, len:el.value.length});

function attachSelectionHandlers(){

      const sel=window.getSelection();
      if(!sel||sel.isCollapsed) return;

      let node=sel.anchorNode, srcEl=node&&(node.nodeType===1?node:node.parentElement);

function stepSatisfied(step){
  const st=checklistState();
  if(step.req===null) return true;                 // welcome/closer never gate resume
  if(step.req==="synthesis") return st.impression && st.outcome;
  if(step.req==="plan") return st.selectBarrier && st.interventionCard && st.prioritization && st.goal && st.immediate;
  return !!st[step.req];
}
function firstIncompleteStep(){
  for(let i=0;i<TOUR.length;i++){ if(!stepSatisfied(TOUR[i])) return i; }

function checklistState(){
  const s=state, w=walk;

  return {
    tabs: !!(w.tabsSeen.chart && w.tabsSeen.library),
    impression: s.synthesis.impression_revisions.length>0,
    occupation: s.occupations.length>0,
    support: s.entries.some(e=>e.type==="support"),

/* ---- CURSOR SAMPLING (reconstruction/replay only; never analyzed) ----
   Throttled position + which AOI the cursor is over. Idle is represented
   implicitly: no movement => no samples => a gap in the track (a pause the
   RTA can cue on). Attached once; always writes to the current state.recon. */
let __lastCursorSample = 0, __cursorAttached = false;
function attachCursorSampling(){
  if(__cursorAttached) return; __cursorAttached = true;
  document.addEventListener("mousemove", (e)=>{
    if(!state || !state.recon) return;
    const now = Date.now();
    if(now - __lastCursorSample < 120) return;   // ~8 Hz throttle
    __lastCursorSample = now;
    let aoi = null;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if(el){ const a = el.closest("[data-aoi]"); if(a) aoi = a.dataset.aoi; }
    state.recon.cursor.push({ x:e.clientX, y:e.clientY, aoi, t:now });
  }, { passive:true });
}

/* ---- RECONSTRUCTION: rebuild the exact state at time tMax from the deltas ----
   Faithful replay source. Applied to a fresh state; content + stable ids +
   highlight span locators make each delta self-sufficient. */
function reconstructState(deltas, tMax){
  const s = freshState();
  for(const d of deltas){
    if(tMax != null && d.t > tMax) break;
    switch(d.op){
      case "occ_add": s.occupations.push({ id:d.id, name:d.name }); break;
      case "occ_remove": s.occupations = s.occupations.filter(o=>o.id!==d.id);
        s.entries.forEach(e=>{ if(e.occId===d.id) e.occId=null; });
        s.plan.selectedBarrierIds = s.plan.selectedBarrierIds.filter(bid=>{ const en=s.entries.find(x=>x.id===bid); return en&&en.occId!==null; });
        break;
      case "entry_add": s.entries.push({ id:d.id, type:d.type, excerpt:d.excerpt, src:d.src, mechanism:d.mechanism, aspect:d.aspect, occId:d.occId, loc:d.loc, range:null }); break;
      case "entry_remove": s.entries = s.entries.filter(e=>e.id!==d.id);
        s.plan.selectedBarrierIds = s.plan.selectedBarrierIds.filter(x=>x!==d.id); delete s.plan.perBarrier[d.id]; break;
      case "impression": s.synthesis.impression = d.text; break;
      case "outcome_add": s.synthesis.desired_outcomes.push({ id:d.id, text:d.text, otpf4_outcome_type:null }); break;
      case "outcome_remove": s.synthesis.desired_outcomes = s.synthesis.desired_outcomes.filter(o=>o.id!==d.id); break;
      case "outcome_tag": { const o=s.synthesis.desired_outcomes.find(x=>x.id===d.id); if(o) o.otpf4_outcome_type = d.type; break; }
      case "barrier_select": if(d.on){ if(!s.plan.selectedBarrierIds.includes(d.id)) s.plan.selectedBarrierIds.push(d.id); }
        else s.plan.selectedBarrierIds = s.plan.selectedBarrierIds.filter(x=>x!==d.id); break;
      case "plan_barrier": s.plan.perBarrier[d.bid] = s.plan.perBarrier[d.bid]||{}; s.plan.perBarrier[d.bid][d.field] = d.value; break;
      case "plan_field": s.plan[d.field] = d.value; break;
      case "tab": s._replayTab = d.tab; break;
    }
  }
  return s;
}

/* ===== INJECTED: REPLAY ENGINE ===== */
/* =====================================================================
   RTA RECONSTRUCTION REPLAY ENGINE  (Chunk 3 core)
   Rebuilds the participant's session visually from the recon record
   (deltas + cursor) alone -- NO screen recording. True-tempo playback.
   The participant watches this reconstruction and thinks aloud (van Gog
   continuous narration); pause/resume buys time to explain. No cues.

   Pure function of the recon record -> reconstructed state at any time t.
   This module is deterministic and testable outside the browser: given a
   recon record, replayStateAt(t) returns the exact state the participant
   saw at case-relative time t.
   ===================================================================== */

/* Rebuild the full interface state as it existed at case-relative time tMs,
   by applying every delta with delta.t <= tMs in order. This is the
   reconstruction: state is a pure fold over the delta list. */
function reconstructStateAt(recon, tMs){
  // fresh empty state mirror (only the fields the deltas write)
  const S = {
    occupations: [],
    entries: [],
    synthesis: { impression: "", desired_outcomes: [] },
    plan: { selectedBarrierIds: [], perBarrier: {}, prioritization:"", approach:"", method:"", type:"", grading:"", goal:"", immediate:"" },
    activeTab: "profile"
  };
  for(const d of recon.deltas){
    if(d.t > tMs) break;               // deltas are time-ordered
    applyDelta(S, d);
  }
  return S;
}

/* Apply one delta to the state mirror. This is the inverse of the capture:
   each recordDelta op has a corresponding rebuild here. */
function applyDelta(S, d){
  switch(d.op){
    case "tab":            S.activeTab = d.tab; break;
    case "occ_add":        S.occupations.push({ id:d.id, name:d.name }); break;
    case "occ_remove":     S.occupations = S.occupations.filter(o=>o.id!==d.id);
                           S.entries.forEach(e=>{ if(e.occId===d.id) e.occId=null; }); break;
    case "entry_add":      S.entries.push({ id:d.id, type:d.type, excerpt:d.excerpt, src:d.src,
                             mechanism:d.mechanism, aspect:d.aspect, occId:d.occId, loc:d.loc }); break;
    case "entry_remove":   S.entries = S.entries.filter(e=>e.id!==d.id);
                           S.plan.selectedBarrierIds = S.plan.selectedBarrierIds.filter(x=>x!==d.id);
                           delete S.plan.perBarrier[d.id]; break;
    case "impression":     S.synthesis.impression = d.text; break;
    case "outcome_add":    S.synthesis.desired_outcomes.push({ id:d.id, text:d.text, otpf4_outcome_type:null }); break;
    case "outcome_remove": S.synthesis.desired_outcomes = S.synthesis.desired_outcomes.filter(o=>o.id!==d.id); break;
    case "outcome_tag":    { const o=S.synthesis.desired_outcomes.find(x=>x.id===d.id); if(o) o.otpf4_outcome_type=d.type; } break;
    case "barrier_select": if(d.on){ if(!S.plan.selectedBarrierIds.includes(d.id)) S.plan.selectedBarrierIds.push(d.id); }
                           else { S.plan.selectedBarrierIds = S.plan.selectedBarrierIds.filter(x=>x!==d.id); } break;
    case "plan_barrier":   (S.plan.perBarrier[d.bid] = S.plan.perBarrier[d.bid] || {})[d.field] = d.value; break;
    case "plan_field":     S.plan[d.field] = d.value; break;
  }
}

/* Cursor position at time tMs: last sample at or before tMs (step-hold),
   for animating the cursor/attention marker during replay. */
function cursorAt(recon, tMs){
  let last = null;
  for(const c of recon.cursor){ if(c.t > tMs) break; last = c; }
  return last;  // {x,y,aoi,t} or null
}

/* The set of distinct event times where SOMETHING changed -- these are the
   frames the replay must render to be faithful. (Deltas + cursor samples.) */
function replayKeyframes(recon){
  const ts = new Set();
  recon.deltas.forEach(d=>ts.add(d.t));
  recon.cursor.forEach(c=>ts.add(c.t));
  return Array.from(ts).sort((a,b)=>a-b);
}



/* ===== INJECTED: REPLAY CONTROLLER ===== */

/* =====================================================================
   RTA REPLAY CONTROLLER  (Chunk 3)
   Drives true-tempo playback of a recon record through the real interface.
   Participant watches and narrates continuously (van Gog reinstatement).
   Pause/resume buys time to explain. No predetermined cues.
   Silence net: uniform keep-talking prompt on long unpaused silence.
   ===================================================================== */
const Replay = (function(){
  let recon=null, keyframes=[], t0=0, playT=0, playing=false, raf=null, lastRenderKF=-1;
  let cursorEl=null, hud=null, onDone=null;

  // ---- SILENCE NET (configurable a-priori threshold; NOT hard-coded) ----
  // Value below is a placeholder; final threshold is a design decision with
  // an a-priori justification (van Gog used 5s; TA convention ~15s).
  const SILENCE_NET = {
    thresholdMs: 15000,            // <-- OPEN PARAMETER: finalize with justification
    prompt: "Please keep describing what you were thinking.",  // fixed, non-directive, uniform
    lastSpeechAt: 0, armed:true, fires:[]
  };
  // In the live instrument this is driven by mic VAD / Whisper partials.
  // Here it is exposed so it can be unit-tested and wired to the audio stream.
  function noteSpeech(atMs){ SILENCE_NET.lastSpeechAt = atMs; }

  // ---- NARRATION CAPTURE (re-anchoring) -- mirrors js/reanchor.js (canonical).
  //      If js/reanchor.js changes, re-extract this block. Records each utterance
  //      at the shown task-moment (playT); playT freezes during pause, so an
  //      utterance spoken while paused anchors to the paused moment. ----
  var narrationCap = (function(){
    var narration=[];
    return {
      note:function(text, playTMs, opts){ if(text==null) return null; opts=opts||{};
        var u={text:String(text), playT:Math.max(0,Math.round(Number(playTMs)||0)),
               paused:!!opts.paused, wall_t:(opts.wall_t!=null?opts.wall_t:null), kind:opts.kind||'final'};
        narration.push(u); return u; },
      get:function(){ return narration.slice(); },
      clear:function(){ narration.length=0; }
    };
  })();
  function reanchorAllLocal(list, off){ off=(off==null?null:Number(off));
    return (list||[]).map(function(u){ return {text:u.text, case_relative_t:u.playT,
      session_offset_t:(off==null?null:off+u.playT), paused:!!u.paused, kind:u.kind||'final'}; }); }
  /* Public: record a transcribed utterance at the current shown task-moment and
     re-arm the silence net from the same event. The live mic/Whisper layer calls
     this; noteSpeech(playT) remains the raw VAD hook. */
  function noteUtterance(text, opts){
    var u=narrationCap.note(text, playT, Object.assign({paused:!playing}, opts||{}));
    noteSpeech(playT);
    return u;
  }
  function checkSilenceNet(nowMs){
    if(!playing || !SILENCE_NET.armed) return;
    if(nowMs - SILENCE_NET.lastSpeechAt >= SILENCE_NET.thresholdMs){
      SILENCE_NET.fires.push(nowMs);
      showNet(SILENCE_NET.prompt);
      SILENCE_NET.lastSpeechAt = nowMs;   // re-arm from now (uniform, non-selective)
    }
  }
  function showNet(msg){
    let n=document.getElementById('rp_net');
    if(!n){ n=document.createElement('div'); n.id='rp_net'; document.body.appendChild(n);
      Object.assign(n.style,{position:'fixed',left:'50%',bottom:'88px',transform:'translateX(-50%)',
        background:'#1f2937',color:'#fff',font:'600 14px system-ui',padding:'10px 16px',borderRadius:'8px',
        zIndex:10001,boxShadow:'0 4px 16px rgba(0,0,0,.25)',transition:'opacity .3s',opacity:'0'}); }
    n.textContent=msg; n.style.opacity='1';
    clearTimeout(n._h); n._h=setTimeout(()=>{ n.style.opacity='0'; }, 3500);
  }

  function hydrateAndRender(tMs){
    // reconstruct state at tMs and push into the live `state`, then render
    const S = reconstructStateAt(recon, tMs);
    state.occupations = S.occupations.map(o=>({id:o.id,name:o.name}));
    state.entries = S.entries.map(e=>{
      const ent = {id:e.id,type:e.type,excerpt:e.excerpt,src:e.src,mechanism:e.mechanism,aspect:e.aspect,occId:e.occId,loc:e.loc};
      ent.range = e.loc ? rangeFromOffsets(e.loc) : null;   // rebuild highlight span
      return ent;
    });
    state.synthesis.impression = S.synthesis.impression;
    state.synthesis.desired_outcomes = S.synthesis.desired_outcomes.map(o=>({id:o.id,text:o.text,otpf4_outcome_type:o.otpf4_outcome_type}));
    state.plan.selectedBarrierIds = S.plan.selectedBarrierIds.slice();
    state.plan.perBarrier = JSON.parse(JSON.stringify(S.plan.perBarrier||{}));
    ['prioritization','approach','method','type','grading','goal','immediate'].forEach(k=>{ if(k in S.plan) state.plan[k]=S.plan[k]; });
    // set active tab to what was showing
    if(S.activeTab && typeof setActiveTab==='function'){ try{ setActiveTab(S.activeTab); }catch(e){} }
    renderCase();
    // re-apply tab after renderCase rebuilds DOM
    if(S.activeTab){ const tb=document.querySelector('.tab[data-tab="'+S.activeTab+'"]'); if(tb){ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); tb.classList.add('active');
       document.querySelectorAll('[data-tabpane]').forEach(pp=>pp.style.display = pp.getAttribute('data-tabpane')===S.activeTab?'':'none'); } }
    makeNonInteractive();
  }

  function makeNonInteractive(){
    const app=document.getElementById('app'); if(app) app.style.pointerEvents='none';
  }

  function positionCursor(tMs){
    const c = cursorAt(recon, tMs);
    if(!cursorEl){ cursorEl=document.createElement('div'); cursorEl.id='rp_cursor'; document.body.appendChild(cursorEl);
      Object.assign(cursorEl.style,{position:'fixed',width:'18px',height:'18px',borderRadius:'50%',
        border:'2px solid #d95a30',background:'rgba(217,90,48,.25)',zIndex:10000,pointerEvents:'none',
        transform:'translate(-50%,-50%)',transition:'left .08s linear, top .08s linear'}); }
    if(c){ cursorEl.style.display=''; cursorEl.style.left=c.x+'px'; cursorEl.style.top=c.y+'px'; }
    else cursorEl.style.display='none';
  }

  function tick(ts){
    if(!playing) return;
    if(!t0) t0 = ts - playT;
    playT = ts - t0;                       // true-tempo: 1ms wall == 1ms task time
    // render at any keyframe we've crossed
    for(let i=lastRenderKF+1;i<keyframes.length;i++){
      if(keyframes[i] <= playT){ hydrateAndRender(keyframes[i]); lastRenderKF=i; }
      else break;
    }
    positionCursor(playT);
    checkSilenceNet(playT);
    updateHUD();
    if(playT >= keyframes[keyframes.length-1]){ playing=false; if(onDone) onDone(); return; }
    raf = requestAnimationFrame(tick);
  }

  function updateHUD(){
    if(!hud) return;
    const dur = keyframes[keyframes.length-1]||0;
    const mm=(x)=>{const s=Math.floor(x/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
    hud.querySelector('#rp_time').textContent = mm(Math.min(playT,dur))+' / '+mm(dur);
    hud.querySelector('#rp_bar_fill').style.width = (100*Math.min(playT,dur)/(dur||1))+'%';
    hud.querySelector('#rp_toggle').textContent = playing? 'Pause' : 'Resume';
  }

  function buildHUD(){
    hud=document.createElement('div'); hud.id='rp_hud';
    Object.assign(hud.style,{position:'fixed',left:'0',right:'0',bottom:'0',height:'64px',background:'#0f172a',
      color:'#fff',display:'flex',alignItems:'center',gap:'16px',padding:'0 20px',zIndex:10002,font:'14px system-ui'});
    hud.innerHTML = `
      <button id="rp_toggle" style="background:#d95a30;color:#fff;border:0;border-radius:6px;padding:8px 18px;font:600 14px system-ui;cursor:pointer">Pause</button>
      <div style="font-variant-numeric:tabular-nums" id="rp_time">00:00 / 00:00</div>
      <div style="flex:1;height:8px;background:#334155;border-radius:4px;overflow:hidden"><div id="rp_bar_fill" style="height:100%;width:0;background:#d95a30"></div></div>
      <div style="opacity:.8">Replay — keep describing what you were thinking</div>`;
    document.body.appendChild(hud);
    hud.querySelector('#rp_toggle').onclick=()=>{ playing?pause():resume(); };
    // DEV-ONLY (harness): simulate a transcribed utterance to exercise re-anchor capture.
    var sim=document.createElement('input'); sim.id='rp_sim'; sim.type='text';
    sim.placeholder='sim utterance -> Enter (dev)';
    Object.assign(sim.style,{marginLeft:'8px',padding:'6px 10px',border:'0',borderRadius:'6px',font:'13px system-ui',width:'220px'});
    sim.addEventListener('keydown',function(e){ if(e.key==='Enter'&&sim.value.trim()){ var u=noteUtterance(sim.value.trim()); sim.value=''; showNet('captured "'+u.text+'" @ '+u.playT+' ms'); } });
    hud.appendChild(sim);
  }

  function start(reconRecord, opts){
    recon = reconRecord; opts=opts||{};
    if(opts.silenceThresholdMs) SILENCE_NET.thresholdMs=opts.silenceThresholdMs;
    onDone = opts.onDone||null;
    keyframes = replayKeyframes(recon); if(!keyframes.length) keyframes=[0];
    playT=0; t0=0; lastRenderKF=-1; SILENCE_NET.lastSpeechAt=0; SILENCE_NET.fires=[]; narrationCap.clear();
    buildHUD(); hydrateAndRender(0); positionCursor(0);
    resume();
  }
  function pause(){ playing=false; if(raf) cancelAnimationFrame(raf); t0=0; updateHUD(); }
  function resume(){ if(playing) return; playing=true; t0=0; raf=requestAnimationFrame(tick); }
  function seek(tMs){ playT=Math.max(0,Math.min(tMs,keyframes[keyframes.length-1]||0)); t0=0; lastRenderKF=-1;
    for(let i=0;i<keyframes.length;i++){ if(keyframes[i]<=playT){hydrateAndRender(keyframes[i]);lastRenderKF=i;} } positionCursor(playT); updateHUD(); }

  return { start, pause, resume, seek, noteSpeech, noteUtterance,
           getNarration:()=>narrationCap.get(), getReanchored:(off)=>reanchorAllLocal(narrationCap.get(), off),
           _state:()=>({playT,playing,keyframes,fires:SILENCE_NET.fires.slice(),threshold:SILENCE_NET.thresholdMs}) };
})();

// Auto-start if a recon record was injected



</script>
<script>
/* =====================================================================
   CHUNK 2 + 3 + 4 INTEGRATION LAYER
   Mounts the Option-B engine (above) as jsPsych trials, adds the RTA
   reconstruction-replay trial after each case (mic + Whisper + re-anchor),
   and the one-file Chunk 4 export. Uses window.Reanchor (js/reanchor.js).
   ===================================================================== */

CONFIG.RTA_SILENCE_MS = 15000;   /* OPEN a-priori parameter (placeholder). */

const AOI_SELECTORS = ["#aoi_case_material","#aoi_occupations","#aoi_performance","#aoi_synthesis","#aoi_intervention"];
const CASES_IN_ORDER = [PATRICIA, FLORENCE, YVONNE];

/* Per-case captured records assembled for the final export. Keyed by case id. */
study.cases = {};

/* Fresh #app host inside a trial's #ot_mount (engine renders into #app). */
function mountAppInto(hostId){
  const host = document.getElementById(hostId);
  host.innerHTML = '<div id="app"></div>';
  return host;
}

/* Snapshot the five AOI rectangles at task start (fluid layout: absolute px
   vary with viewport, so they are recorded per session). */
function snapshotAOIRects(){
  const o = {};
  AOI_SELECTORS.forEach(sel=>{
    const el = document.querySelector(sel);
    if(el){ const r = el.getBoundingClientRect();
      o[el.dataset.aoi] = { x:Math.round(r.x), y:Math.round(r.y), w:Math.round(r.width), h:Math.round(r.height) }; }
  });
  return o;
}

/* Capture AOI geometry at case start: px rects (ground truth) + normalized rects
   (rect / task viewport, additive diagnostic) + adequacy (min panel dimension /
   this participant's mean gaze offset in px). Null-safe when gaze is off. The
   adequacy THRESHOLD (>=1 / >=1.5 / >=2) is an analysis-time decision - only the
   ratio is stored here. */
function captureAOIGeometry(){
  const rects = snapshotAOIRects();
  const cal = study.calibration || {};
  const moff = (cal.mean_offset_px != null && cal.mean_offset_px > 0) ? cal.mean_offset_px : null;
  const vp = study.task_viewport || { w: window.innerWidth, h: window.innerHeight };
  const rects_norm = {}, per_aoi = {};
  let minAdq = null, minDimPx = null;
  Object.keys(rects).forEach(k=>{
    const r = rects[k];
    rects_norm[k] = {
      x: vp.w ? +(r.x/vp.w).toFixed(4) : null, y: vp.h ? +(r.y/vp.h).toFixed(4) : null,
      w: vp.w ? +(r.w/vp.w).toFixed(4) : null, h: vp.h ? +(r.h/vp.h).toFixed(4) : null
    };
    const dim = Math.min(r.w, r.h);
    if(minDimPx === null || dim < minDimPx) minDimPx = dim;
    if(moff){ const a = +(dim/moff).toFixed(3); per_aoi[k] = a; if(minAdq === null || a < minAdq) minAdq = a; }
    else per_aoi[k] = null;
  });
  const adequacy = { per_aoi:per_aoi, min:minAdq, min_panel_min_dim_px:minDimPx,
                     mean_offset_px_used:moff, task_viewport_used:{ w:vp.w, h:vp.h } };
  return { rects:rects, rects_norm:rects_norm, adequacy:adequacy };
}

/* Mid-case viewport-stability guard. A fullscreen exit or resize stales the
   start-snapshotted rects (and WebGazer's viewport-locked mapping), so log the
   event, prompt a return to fullscreen, and flag if the viewport no longer
   matches the calibration viewport. Case trials only (gaze is captured there). */
let vpGuardState = null;
function installViewportGuard(caseObj){
  detachViewportGuard();
  const calVp = study.calibration_viewport || study.task_viewport || { w:window.innerWidth, h:window.innerHeight };
  const st = { events:[], changed:false, calVp:calVp, fsHandler:null, rzHandler:null, rzTimer:null };
  function mark(type){
    const w=window.innerWidth, h=window.innerHeight;
    st.events.push({ t:(typeof nowRel==='function'? nowRel(): Date.now()), type:type, w:w, h:h });
    if(calVp && (Math.abs(w-calVp.w)>2 || Math.abs(h-calVp.h)>2)) st.changed=true;
  }
  function showReturnOverlay(){
    if(document.getElementById('vp_guard')) return;
    const o=document.createElement('div'); o.id='vp_guard';
    Object.assign(o.style,{position:'fixed',inset:'0',background:'rgba(20,30,40,.96)',color:'#fff',zIndex:2147483600,display:'flex',alignItems:'center',justifyContent:'center',textAlign:'left',font:'16px system-ui'});
    o.innerHTML=`<div style="max-width:560px;padding:0 24px"><h2 style="color:#ffb4a2;margin:0 0 12px">Please return to full screen</h2><p style="line-height:1.7">This study needs to stay in full screen so the eye tracking stays accurate. Your work is saved. Click below to continue where you left off.</p><button id="vp_return" style="margin-top:16px;padding:12px 24px;background:#1e8e4e;color:#fff;border:0;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer">Return to full screen</button></div>`;
    document.body.appendChild(o);
    document.getElementById('vp_return').onclick=()=>{ try{ document.documentElement.requestFullscreen(); }catch(e){} };
  }
  st.fsHandler=function(){
    if(!document.fullscreenElement){ mark('fullscreen_exit'); showReturnOverlay(); }
    else { const g=document.getElementById('vp_guard'); if(g) g.remove(); mark('fullscreen_return'); }
  };
  st.rzHandler=function(){ clearTimeout(st.rzTimer); st.rzTimer=setTimeout(()=>{ if(document.fullscreenElement) mark('resize'); }, 250); };
  document.addEventListener('fullscreenchange', st.fsHandler);
  window.addEventListener('resize', st.rzHandler);
  vpGuardState=st;
}
function detachViewportGuard(){
  if(!vpGuardState) return;
  try{ document.removeEventListener('fullscreenchange', vpGuardState.fsHandler); }catch(e){}
  try{ window.removeEventListener('resize', vpGuardState.rzHandler); }catch(e){}
  const g=document.getElementById('vp_guard'); if(g) g.remove();
}

/* Analyzed data only (event_log + descriptive state). Recon is NOT included. */
function serializeCaseData(){
  return {
    case_id:CASE.id, case_role:CASE.role, case_name:CASE.name,
    synthesis:{
      impression:state.synthesis.impression,
      impression_last_edit:state.synthesis.impression_stamp,
      impression_revisions:state.synthesis.impression_revisions,
      desired_outcomes:state.synthesis.desired_outcomes.map(o=>({id:o.id, text:o.text, otpf4_outcome_type:o.otpf4_outcome_type, ts:o.ts}))
    },
    occupations:state.occupations,
    entries:state.entries.map(e=>({id:e.id, type:e.type, excerpt:e.excerpt, provenance_src:e.src, mechanism:e.mechanism, otpf4_aspect:e.aspect, occupation_id:e.occId, ts:e.ts})),
    intervention_plan:state.plan,
    event_log:state.log
  };
}

/* Remove any body-appended engine overlays so they never bleed between trials. */
function cleanupOverlays(){
  if(typeof removePop==="function"){ try{ removePop(); }catch(e){} }
  if(typeof removeCoach==="function"){ try{ removeCoach(); }catch(e){} }
  const cl = document.getElementById("cl"); if(cl) cl.remove();
  document.querySelectorAll(".pop,.coach,#rp_hud,#rp_cursor,#rp_net,#rp_continue,#rp_busy,#vp_guard").forEach(el=>el.remove());
  if(window.CSS && CSS.highlights){ CSS.highlights.clear(); }
}

/* ---------- TASK TRIAL ---------- */
let pendingCaseData=null, pendingAOIGeom=null, pendingRecon=null;

function submitCase(){
  pendingCaseData = serializeCaseData();
  pendingRecon = { deltas: state.recon.deltas.slice(), cursor: state.recon.cursor.slice() };
  cleanupOverlays();
  jsPsych.finishTrial();
}

/* Banner Submit for REAL cases (practice ends via the walkthrough Continue). */
function addBannerSubmit(){
  if(isPractice()) return;
  const banner = document.querySelector("#app .banner");
  if(!banner || banner.querySelector(".case-submit")) return;
  const btn = document.createElement("button");
  btn.className = "case-submit";
  btn.textContent = "Submit case and continue";
  btn.style.cssText = "margin-left:auto;padding:10px 20px;background:#1e6bb8;color:#fff;border:none;border-radius:7px;font-weight:700;font-size:14px;cursor:pointer";
  banner.style.display = "flex"; banner.style.alignItems = "center";
  banner.appendChild(btn);
  btn.addEventListener("click", ()=>{
    const ok = window.confirm(
      "Submit this case and continue to the replay? You will not be able to return to it.\n\n" +
      "Recorded so far:\n" +
      "  " + state.occupations.length + " occupation(s)\n" +
      "  " + state.entries.length + " support/barrier classification(s)\n" +
      "  " + state.synthesis.desired_outcomes.length + " desired outcome(s)");
    if(ok) submitCase();
  });
}

function makeCaseTrial(caseObj, withGaze){
  const trial = {
    type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
    stimulus: '<div id="ot_mount"></div>',
    data: { trial_tag:"case", case_id:caseObj.id, case_role:caseObj.role, case_name:caseObj.name },
    on_load: function(){
      mountAppInto("ot_mount");
      CASE = caseObj; state = freshState(); seq = 0; beginCaseClock();
      renderCase();
      attachCursorSampling();
      setupWalkthrough();     // practice only (no-op for real cases)
      addBannerSubmit();      // real cases only
      pendingAOIGeom = captureAOIGeometry();
      installViewportGuard(caseObj);
    },
    on_finish: function(data){
      if(pendingCaseData){ data.case_data = pendingCaseData; }
      const geom = pendingAOIGeom || { rects:null, rects_norm:null, adequacy:null };
      data.aoi_rects_start = geom.rects;
      data.gaze_tracked = !!withGaze;
      data.case_started_offset_ms = study.session_started_at_ms ? (Date.now() - study.session_started_at_ms) : null;
      const rec = study.cases[caseObj.id] = study.cases[caseObj.id] || {};
      rec.task = pendingCaseData;
      rec.aoi_rects_start = geom.rects;
      rec.aoi_rects_start_norm = geom.rects_norm;
      rec.aoi_adequacy = geom.adequacy;
      rec.gaze_tracked = !!withGaze;
      rec.case_started_offset_ms = data.case_started_offset_ms;
      rec.recon = pendingRecon;          // replay-only; NEVER exported
      if(vpGuardState){ rec.viewport_events = vpGuardState.events; rec.viewport_changed_after_calibration = vpGuardState.changed; }
      detachViewportGuard(); vpGuardState = null;
      pendingCaseData = null; pendingAOIGeom = null; pendingRecon = null;
    }
  };
  if(withGaze) trial.extensions = [{ type: jsPsychExtensionWebgazer, params: { targets: AOI_SELECTORS } }];
  return trial;
}

/* ---------- WHISPER (post-replay transcription) ---------- */
/* Decode a recorded audio Blob to 16 kHz mono Float32 for the Whisper worker. */
function pcm16kFromBlob(blob){
  return blob.arrayBuffer().then(buf=>{
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    return ac.decodeAudioData(buf).then(audio=>{
      try{ ac.close && ac.close(); }catch(e){}
      const rate = 16000;
      const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(audio.duration*rate)), rate);
      const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start(0);
      return off.startRendering().then(rendered=>rendered.getChannelData(0));
    });
  });
}
let __whisperSeq = 0;
/* Returns { text, chunks:[{text, timestamp:[s,e]}] }. Robust to a missing/failed
   worker (resolves empty) so the study never blocks on transcription. */
function transcribeAudio(float32){
  return new Promise((resolve)=>{
    if(typeof __whisperWorker === "undefined" || !__whisperWorker){ resolve({text:"", chunks:[]}); return; }
    let done=false; const id = ++__whisperSeq;
    window.__onWhisperResult = (data)=>{ if(done) return; done=true; resolve({ text:(data&&data.text)||"", chunks:(data&&data.chunks)||[] }); };
    try{ __whisperWorker.postMessage({ type:'transcribe', audioData:float32, id }); }
    catch(e){ if(!done){ done=true; resolve({text:"", chunks:[]}); } }
    setTimeout(()=>{ if(!done){ done=true; resolve({text:"", chunks:[]}); } }, 180000);
  });
}

/* ---------- RTA RECONSTRUCTION-REPLAY TRIAL ---------- */
function makeReplayTrial(caseObj){
  return {
    type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
    stimulus: '<div id="ot_mount"></div>',
    data: { trial_tag:"rta_replay", case_id:caseObj.id, case_role:caseObj.role, case_name:caseObj.name },
    on_load: function(){
      const store = study.cases[caseObj.id] || (study.cases[caseObj.id] = {});
      const rec = store.recon || { deltas:[], cursor:[] };
      const offset = store.case_started_offset_ms != null ? store.case_started_offset_ms : null;

      mountAppInto("ot_mount");
      CASE = caseObj; state = freshState(); seq = 0;

      const cap = (window.Reanchor ? window.Reanchor.makeNarrationCapture() : null);
      const audio = { stream:null, recorder:null, chunks:[], startWall:null, map:[], vadTimer:null, ac:null, analyser:null };

      function sampleClock(){ try{ audio.map.push({ wall:Date.now(), playT:Replay._state().playT }); }catch(e){} }
      function playTAtWall(wall){
        if(!audio.map.length) return 0;
        let best = audio.map[0];
        for(const m of audio.map){ if(Math.abs(m.wall-wall) < Math.abs(best.wall-wall)) best = m; }
        return best.playT;
      }
      const clockTimer = setInterval(sampleClock, 100);

      function startAudio(){
        return navigator.mediaDevices.getUserMedia({ audio:true }).then(stream=>{
          audio.stream = stream;
          try{ audio.recorder = new MediaRecorder(stream); }catch(e){ audio.recorder = null; }
          if(audio.recorder){
            audio.recorder.ondataavailable = e=>{ if(e.data && e.data.size) audio.chunks.push(e.data); };
            audio.startWall = Date.now(); audio.recorder.start(1000);
          }
          try{
            const AC = window.AudioContext || window.webkitAudioContext;
            audio.ac = new AC();
            const node = audio.ac.createMediaStreamSource(stream);
            audio.analyser = audio.ac.createAnalyser(); audio.analyser.fftSize = 1024; node.connect(audio.analyser);
            const buf = new Uint8Array(audio.analyser.fftSize);
            audio.vadTimer = setInterval(()=>{
              audio.analyser.getByteTimeDomainData(buf);
              let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
              if(Math.sqrt(sum/buf.length) > 0.04){ try{ Replay.noteSpeech(Replay._state().playT); }catch(e){} }
            }, 150);
          }catch(e){}
        }).catch(e=>{ /* no mic -> replay still runs, narration empty */ });
      }
      function stopAudio(){
        if(audio.vadTimer) clearInterval(audio.vadTimer);
        try{ audio.ac && audio.ac.close(); }catch(e){}
        return new Promise(res=>{
          if(!audio.recorder || audio.recorder.state === "inactive"){ if(audio.stream) audio.stream.getTracks().forEach(t=>t.stop()); res(null); return; }
          audio.recorder.onstop = ()=>{ if(audio.stream) audio.stream.getTracks().forEach(t=>t.stop()); res(new Blob(audio.chunks, { type: audio.recorder.mimeType || "audio/webm" })); };
          try{ audio.recorder.stop(); }catch(e){ res(null); }
        });
      }

      let finishing=false;
      function finishReplay(){
        if(finishing) return; finishing=true;
        clearInterval(clockTimer);
        showBusy("Processing your narration. This can take up to a minute.");
        stopAudio().then(blob=>{
          if(!blob || !cap){ storeAndEnd([]); return; }
          pcm16kFromBlob(blob).then(pcm=>transcribeAudio(pcm)).then(res=>{
            const chunks = (res.chunks && res.chunks.length) ? res.chunks : (res.text ? [{text:res.text, timestamp:[0,0]}] : []);
            chunks.forEach(ch=>{
              const s = (ch.timestamp && ch.timestamp[0]!=null) ? ch.timestamp[0] : 0;
              const wall = (audio.startWall || Date.now()) + s*1000;
              cap.noteUtterance((ch.text||"").trim(), playTAtWall(wall), { paused:false, kind:'final' });
            });
            storeAndEnd(window.Reanchor.reanchorAll(cap.getNarration(), offset));
          }).catch(()=>storeAndEnd([]));
        });
      }
      function storeAndEnd(reanchored){
        store.rta = { narration:reanchored, silence_prompts:(function(){ try{ return Replay._state().fires; }catch(e){ return []; } })() };
        cleanupOverlays();
        jsPsych.finishTrial();
      }

      function showContinue(cb){
        if(document.getElementById("rp_continue")) return;
        const b=document.createElement("button"); b.id="rp_continue"; b.textContent="Finish narrating and continue";
        b.style.cssText="position:fixed;right:16px;bottom:74px;z-index:10003;background:#1e8e4e;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:700 14px system-ui;cursor:pointer";
        b.onclick=cb; document.body.appendChild(b);
      }
      function showBusy(msg){
        let d=document.getElementById("rp_busy");
        if(!d){ d=document.createElement("div"); d.id="rp_busy"; document.body.appendChild(d);
          Object.assign(d.style,{position:'fixed',inset:'0',background:'rgba(15,23,42,.94)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',zIndex:10005,font:'16px system-ui',textAlign:'center',padding:'0 24px'}); }
        d.textContent=msg;
      }
      function addReplayNote(){
        const n=document.createElement("div"); n.id="rp_note";
        n.textContent="Watch your session play back and talk through what you were thinking. Pause anytime to explain.";
        Object.assign(n.style,{position:'fixed',left:'50%',top:'10px',transform:'translateX(-50%)',zIndex:10004,background:'#0f172a',color:'#fff',font:'13px system-ui',padding:'8px 14px',borderRadius:'8px',opacity:'.95'});
        document.body.appendChild(n); setTimeout(()=>{ n.style.transition='opacity .5s'; n.style.opacity='0'; setTimeout(()=>n.remove(),600); }, 6000);
      }

      startAudio().then(()=>{
        addReplayNote();
        Replay.start(rec, { silenceThresholdMs: CONFIG.RTA_SILENCE_MS, onDone: function(){ showContinue(finishReplay); } });
      });
    },
    on_finish: function(data){
      const store = study.cases[caseObj.id];
      data.rta_narration = (store && store.rta && store.rta.narration) || [];
      data.rta_silence_prompts = (store && store.rta && store.rta.silence_prompts) || [];
    }
  };
}

/* ---------- CHUNK 4: ONE-FILE EXPORT ---------- */
function collectGazeForCase(caseId){
  try{
    const rows = jsPsych.data.get().filter({ trial_tag:"case", case_id:caseId }).values();
    if(rows.length && rows[0].webgazer_data) return rows[0].webgazer_data;
  }catch(e){}
  return [];
}
function buildSessionExport(){
  return {
    schema:"ot_prof_reasoning_v1",
    study_id: study.sub_id_from_url || null,
    generated_at: new Date().toISOString(),
    session:{
      started_at:study.started_at, user_agent:study.user_agent,
      session_started_at_ms:study.session_started_at_ms,
      fullscreen_viewport:study.fullscreen_viewport, task_viewport:study.task_viewport,
      gaze_enabled:study.gaze_enabled, gaze_skip_reason:study.gaze_skip_reason, gaze_threshold_used:study.gaze_threshold_used,
      calibration:study.calibration, calibration_viewport:study.calibration_viewport,
      screen_geometry:study.screen_geometry, browser_check:study.browser_check, permissions:study.permissions,
      rta_silence_threshold_ms: CONFIG.RTA_SILENCE_MS
    },
    cases: CASES_IN_ORDER.map(c=>{
      const rec = study.cases[c.id] || {};
      return {
        case_id:c.id, case_role:c.role, case_name:c.name,
        analyzed:(c.role!=="Practice"),
        gaze_tracked:!!rec.gaze_tracked,
        case_started_offset_ms: rec.case_started_offset_ms != null ? rec.case_started_offset_ms : null,
        aoi_rects: rec.aoi_rects_start || null,
        aoi_rects_norm: rec.aoi_rects_start_norm || null,
        aoi_adequacy: rec.aoi_adequacy || null,
        viewport_changed_after_calibration: !!rec.viewport_changed_after_calibration,
        viewport_events: rec.viewport_events || [],
        task: rec.task || null,                                   // event_log + descriptive state (Stream 1 source)
        rta: (rec.rta && rec.rta.narration) || [],                // Stream 2, re-anchored to task time
        rta_silence_prompts: (rec.rta && rec.rta.silence_prompts) || [],
        gaze: collectGazeForCase(c.id)                            // raw {x,y,t} for RQA
      };
    })
    /* NOTE: state.recon (deltas + cursor) is intentionally NOT exported. */
  };
}
function makeExportTrial(){
  return {
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    data:{ trial_tag:"export" },
    on_load: function(){
      cleanupOverlays();
      const payload = buildSessionExport();
      const fname = "ot_session_" + (study.sub_id_from_url || "anon") + "_" + Date.now() + ".json";
      const blob = new Blob([JSON.stringify(payload)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const q = CONFIG.QUALTRICS_UPLOAD_URL;
      const qHtml = (q && q.indexOf("REPLACE")<0)
        ? ('Then continue to the upload page: <a href="'+q+'">'+q+'</a>')
        : 'Upload page not yet configured (placeholder).';
      document.body.innerHTML =
        '<div style="max-width:640px;margin:8% auto;font-family:system-ui;color:#17232e;text-align:left;padding:0 20px">'
        + '<h2 style="color:#1565c0">You are finished. Thank you.</h2>'
        + '<p style="font-size:16px;line-height:1.7">One last step saves your session as a single file. Download it, then upload it to the study page as instructed.</p>'
        + '<p><a id="dl" href="'+url+'" download="'+fname+'" style="display:inline-block;background:#1e8e4e;color:#fff;text-decoration:none;padding:12px 24px;border-radius:7px;font-weight:700">Download my session file</a></p>'
        + '<p style="font-size:14px;color:#566574">File name: '+fname+'</p>'
        + '<p style="font-size:14px;color:#566574">'+qHtml+'</p>'
        + '</div>';
    }
  };
}

/* ---------- TIMELINE: interleave task + replay per case; gaze-gated ---------- */
timeline.push({
  conditional_function: function(){ return study.gaze_enabled; },
  timeline: CASES_IN_ORDER.reduce((acc,c)=>{ acc.push(makeCaseTrial(c,true)); acc.push(makeReplayTrial(c)); return acc; }, [])
});
timeline.push({
  conditional_function: function(){ return !study.gaze_enabled; },
  timeline: CASES_IN_ORDER.reduce((acc,c)=>{ acc.push(makeCaseTrial(c,false)); acc.push(makeReplayTrial(c)); return acc; }, [])
});
timeline.push(makeExportTrial());

jsPsych.run(timeline);

</script>
