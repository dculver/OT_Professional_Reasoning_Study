  <!-- Whisper transcription via inline Blob Worker (no external file needed, no CORS issues) -->
  <script>
    let __whisperWorker   = null;
    let __workerReady     = false;
    let __modelProgress   = 0;
    let __pendingResolve  = null;
    let __pendingReject   = null;

    /* The entire worker code as a string — avoids file-serving and MIME-type issues.
       Uses importScripts with the UMD/classic build which works in classic workers. */
    const WORKER_CODE = `
      let transcriber = null;

      async function loadModel() {
        if (transcriber) return;
        const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
        env.allowLocalModels = false;
        env.useBrowserCache  = true;
        transcriber = await pipeline(
          "automatic-speech-recognition",
          "Xenova/whisper-small.en",
          {
            progress_callback: (p) => {
              if (p && p.progress != null)
                self.postMessage({ type:"progress", progress: Math.round(p.progress) });
            }
          }
        );
      }

      self.onmessage = async (e) => {
        const { type, audioData } = e.data;
        if (type === "warmup") {
          try { await loadModel(); self.postMessage({ type:"ready" }); }
          catch(err) { self.postMessage({ type:"error", message: String(err) }); }
          return;
        }
        if (type === "transcribe") {
          try {
            await loadModel();
            const result = await transcriber(audioData, {
              return_timestamps: true, chunk_length_s: 30, stride_length_s: 5
            });
            self.postMessage({ type:"result", text: result.text||"", chunks: Array.isArray(result.chunks)?result.chunks:[] });
          } catch(err) {
            self.postMessage({ type:"error", message: String(err) });
          }
          return;
        }
      };
    `;

    function initWhisperWorker() {
      if (__whisperWorker) return;
      /* Create worker from Blob — same-origin, no file needed, no MIME issues */
      const blob = new Blob([WORKER_CODE], { type:"application/javascript" });
      const url  = URL.createObjectURL(blob);
      __whisperWorker = new Worker(url, { type:"module" });

      __whisperWorker.onmessage = (e) => {
        const { type, progress, text, chunks, message } = e.data;
        if (type === "progress") {
          __modelProgress = progress;
        } else if (type === "ready") {
          __workerReady = true;
        } else if (type === "result") {
          if (__pendingResolve) { __pendingResolve({ text, chunks }); __pendingResolve = null; __pendingReject = null; }
        } else if (type === "error") {
          console.error("Whisper worker error:", message);
          if (__pendingReject) { __pendingReject(new Error(message)); __pendingResolve = null; __pendingReject = null; }
        }
      };
      __whisperWorker.onerror = (e) => {
        console.error("Whisper worker onerror:", e);
        if (__pendingReject) { __pendingReject(new Error("Worker error")); __pendingResolve = null; __pendingReject = null; }
      };
      __whisperWorker.postMessage({ type:"warmup" });
    }

    function warmUpTranscriber() { initWhisperWorker(); }

    async function transcribeBlob(blob) {
      try {
        initWhisperWorker();
        const ab  = await blob.arrayBuffer();
        const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate:16000 });
        const buf = await ctx.decodeAudioData(ab);
        const audioData = buf.getChannelData(0);

        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            __pendingResolve = null; __pendingReject = null;
            resolve({ text:"[transcription timeout]", chunks:[] });
          }, 120000);

          __pendingResolve = (result) => { clearTimeout(timeout); resolve(result); };
          __pendingReject  = (err)    => { clearTimeout(timeout); reject(err); };

          __whisperWorker.postMessage({ type:"transcribe", audioData }, [audioData.buffer]);
        });
      } catch(e) {
        console.error("transcribeBlob error:", e);
        return { text:"[transcription error: " + e.message + "]", chunks:[] };
      }
    }
  </script>

<body style="margin:0;padding:0;background:#0f1b2d;font-family:'Segoe UI',Arial,sans-serif;">
<script>
/* =====================================================================
   BROWSER COMPATIBILITY GATE
   Tab-level screen sharing, WebM MediaRecorder, WebAssembly (Whisper),
   and WebGazer all require Chrome or Edge on desktop.
   Firefox lacks tab sharing; Safari lacks WebM; all mobile browsers
   lack getDisplayMedia.
   ===================================================================== */
(function checkBrowser() {
  const ua = navigator.userAgent;
  const isChrome = /Chrome\//.test(ua) && !/Edg\//.test(ua) && !/OPR\//.test(ua);
  const isEdge   = /Edg\//.test(ua);
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  if (isMobile || (!isChrome && !isEdge)) {
    document.body.style.background = "#0f1923";
    document.body.innerHTML = `
      <div style="max-width:580px;margin:12% auto;text-align:left;color:#c8d8e8;
           font-family:'Segoe UI',Arial,sans-serif;padding:0 20px;">
        <h2 style="color:#e05a5a;">Unsupported Browser</h2>
        <p style="font-size:17px;line-height:1.7;">This study requires <strong>Google Chrome</strong>
           or <strong>Microsoft Edge</strong> on a <strong>desktop or laptop computer</strong>.</p>
        <p style="font-size:15px;color:#7a9ab0;">The study uses tab-level screen recording and local
           speech processing that are not supported in ${isMobile ? "mobile browsers" : "your current browser"}.
           Please reopen this link in Chrome or Edge on a desktop machine.</p>
      </div>`;
    throw new Error("Unsupported browser — study halted.");
  }
})();

/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG = {
  OSF_EXPERIMENT_ID: "7to0EiezFvtE",
  WHISPER_MODEL: "Xenova/whisper-small.en",
  FORCE_CONDITION: null,           // set to "dashboard" or "control" to override randomization
  MIN_DWELL_MS: 150,
  SCREEN_FPS: 15,
  RTA_MAX_SECONDS: 240
};

/* =====================================================================
   SESSION STATE
   ===================================================================== */
const study = {
  participant_code: null,
  sub_id_from_url: new URLSearchParams(location.search).get("sub_id"),
  experimental_condition: null,
  calibration: {},
  cases: {},
  user_agent: navigator.userAgent,
  started_at: new Date().toISOString()
};
const caseMedia = {};

/* =====================================================================
   TRANSCRIBER — worker-based (see whisper-worker.js + inline script above)
   warmUpTranscriber and transcribeBlob are defined in the inline script.
   __modelProgress is set by worker progress messages.
   ===================================================================== */

/* =====================================================================
   SCREEN RECORDING
   ===================================================================== */
function pickVideoMime() {
  for (const c of ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  return "";
}
async function startScreenRecording(id) {
  const stream = await navigator.mediaDevices.getDisplayMedia({
    video: { frameRate: CONFIG.SCREEN_FPS },
    audio: false,
    // Chrome/Edge 94+: pre-selects this tab in the share picker
    preferCurrentTab: true,
    selfBrowserSurface: "include"
  });
  const mime = pickVideoMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  caseMedia[id] = { stream, recorder:rec, chunks, blob:null, url:null };
  rec.start(1000);
  return stream;
}
function stopScreenRecording(id) {
  return new Promise(res => {
    const m = caseMedia[id];
    if (!m || !m.recorder || m.recorder.state === "inactive") return res();
    m.recorder.onstop = () => {
      m.blob = new Blob(m.chunks, { type:m.recorder.mimeType || "video/webm" });
      m.url = URL.createObjectURL(m.blob);
      m.stream.getTracks().forEach(t => t.stop());
      res();
    };
    try { m.recorder.stop(); } catch (e) { res(); }
  });
}

/* =====================================================================
   OSF / DataPipe
   ===================================================================== */
function uniqueName(tag) {
  const id    = study.participant_code || study.sub_id_from_url || "ANON";
  const stamp = new Date().toISOString().replace(/[:.]/g,"-");
  const rand  = Math.random().toString(36).substr(2,5);
  return id + "_" + tag + "_" + stamp + "_" + rand + ".json";
}
function postToDataPipe(filename, dataObj) {
  return fetch("https://pipe.jspsych.org/api/data/", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Accept":"*/*" },
    body: JSON.stringify({ experimentID: CONFIG.OSF_EXPERIMENT_ID, filename, data: JSON.stringify(dataObj) })
  }).then(async resp => {
    let body = null; try { body = await resp.json(); } catch (e) { body = await resp.text(); }
    return { ok: resp.ok && !(body && body.error), status: resp.status, body };
  });
}
function uploadCaseInBackground(caseId) {
  const payload = {
    participant_code: study.participant_code,
    sub_id_from_url: study.sub_id_from_url,
    experimental_condition: study.experimental_condition,
    calibration: study.calibration,
    case_id: caseId, partial: true,
    "case": study.cases[caseId] || {},
    started_at: study.started_at,
    saved_at: new Date().toISOString()
  };
  postToDataPipe(uniqueName("case"+caseId), payload)

/* Calibration protocol per Yang & Krajbich (2021, JDM):
   Three attempts with escalating pixel radius and descending hit-rate
   thresholds. On all three failures, proceed-and-flag rather than
   terminate — for a fixed dissertation sample, losing participants
   to calibration is not viable. The gaze_quality field lets you
   make stream-specific exclusion decisions analytically in R. */
var calibAttempt = 0;
const CALIB_THRESHOLDS = [
  { roi_radius:130, min_pct:80 },   // attempt 1
  { roi_radius:165, min_pct:70 },   // attempt 2
  { roi_radius:200, min_pct:60 }    // attempt 3
];
const CALIB_RETRY_MSGS = [
  "Eye-tracking accuracy was below 80%. Adjust your lighting so your face is evenly lit from the front, make sure your whole face is visible, and keep your head completely still.",
  "Accuracy was still below 70%. This is your final attempt. Sit closer to your screen, fix your gaze precisely on each dot, and do not move your head at all."
];

var validation_trial = {
  type: jsPsychWebgazerValidate,
  validation_points: calib_points,
  roi_radius: () => CALIB_THRESHOLDS[Math.min(calibAttempt, 2)].roi_radius,
  time_limit:2200, show_validation_data:false
};
timeline.push({
  timeline: [calibration_instructions, calibration_grid, validation_instructions, validation_trial],
  loop_function: function (data) {
    var v = data.filter({ trial_type:"webgazer-validate" }).last(1).values()[0];
    var thresh = CALIB_THRESHOLDS[Math.min(calibAttempt, 2)];
    var passed = v.percent_in_roi >= thresh.min_pct;
    calibAttempt++;

    if (passed) {
      study.calibration = {
        percent_in_roi: v.percent_in_roi, average_offset: v.average_offset,
        attempt_number: calibAttempt, roi_radius_used: thresh.roi_radius,
        gaze_quality: v.percent_in_roi >= 80 ? "good" : v.percent_in_roi >= 65 ? "acceptable" : "poor"
      };
      return false;
    }

    if (calibAttempt >= 3) {
      study.calibration = {
        percent_in_roi: v.percent_in_roi, average_offset: v.average_offset,
        attempt_number: calibAttempt, roi_radius_used: thresh.roi_radius,
        gaze_quality: "poor — three attempts failed, gaze stream may be unreliable"
      };
      alert("Eye-tracking accuracy is lower than ideal. The study will continue — your verbal reasoning and interaction data are fully usable regardless. If possible, improve your lighting and keep your head very still during the case.");
      return false;
    }

    alert(CALIB_RETRY_MSGS[calibAttempt - 1]);
    return true;
  }
});

      const bar = document.getElementById("model_bar");

    /* Safety fallback: if worker never signals ready within 3 minutes, proceed anyway */
    setTimeout(() => { clearInterval(tick); jsPsych.finishTrial(); }, 180000);
  }
});

/* =====================================================================
   AOI RECT SNAPSHOT  — called at trial start and on each tab switch
   ===================================================================== */
function snapshotAOIRects(caseConfig, caseStart) {
  const rects = [];
  caseConfig.aoi_map.forEach(aoi => {
    const el = document.getElementById(aoi.id) ||
               document.getElementById("bw_panel_" + aoi.id.replace("bw_panel_","") + "_" + caseConfig.id);
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    rects.push({
      id: aoi.id, emic: aoi.emic, etic: aoi.etic, label: aoi.label,
      left:r.left, right:r.right, top:r.top, bottom:r.bottom,
      snapshot_t: Math.round(performance.now() - caseStart)
    });
  });
  return rects;
}

/* =====================================================================
   GAZE → DWELL EVENTS  (identical logic to original index.html)
   ===================================================================== */
function pointToAOI(x, y, rects) {
  for (const r of rects) if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return r;
  return null;
}
function gazeToDwells(samples, rects) {
  const out = [];
  let cur = null, curStart = null, lastT = null;
  const sorted = (samples||[]).filter(s => s && s.x != null).sort((a,b)=>a.t-b.t);
  for (const s of sorted) {
    const hit = pointToAOI(s.x, s.y, rects);
    const aoi = hit ? hit.id : null;
    if (aoi !== cur) {
      if (cur && (lastT - curStart) >= CONFIG.MIN_DWELL_MS) {
        const r = rects.find(rr => rr.id === cur);
        out.push({ t:Math.round(curStart), aoi:cur, emic: r?r.emic:null, etic: r?r.etic:null, source:"gaze" });
      }
      cur = aoi; curStart = s.t;
    }
    lastT = s.t;
  }
  if (cur && lastT!=null && (lastT-curStart) >= CONFIG.MIN_DWELL_MS) {
    const r = rects.find(rr => rr.id === cur);
    out.push({ t:Math.round(curStart), aoi:cur, emic: r?r.emic:null, etic: r?r.etic:null, source:"gaze" });
  }
  return out.filter(e => e.emic || e.etic);
}

/* =====================================================================
   BIOWORLD TRIAL FACTORY
   ===================================================================== */
function buildBioWorldTrials(c) {

  /* ── Screen-share consent + recording start ── */
  const startRec = {
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    stimulus:`<div style="max-width:660px;margin:11% auto;text-align:left;color:#c8d8e8;font-family:'Segoe UI',Arial,sans-serif;">
        <h2 style="color:#5ab0f0;">Case ${c.id}: ${c.patientName}</h2>
        <p style="font-size:17px;line-height:1.7;">We will record this browser tab while you review the chart, so you can narrate over it afterward. The recording stays on your computer — only transcribed text is uploaded.</p>
        <p style="font-size:17px;background:#1d3450;padding:14px 16px;border-left:4px solid #5fb0e0;border-radius:4px;">
          Clicking <strong>Open Case ${c.id}</strong> will do two things automatically:
          <ol style="margin:10px 0 0;padding-left:22px;">
            <li>The browser will go <strong>fullscreen</strong> (so the recording captures only the case, without browser chrome).</li>
            <li>A screen-share dialog will appear — stay on the <strong>Microsoft Edge Tab / Chrome Tab</strong> option, select this experiment's tab, and click <strong>Share</strong>.</li>
          </ol>
        </p>
        <button id="rec_${c.id}" style="margin-top:16px;padding:14px 28px;background:#2b9fd6;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:15px;">Open Case ${c.id}</button>
        <p id="err_${c.id}" style="color:#e05a5a;margin-top:10px;"></p></div>`,
    on_load: function () {
      document.getElementById("rec_"+c.id).addEventListener("click", async () => {
        const btn = document.getElementById("rec_"+c.id);
        btn.disabled = true;
        try {
          // Fullscreen FIRST (same user-gesture tick) — removes browser chrome
          // so getBoundingClientRect() coords align with the video frame.
          try { await document.documentElement.requestFullscreen(); } catch(fe) {
            console.warn("Fullscreen request failed (non-fatal):", fe);
          }
          const s = await startScreenRecording(c.id);
          s.getVideoTracks()[0].addEventListener("ended", () => {
            const sub = document.getElementById("bw_submit_"+c.id); if (sub) sub.click();
          });
          jsPsych.finishTrial();
        } catch (e) {
          btn.disabled = false;
          document.getElementById("err_"+c.id).textContent = "Screen share cancelled — click again and follow the two steps above.";
        }
      });
    }
  };

  /* ── Main BioWorld EHR trial ── */
  const ehrTrial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: buildBioWorldUI(c),
    choices: "NO_KEYS",
    extensions: [{ type: jsPsychExtensionWebgazer, params:{ targets:["#bw_root_"+c.id] } }],
    data: { trial_tag:"bw_ehr_case", case_id:c.id },

    on_load: function () {
      /* hide live gaze dot */
      try { webgazer.showVideo(false); webgazer.showPredictionPoints(false); } catch(e) {}
      const dot = document.getElementById("webgazerGazeDot"); if (dot) dot.style.display="none";

      const caseStart = performance.now();
      const clickEvents = [];
      const hypState    = [];   // { id, text, belief }
      const evState     = [];   // { id, text, tag }
      const orderedAssessments = [];
      let   currentTab  = "problem";
      let   aoiRects    = snapshotAOIRects(c, caseStart);
      let   timerInterval;

      /* timer */
      timerInterval = setInterval(() => {
        const el = document.getElementById("bw_elapsed_"+c.id);
        if (!el) return;
        const sec = Math.floor((performance.now()-caseStart)/1000);
        el.textContent = String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
      }, 1000);

      /* ── helpers ── */
      function logClick(aoi, emic, etic, action, detail) {
        clickEvents.push({ t:Math.round(performance.now()-caseStart), aoi, emic, etic, source:"click", action, detail:detail||null });
      }

      function renderHypotheses() {
        const list = document.getElementById("bw_hyp_list_"+c.id);
        const sel  = document.getElementById("bw_belief_sel_"+c.id);
        if (!list || !sel) return;
        list.innerHTML = hypState.map(h =>
          `<div class="bw-hyp-row">
             <span class="bw-hyp-name" title="${h.text}">${h.text}</span>
             <button class="bw-hyp-rm" data-hyp-id="${h.id}">&times;</button>
           </div>`).join("");
        const curSel = sel.value;
        sel.innerHTML = '<option value="">— Select hypothesis —</option>' +
          hypState.map(h => `<option value="${h.id}" ${h.id==curSel?"selected":""}>${h.text}</option>`).join("");
        /* rebind remove buttons */
        list.querySelectorAll(".bw-hyp-rm").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.hypId;
            const h = hypState.find(x=>x.id===id);
            hypState.splice(hypState.findIndex(x=>x.id===id),1);
            logClick("bw_hyp_panel","","GOAL-SET","hypothesis_removed", h?h.text:id);
            renderHypotheses();
          });
        });
      }

      function renderEvidence() {
        const list  = document.getElementById("bw_ev_list_"+c.id);
        const empty = document.getElementById("bw_ev_empty_"+c.id);
        if (!list) return;
        if (evState.length === 0) { list.innerHTML=""; if(empty) empty.style.display="block"; return; }
        if (empty) empty.style.display="none";
        list.innerHTML = evState.map(e =>
          `<div class="bw-ev-item">
             <span class="bw-ev-tag tag-${e.tag}">${e.tag}</span>
             <span style="flex:1;font-size:12px;line-height:1.4;">${e.text}</span>
             <button class="bw-ev-rm" data-ev-id="${e.id}">&times;</button>
           </div>`).join("");
        list.querySelectorAll(".bw-ev-rm").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = parseInt(btn.dataset.evId);
            const item = evState.find(x=>x.id===id);
            evState.splice(evState.findIndex(x=>x.id===id),1);
            logClick("bw_ev_panel","","MONITOR","evidence_removed", item?item.text.substring(0,40):id);
            renderEvidence();
          });
        });
      }

      function addEvidence(text, tag, aoiId, emic, etic) {
        if (evState.some(e=>e.text===text)) return;
        const item = { id:Date.now(), text, tag };
        evState.push(item);
        logClick(aoiId||"bw_ev_panel", emic||"", etic||"MONITOR", "evidence_added", text.substring(0,60));
        renderEvidence();
      }

      /* ── Tab switching ── */
      document.querySelectorAll(".bw-tab[data-case='"+c.id+"']").forEach(btn => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          document.querySelectorAll(".bw-tab[data-case='"+c.id+"']").forEach(b=>b.classList.remove("active"));
          btn.classList.add("active");
          document.querySelectorAll("#bw_root_"+c.id+" .bw-panel").forEach(p=>p.classList.remove("active"));
          document.getElementById("bw_panel_"+tab+"_"+c.id).classList.add("active");
          currentTab = tab;
          aoiRects = snapshotAOIRects(c, caseStart);   // re-snapshot on tab change
          const aoiMap = { problem:"bw_panel_problem", chart:"bw_panel_chart", library:"bw_panel_library", plan:"bw_panel_plan" };
          const emicMap = { problem:"NARRATIVE", chart:"SCIENTIFIC", library:"SCIENTIFIC", plan:"PRAGMATIC" };
          const eticMap = { problem:"TASK-DEF", chart:"ENACTING", library:"ENACTING", plan:"ENACTING" };
          logClick(aoiMap[tab]+"_"+c.id, emicMap[tab]||"", eticMap[tab]||"ENACTING", "tab_switch", tab);
        });
      });

      /* ── Hypothesis add ── */
      const hypAddBtn = document.querySelector(".bw-hyp-add[data-case='"+c.id+"']");
      const hypInput  = document.getElementById("bw_hyp_input_"+c.id);
      function doAddHyp() {
        const text = hypInput.value.trim(); if (!text) return;
        const h = { id: String(Date.now()), text, belief:50 };
        hypState.push(h);
        hypInput.value = "";
        logClick("bw_hyp_panel","","GOAL-SET","hypothesis_added",text);
        renderHypotheses();
      }
      if (hypAddBtn) hypAddBtn.addEventListener("click", doAddHyp);
      if (hypInput)  hypInput.addEventListener("keydown", e => { if(e.key==="Enter") doAddHyp(); });

      /* ── Belief meter ── */
      const beliefSel    = document.getElementById("bw_belief_sel_"+c.id);
      const beliefSlider = document.getElementById("bw_belief_slider_"+c.id);
      const beliefVal    = document.getElementById("bw_belief_val_"+c.id);
      if (beliefSlider) {
        beliefSlider.addEventListener("input", () => {
          const val = parseInt(beliefSlider.value);
          if (beliefVal) beliefVal.textContent = "Confidence: "+val+"%";
          if (beliefSel && beliefSel.value) {
            const h = hypState.find(x=>x.id===beliefSel.value);
            if (h) {
              h.belief = val;
              logClick("bw_belief_panel","","GOAL-SET","belief_updated", beliefSel.options[beliefSel.selectedIndex]?.text+":"+val+"%");
            }
          }
        });
        if (beliefSel) beliefSel.addEventListener("change", () => {
          const h = hypState.find(x=>x.id===beliefSel.value);
          if (h && beliefSlider) { beliefSlider.value=h.belief; if(beliefVal) beliefVal.textContent="Confidence: "+h.belief+"%"; }
        });
      }

      /* ── Paragraph evidence buttons ── */
      document.querySelectorAll("#bw_root_"+c.id+" .bw-para-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const paraId = btn.dataset.para;
          const text   = c.paragraphs[paraId];
          const aoi    = c.aoi_map.find(a=>a.id===paraId);
          if (!text) return;
          addEvidence(text, "patient", paraId, aoi?aoi.emic:"NARRATIVE", aoi?aoi.etic:"TASK-DEF");
          const para = document.getElementById(paraId);
          if (para) para.classList.add("para-added");
          btn.textContent = "✓ Added";
        });
      });

      /* ── Clear evidence ── */
      const clearBtn = document.getElementById("bw_clear_ev_"+c.id);
      if (clearBtn) clearBtn.addEventListener("click", () => {
        evState.length = 0;
        logClick("bw_ev_panel","","MONITOR","evidence_cleared",null);
        renderEvidence();
        document.querySelectorAll("#bw_root_"+c.id+" .bw-ev-para").forEach(p=>p.classList.remove("para-added"));
        document.querySelectorAll("#bw_root_"+c.id+" .bw-para-btn").forEach(b=>b.textContent="+ Evidence");
      });

      /* ── Assessment cards ── */
      document.querySelectorAll("#bw_root_"+c.id+" .bw-assess-card").forEach(card => {
        card.addEventListener("click", () => {
          if (card.classList.contains("ordered")) return;
          card.classList.add("ordered");
          const assessId = card.dataset.assessId;
          const assess   = c.assessments.find(a=>a.id===assessId);
          orderedAssessments.push(assessId);
          logClick("bw_panel_chart_"+c.id,"SCIENTIFIC","ENACTING","assessment_ordered", assess?assess.name:assessId);

          const area = document.getElementById("bw_result_area_"+c.id);
          const list = document.getElementById("bw_result_list_"+c.id);
          if (!area || !list || !assess) return;
          area.classList.add("visible");
          const card2 = document.createElement("div");
          card2.className = "bw-result-card";
          card2.innerHTML = `<div class="bw-result-title">${assess.fullName}</div>
            <div class="bw-result-body">${assess.result}</div>`;
          const sendBtn = document.createElement("button");
          sendBtn.className = "bw-result-send";
          sendBtn.textContent = "+ Send to Evidence";
          sendBtn._evidenceText = assess.name+": "+assess.result;
          sendBtn.addEventListener("click", () => {
            addEvidence(sendBtn._evidenceText, "assess", "bw_panel_chart_"+c.id, "SCIENTIFIC","ENACTING");
            sendBtn.textContent = "✓ Added";
            sendBtn.disabled = true;
          });
          card2.appendChild(sendBtn);
          list.appendChild(card2);

      });
      document.querySelectorAll("#bw_panel_plan_"+c.id+" input[type='checkbox']").forEach(cb => {
        cb.addEventListener("change", () => {
          logClick("bw_panel_plan_"+c.id,"PRAGMATIC","ENACTING",cb.checked?"equip_selected":"equip_deselected",cb.value);

      /* ── AOI click logging on left panel regions ── */
      ["bw_hyp_panel","bw_belief_panel","bw_ev_panel"].forEach(panelId => {
        const el = document.getElementById(panelId);
        if (!el) return;
        const aoi = c.aoi_map.find(a=>a.id===panelId);
        el.addEventListener("click", () => {
          logClick(panelId, aoi?aoi.emic:"", aoi?aoi.etic:"GOAL-SET","panel_click",panelId);

      /* ── Submit ── */
      const submitBtn = document.getElementById("bw_submit_"+c.id);
      if (submitBtn) submitBtn.addEventListener("click", async () => {
        clearInterval(timerInterval);
        const pickedPlan  = document.querySelector(`input[name="bw_plan_${c.id}"]:checked`);
        const pickedEquip = [...document.querySelectorAll("#bw_panel_plan_"+c.id+" input[type='checkbox']:checked")].map(cb=>cb.value);
        const summary     = document.getElementById("bw_summary_"+c.id).value.trim();
        logClick("bw_panel_plan_"+c.id,"PRAGMATIC","ENACTING","case_submitted",pickedPlan?pickedPlan.value:"none");
        // Capture viewport dims while still in fullscreen (no browser chrome bias)
        const captureW = window.innerWidth, captureH = window.innerHeight;
        await stopScreenRecording(c.id);
        // Exit fullscreen before RTA replay screen
        if (document.fullscreenElement) try { await document.exitFullscreen(); } catch(fe) {}
        jsPsych.finishTrial({
          click_events:        clickEvents,
          aoi_rects:           aoiRects,
          hypotheses:          hypState,
          evidence_table:      evState,
          assessments_ordered: orderedAssessments,
          selected_plan:       pickedPlan ? pickedPlan.value : null,
          selected_equipment:  pickedEquip,
          case_summary:        summary,
          captureW, captureH
        });
      });

      /* initial AOI snapshot after DOM settles */
      setTimeout(() => { aoiRects = snapshotAOIRects(c, caseStart); }, 300);
    },

    on_finish: function (data) {
      study.cases[c.id] = study.cases[c.id] || {};
      study.cases[c.id].click_events        = data.click_events        || [];
      study.cases[c.id].hypotheses          = data.hypotheses          || [];
      study.cases[c.id].evidence_table      = data.evidence_table      || [];
      study.cases[c.id].assessments_ordered = data.assessments_ordered || [];
      study.cases[c.id].selected_plan       = data.selected_plan;
      study.cases[c.id].selected_equipment  = data.selected_equipment  || [];
      study.cases[c.id].case_summary        = data.case_summary        || "";
      study.cases[c.id].choice              = data.selected_plan;      // dashboard compat
      study.cases[c.id].aoi_map             = c.aoi_map;
      study.cases[c.id].aoi_rects           = data.aoi_rects           || [];
      study.cases[c.id].gaze_events         = gazeToDwells(data.webgazer_data||[], data.aoi_rects||[]);
      study.cases[c.id]._gaze_raw           = data.webgazer_data       || [];
      study.cases[c.id].viewport            = { w: data.captureW || window.innerWidth, h: data.captureH || window.innerHeight };
    }
  };

  /* ── RTA (retrospective think-aloud) — identical pattern to original ── */
  const rtaTrial = {
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    stimulus:`<div style="position:fixed;inset:0;background:#000;">
        <div style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;background:#fff;padding:10px 16px;border:2px solid #2b9fd6;border-radius:6px;text-align:center;">
          <strong>Retrospective Review</strong> <span style="color:#c0392b;margin-left:8px;">&#127908; narrate your reasoning as you re-watch</span></div>
        <video id="rv_${c.id}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;" muted playsinline></video>
        <canvas id="ro_${c.id}" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"></canvas>
        <button id="rd_${c.id}" disabled style="position:fixed;bottom:24px;right:24px;z-index:10;padding:14px 28px;background:#7f8c8d;color:#fff;border:none;border-radius:6px;font-weight:700;">Done narrating</button>
      </div>`,
    data: { trial_tag:"rta", case_id:c.id },
    on_load: async function () {
      const m      = caseMedia[c.id];
      const video  = document.getElementById("rv_"+c.id);
      const canvas = document.getElementById("ro_"+c.id);
      const done   = document.getElementById("rd_"+c.id);
      const ctx    = canvas.getContext("2d");
      const gaze     = (study.cases[c.id] && study.cases[c.id]._gaze_raw) || [];
      const aoiRects = (study.cases[c.id] && study.cases[c.id].aoi_rects) || [];

      const AOI_COLORS = {
        "TASK-DEF":"91,176,224", "GOAL-SET":"155,89,182",
        "ENACTING":"26,188,156", "MONITOR":"231,76,60",
        "SCIENTIFIC":"39,174,96", "NARRATIVE":"241,196,15", "PRAGMATIC":"231,76,60"
      };

      if (!m || !m.url) { study.cases[c.id].transcript_segments=[]; return jsPsych.finishTrial(); }
      video.src = m.url;

      let aStream=null, aRec=null, aChunks=[], aStart=0, vStart=0;
      try {
        aStream = await navigator.mediaDevices.getUserMedia({ audio:true });
        aRec = new MediaRecorder(aStream);
        aRec.ondataavailable = e => { if(e.data && e.data.size) aChunks.push(e.data); };
      } catch(e) { console.error("mic failed",e); }

      function loop() {
        if (video.paused || video.ended) return;
        canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const tMs=video.currentTime*1000;

        // Letterbox-aware scaling using stored fullscreen viewport dims.
        // This ensures AOI highlights land on the video content, not the
        // black bars, regardless of the participant's screen size or DPR.
        const vp=(study.cases[c.id]&&study.cases[c.id].viewport)||{w:window.innerWidth,h:window.innerHeight};
        const cW=canvas.width, cH=canvas.height;
        const vidAspect=vp.w/vp.h, canAspect=cW/cH;
        let drawW, drawH, offX=0, offY=0;
        if (vidAspect>canAspect) { drawW=cW; drawH=cW/vidAspect; offY=(cH-drawH)/2; }
        else { drawH=cH; drawW=cH*vidAspect; offX=(cW-drawW)/2; }
        const sx=drawW/vp.w, sy=drawH/vp.h;

        const recent=gaze.filter(p=>p.t<=tMs&&(tMs-p.t)<200);
        if (!recent.length) return requestAnimationFrame(loop);
        const ax=recent.reduce((s,p)=>s+p.x,0)/recent.length;
        const ay=recent.reduce((s,p)=>s+p.y,0)/recent.length;
        const age=tMs-recent[recent.length-1].t;
        if (age>500) return requestAnimationFrame(loop);

        /* highlight the AOI region with etic/emic code colour */
        const hit=aoiRects.find(r=>ax>=r.left&&ax<=r.right&&ay>=r.top&&ay<=r.bottom);
        if (hit) {
          const codeKey=hit.etic||hit.emic||"";
          const rgb=AOI_COLORS[codeKey]||"255,255,255";
          const rx=offX+hit.left*sx, ry=offY+hit.top*sy,
                rw=(hit.right-hit.left)*sx, rh=(hit.bottom-hit.top)*sy;
          ctx.fillStyle=`rgba(${rgb},0.22)`; ctx.strokeStyle=`rgba(${rgb},0.85)`; ctx.lineWidth=3;
          ctx.fillRect(rx,ry,rw,rh); ctx.strokeRect(rx,ry,rw,rh);
          ctx.fillStyle=`rgba(${rgb},1)`; ctx.font="bold 13px 'Segoe UI',Arial,sans-serif";
          ctx.fillText((hit.etic||hit.emic||""), rx+10, ry+20);
        }
        ctx.beginPath(); ctx.arc(offX+ax*sx, offY+ay*sy, 10,0,2*Math.PI);
        ctx.fillStyle="rgba(255,212,0,0.75)"; ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=1.5;
        ctx.fill(); ctx.stroke();
        requestAnimationFrame(loop);
      }

      video.addEventListener("play",()=>{ vStart=performance.now(); if(aRec&&aRec.state==="inactive"){aRec.start();aStart=performance.now();} requestAnimationFrame(loop); });
      video.addEventListener("ended",()=>{ done.disabled=false; done.style.background="#27ae60"; });
      setTimeout(()=>{ if(done.disabled){done.disabled=false;done.style.background="#27ae60";} }, CONFIG.RTA_MAX_SECONDS*1000);
      try { await video.play(); } catch(e){ done.disabled=false; done.style.background="#27ae60"; }

      done.addEventListener("click", async () => {
        done.disabled=true; done.textContent="Saving…";
        try { video.pause(); } catch(e){}
        const offset=(aStart-vStart)/1000;

        /* Progress indicator — worker runs off main thread so UI stays responsive */
        const progressDiv = document.createElement("div");
        progressDiv.style.cssText = "position:fixed;bottom:80px;right:24px;z-index:20;background:#16263d;color:#cdd9e5;padding:14px 20px;border-radius:8px;border:1px solid #2b9fd6;font-size:14px;font-family:'Segoe UI',Arial,sans-serif;max-width:340px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4);";
        progressDiv.innerHTML = `
          <div style="font-weight:600;margin-bottom:6px;">&#127908; Transcribing narration…</div>
          <div style="font-size:12px;color:#8aa0b6;margin-bottom:10px;">Running locally. Page stays responsive.</div>
          <div style="background:#0f1923;border-radius:4px;height:6px;overflow:hidden;">
            <div id="trans_bar" style="background:#2b9fd6;height:100%;width:0%;transition:width .4s;border-radius:4px;"></div>
          </div>
          <div id="trans_pct" style="font-size:12px;color:#5ab0f0;margin-top:6px;">0%</div>`;
        document.body.appendChild(progressDiv);

        /* Poll worker progress into the bar */
        const barInterval = setInterval(() => {
          const bar = document.getElementById("trans_bar");
          const pct = document.getElementById("trans_pct");
          if (bar) bar.style.width = __modelProgress + "%";
          if (pct) pct.textContent  = __modelProgress + "%";
        }, 300);

        const finalize = async (blob) => {
          clearInterval(barInterval);
          if (progressDiv.parentNode) progressDiv.parentNode.removeChild(progressDiv);

          let segs = [];
          if (blob && blob.size) {
            try {
              const out = await transcribeBlob(blob);   /* non-blocking — runs in worker */
              segs = (out.chunks || []).map(ch => {
                const [s, e] = ch.timestamp || [null, null];
                return {
                  start_ms: s == null ? null : Math.round((s + offset) * 1000),
                  end_ms:   e == null ? null : Math.round((e + offset) * 1000),
                  text: (ch.text || "").trim()
                };
              }).filter(x => x.text);
              study.cases[c.id].transcript_full = out.text.trim();
            } catch(transcribeErr) {
              console.error("Transcription failed:", transcribeErr);
              study.cases[c.id].transcript_full = "[transcription error]";
            }
          }
          study.cases[c.id].transcript_segments = segs;
          delete study.cases[c.id]._gaze_raw;
          uploadCaseInBackground(c.id);
          if (aStream) try { aStream.getTracks().forEach(t => t.stop()); } catch(e){}
          if (m.url){ try { URL.revokeObjectURL(m.url); } catch(e){} m.url=null; m.blob=null; }
          jsPsych.finishTrial();
        };

        if (aRec && aRec.state !== "inactive") {
          aRec.onstop  = () => finalize(new Blob(aChunks, { type: aRec.mimeType || "audio/webm" }));
          aRec.onerror = () => finalize(null);
          try { aRec.stop(); } catch(e) { finalize(null); }
        } else {
          finalize(null);
        }
      });
    }
  };

  return [startRec, ehrTrial, rtaTrial];
}

    video.addEventListener("ended",()=>{done.disabled=false;done.style.background="#27ae60";});
    setTimeout(()=>{done.disabled=false;done.style.background="#27ae60";},90000);
    try{await video.play();}catch(e){done.disabled=false;done.style.background="#27ae60";}
    done.addEventListener("click",()=>{
      try{video.pause();}catch(e){}
      if(aRec&&aRec.state!=="inactive")aRec.stop();
      if(aStream)aStream.getTracks().forEach(t=>t.stop());
      if(m.url){URL.revokeObjectURL(m.url);m.url=null;m.blob=null;}
      jsPsych.finishTrial(); // practice audio discarded — never transcribed, never saved
    });
  }
};
const practiceDebrief = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus:`<div style="max-width:680px;margin:8% auto;color:#c8d8e8;text-align:left;padding:0 20px;font-family:'Segoe UI',Arial,sans-serif;">
      <h2 style="color:#5ac070;">Practice complete.</h2>
      <p style="font-size:16px;line-height:1.7;">Before you begin the real cases, a quick reminder:</p>
      <div style="background:#1d3450;border-left:4px solid #5ac070;padding:16px 20px;border-radius:6px;margin:16px 0;">
        <ul style="margin:0;padding-left:20px;font-size:15px;line-height:2.1;">
          <li><strong>Focus on your thinking at the time</strong>, not your current reaction to the video.</li>
          <li><strong>Say "I was thinking…"</strong> to anchor yourself in the past moment.</li>
          <li><strong>If you are uncertain</strong>, say so — that is useful data.</li>
          <li><strong>Do not evaluate yourself.</strong> There are no right or wrong answers.</li>
        </ul>
      </div>
      <p style="font-size:15px;color:#7a9ab0;">The next screen will begin Case 1 — a real OT clinical scenario with the full BioWorld interface.</p>
      <p style="text-align:center;margin-top:28px;color:#7a9ab0;">Press any key when you are ready.</p>
    </div>`,
  choices:"ALL_KEYS"
};
[practiceStartRec, practiceCase, practiceRTA, practiceDebrief].forEach(t => timeline.push(t));

/* Case 1 */
buildBioWorldTrials(BW_CASES[1]).forEach(t => timeline.push(t));

/* IDB handoff to dashboard */
timeline.push({
  type: jsPsychCallFunction, async:true,
  func: function (done) {
    const c1 = study.cases[1] || {};
    const handoff = {
      case_id:1, condition: study.experimental_condition,
      aoi_map:            c1.aoi_map             || [],
      gaze_events:        c1.gaze_events          || [],
      click_events:       c1.click_events         || [],
      transcript_segments:c1.transcript_segments  || [],
      hypotheses:         c1.hypotheses           || [],
      evidence_table:     c1.evidence_table       || [],
      assessments_ordered:c1.assessments_ordered  || [],
      selected_plan:      c1.selected_plan        || null,
      selected_equipment: c1.selected_equipment   || [],
      case_summary:       c1.case_summary         || "",
      choice:             c1.choice               || null
    };
    try {
      const req = indexedDB.open("OT_Simulation_DB",1);
      req.onupgradeneeded = e => { const db=e.target.result; if(!db.objectStoreNames.contains("sessions")) db.createObjectStore("sessions",{keyPath:"id"}); };
      req.onsuccess = e => { try { const db=e.target.result; const tx=db.transaction("sessions","readwrite"); tx.objectStore("sessions").put({id:"active_session",data:JSON.stringify(handoff)}); tx.oncomplete=()=>done(); tx.onerror=()=>done(); } catch(err){ done(); } };
      req.onerror = () => done();
    } catch(e){ done(); }
  }
});

/* Mid-session recalibration (Yang & Krajbich, 2021) */
var midCalibAttempt=0;
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus:`<div style="max-width:680px;margin:10% auto;text-align:left;color:#c8d8e8;font-family:'Segoe UI',Arial,sans-serif;">
      <h3 style="color:#5ab0f0;">Quick eye-tracking re-check</h3>
      <p style="font-size:16px;">Before Case 2 we do a brief recalibration to maintain accuracy. This takes about 30 seconds.</p>
      <p style="font-size:16px;background:#1d3450;padding:12px;border-left:4px solid #5fb0e0;border-radius:4px;">
        Sit in the same position as before. Make sure your face is well-lit and centered in the webcam.</p>
      <p style="color:#7a9ab0;margin-top:20px;">Press any key to begin.</p></div>`,
  choices:"ALL_KEYS"
});
timeline.push({
  timeline: [calibration_grid, validation_instructions, {
    type: jsPsychWebgazerValidate, validation_points: calib_points,
    roi_radius:200, time_limit:2200, show_validation_data:false
  }],
  loop_function: function(data) {
    var v=data.filter({trial_type:"webgazer-validate"}).last(1).values()[0];
    study.calibration.mid_session={percent_in_roi:v.percent_in_roi, average_offset:v.average_offset};
    midCalibAttempt++;
    if(v.percent_in_roi>=50||midCalibAttempt>=2) return false;
    alert("Eye-tracking accuracy has drifted. Please reposition carefully — one more attempt.");
    return true;
  }
});

/* Dashboard (experimental group only) */
timeline.push({
  timeline: [{
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    stimulus:`<div style="width:100vw;height:100vh;display:flex;flex-direction:column;">
        <div style="padding:14px;background:#16263d;color:#fff;display:flex;justify-content:space-between;align-items:center;">
          <h3 style="margin:0;">Clinical Reasoning Feedback</h3>
          <button id="cont2" style="padding:10px 20px;font-weight:700;background:#27ae60;color:#fff;border:none;border-radius:6px;cursor:pointer;">Continue to Case 2 &#9654;</button></div>
        <iframe src="./dashboard/index.html" style="flex-grow:1;border:none;background:#fff;"></iframe></div>`,
    on_load: () => document.getElementById("cont2").addEventListener("click", () => jsPsych.finishTrial())
  }],
  conditional_function: () => study.experimental_condition === "dashboard"
});

/* Case 2 */
buildBioWorldTrials(BW_CASES[2]).forEach(t => timeline.push(t));

jsPsych.run(timeline);
</script>
