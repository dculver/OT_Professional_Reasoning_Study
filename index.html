  <!-- Whisper transcription via inline Blob Worker (no external file needed, no CORS issues) -->
  <script>
    let __whisperWorker   = null;
    let __workerReady     = false;
    let __modelProgress   = 0;
    let __pendingResolve  = null;
    let __pendingReject   = null;

    /* The entire worker code as a string — avoids file-serving and MIME-type issues.
       Uses importScripts with the UMD/classic build which works in classic workers. */
    const WORKER_CODE = `
      let transcriber = null;
      let modelName   = "Xenova/whisper-small.en";  // default; overridden by warmup message

      async function loadModel() {
        if (transcriber) return;
        const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
        env.allowLocalModels = false;
        env.useBrowserCache  = true;
        transcriber = await pipeline(
          "automatic-speech-recognition",
          modelName,
          {
            progress_callback: (p) => {
              if (p && p.progress != null)
                self.postMessage({ type:"progress", progress: Math.round(p.progress) });
            }
          }
        );
      }

      self.onmessage = async (e) => {
        const { type, audioData, model } = e.data;
        if (type === "warmup") {
          if (model) modelName = model;
          try { await loadModel(); self.postMessage({ type:"ready" }); }
          catch(err) { self.postMessage({ type:"error", message: String(err) }); }
          return;
        }
        if (type === "transcribe") {
          try {
            await loadModel();
            const result = await transcriber(audioData, {
              return_timestamps: true, chunk_length_s: 30, stride_length_s: 5
            });
            self.postMessage({ type:"result", text: result.text||"", chunks: Array.isArray(result.chunks)?result.chunks:[] });
          } catch(err) {
            self.postMessage({ type:"error", message: String(err) });
          }
          return;
        }
      };
    `;

    function initWhisperWorker() {
      if (__whisperWorker) return;
      /* Create worker from Blob — same-origin, no file needed, no MIME issues */
      const blob = new Blob([WORKER_CODE], { type:"application/javascript" });
      const url  = URL.createObjectURL(blob);
      __whisperWorker = new Worker(url, { type:"module" });

      __whisperWorker.onmessage = (e) => {
        const { type, progress, text, chunks, message } = e.data;
        if (type === "progress") {
          __modelProgress = progress;
        } else if (type === "ready") {
          __workerReady = true;
        } else if (type === "result") {
          if (__pendingResolve) { __pendingResolve({ text, chunks }); __pendingResolve = null; __pendingReject = null; }
        } else if (type === "error") {
          console.error("Whisper worker error:", message);
          if (__pendingReject) { __pendingReject(new Error(message)); __pendingResolve = null; __pendingReject = null; }
        }
      };
      __whisperWorker.onerror = (e) => {
        console.error("Whisper worker onerror:", e);
        if (__pendingReject) { __pendingReject(new Error("Worker error")); __pendingResolve = null; __pendingReject = null; }
      };
      __whisperWorker.postMessage({ type:"warmup", model: CONFIG.WHISPER_MODEL });
    }

    function warmUpTranscriber() { initWhisperWorker(); }

    async function transcribeBlob(blob) {
      try {
        initWhisperWorker();
        const ab = await blob.arrayBuffer();

        /* Decode at the native sample rate first — forcing 16kHz on the AudioContext
           causes decodeAudioData to time-compress the audio on some Chrome/macOS builds,
           which produces garbled input and Whisper hallucinations ("you you you you").
           We decode natively then resample manually to the 16kHz Whisper expects. */
        const nativeCtx = new (window.AudioContext || window.webkitAudioContext)();
        const nativeBuf = await nativeCtx.decodeAudioData(ab);
        nativeCtx.close();

        let audioData;
        if (nativeBuf.sampleRate === 16000) {
          audioData = nativeBuf.getChannelData(0);
        } else {
          /* Offline resample to 16kHz */
          const offlineCtx = new OfflineAudioContext(
            1,
            Math.ceil(nativeBuf.duration * 16000),
            16000
          );
          const src = offlineCtx.createBufferSource();
          src.buffer = nativeBuf;
          src.connect(offlineCtx.destination);
          src.start(0);
          const resampled = await offlineCtx.startRendering();
          audioData = resampled.getChannelData(0);
        }

        /* Normalize amplitude — if the recording is very quiet (peak < 0.1),
           scale it up so Whisper receives a usable signal rather than
           near-silence which causes hallucinations like "you you you". */
        const peak = audioData.reduce((m, v) => Math.max(m, Math.abs(v)), 0);
        if (peak > 0 && peak < 0.1) {
          const scale = Math.min(0.95 / peak, 10);  // cap at 10× to avoid amplifying pure noise
          const normalized = new Float32Array(audioData.length);
          for (let i = 0; i < audioData.length; i++) normalized[i] = audioData[i] * scale;
          audioData = normalized;
        } else if (peak === 0) {
          /* Completely silent — return empty result rather than hallucinating */
          return { text: "", chunks: [] };
        }

        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            __pendingResolve = null; __pendingReject = null;
            resolve({ text:"[transcription timeout]", chunks:[] });
          }, 120000);

          __pendingResolve = (result) => { clearTimeout(timeout); resolve(result); };
          __pendingReject  = (err)    => { clearTimeout(timeout); reject(err); };

          __whisperWorker.postMessage({ type:"transcribe", audioData }, [audioData.buffer]);
        });
      } catch(e) {
        console.error("transcribeBlob error:", e);
        return { text:"[transcription error: " + e.message + "]", chunks:[] };
      }
    }
  </script>

  <style>
    /* Screen-reader-only utility — visually hidden but available to AT */
    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    /* ── jsPsych global overrides ── */
    .jspsych-display-element, .jspsych-content { color:#16202e; }
    /* jsPsych centers stimulus content by default — override for the BioWorld interface */
    .jspsych-display-element { text-align:left; }
    .jspsych-content h1,.jspsych-content h2,.jspsych-content h3,
    .jspsych-content h4,.jspsych-content p,.jspsych-content label,
    .jspsych-content span,.jspsych-survey-text-question label { color:#16202e; }
    .jspsych-content input[type="text"],.jspsych-content textarea,
    .jspsych-content select { color:#16263d; background:#ffffff; }
    .jspsych-btn { color:#16263d; background:#e8eef5; border:1px solid #9fb3c4; }
    .jspsych-btn:hover { background:#d4deea; }

    /* ── Calibration dots ── */
    .jspsych-webgazer-calibrate-point,.jspsych-webgazer-validate-point,
    .calibration-point,.validation-point,
    div[id^="calibration-point"],div[id^="validation-point"],#webgazerGazeDot {
      background-color:#a87c00 !important;
      border:2px solid #16263d !important;
      box-shadow:0 0 8px 2px rgba(255,212,0,0.8) !important;
      opacity:1 !important;
      transition: top 80ms linear, left 80ms linear !important;
    }

    /* ================================================================
       BIOWORLD INTERFACE STYLES
       ================================================================ */
    * { box-sizing:border-box; }

    .bw-root {
      width:100vw; height:100vh; display:flex; flex-direction:column;
      background:#ffffff; color:#16202e;
      font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden;
    }

    /* Top nav */
    .bw-topbar {
      background:#e3e9f0; border-bottom:1px solid #d0d9e3;
      padding:0 16px; height:48px; display:flex; align-items:center; gap:0; flex-shrink:0;
    }
    .bw-tab {
      height:48px; padding:0 20px; background:transparent; border:none;
      border-bottom:3px solid transparent; color:#566673;
      font-size:13px; font-weight:500; cursor:pointer;
      letter-spacing:.04em; text-transform:uppercase;
      transition:color .15s,border-color .15s;
    }
    .bw-tab:hover { color:#1d2a38; }
    .bw-tab.active { color:#1565c0; border-bottom-color:#1565c0; }
    .bw-patient-label { margin-left:auto; font-size:12px; color:#44545f; letter-spacing:.06em; }

    /* ================================================================
       MAIN LAYOUT — four gaze AOI regions separated by explicit gutters.

       --bw-gutter is a MEASUREMENT parameter, not a style choice. It creates
       uncoded dead space between adjacent AOIs so that a gaze sample landing
       near a boundary falls outside both rects and is dropped, rather than
       being confidently assigned to the wrong one. WebGazer's reported error
       is ~130-210px (Papoutsaki et al., 2016; Slim & Hartsuiker, 2023), so
       adjacent AOIs sharing a 1px border are not separable at all.

       Layout is FROZEN for the duration of the study. Panel geometry shapes
       the gaze transition matrix, which is the RQA input — changing it
       mid-study would make RQA values non-comparable across participants.
       ================================================================ */
    :root { --bw-gutter: 36px; }

    .bw-main {
      display:flex; flex:1; overflow:hidden;
      background:#e2e8ef;                        /* gutter colour */
      gap:var(--bw-gutter); padding:var(--bw-gutter);
    }

    /* Left column — hypothesis manager + confidence meter only.
       The evidence table moved to the right column so these two panels
       split the full column height instead of sharing it three ways. */
    .bw-left {
      width:340px; flex-shrink:0;
      display:flex; flex-direction:column; gap:var(--bw-gutter); overflow:hidden;
    }

    /* Right column — main content (2/3) + evidence table (1/3) */
    .bw-right {
      flex:1; min-width:0;
      display:flex; flex-direction:column; gap:var(--bw-gutter); overflow:hidden;
    }

    /* Shared panel chrome. Every gaze AOI is exactly one of these boxes. */
    .bw-panel-section, .bw-evidence-section {
      background:#f2f5f9; border:1px solid #d0d9e3; border-radius:8px;
      flex:1; padding:14px 16px; overflow-y:auto; min-height:0;
    }
    .bw-panel-label {
      font-size:11px; font-weight:600; letter-spacing:.1em;
      text-transform:uppercase; color:#566673; margin-bottom:8px;
    }

    /* Hypothesis manager */
    .bw-hyp-list { display:flex; flex-direction:column; gap:6px; }
    .bw-hyp-row {
      display:flex; align-items:center; gap:8px;
      background:#f4f7fa; border:1px solid #d0d9e3;
      border-radius:6px; padding:7px 10px;
    }
    .bw-hyp-name { flex:1; font-size:13px; color:#1d2a38; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bw-hyp-rm { width:24px; height:24px; background:transparent; border:none; color:#566673; cursor:pointer; font-size:16px; line-height:1; padding:0; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .bw-hyp-rm:hover { color:#c0392b; }
    .bw-hyp-input-row { display:flex; gap:6px; margin-top:8px; }
    .bw-hyp-input {
      flex:1; background:#f4f7fa; border:1px solid #7790a5; border-radius:5px;
      color:#1d2a38; font-size:12px; padding:5px 8px;
    }
    .bw-hyp-input::placeholder { color:#8a9bab; }
    .bw-hyp-input:focus { border-color:#1565c0; }
    .bw-hyp-add {
      background:#d3e4f5; border:1px solid #7fb0dc; border-radius:5px;
      color:#1565c0; font-size:12px; padding:5px 10px; cursor:pointer;
    }
    .bw-hyp-add:hover { background:#bcd6ee; }

    /* Belief meter */
    .bw-belief-select {
      width:100%; background:#f4f7fa; border:1px solid #7790a5; border-radius:5px;
      color:#1d2a38; font-size:12px; padding:5px 8px; margin-bottom:10px;
    }
    .bw-belief-select:focus { border-color:#1565c0; }
    .bw-belief-slider {
      width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
      background:linear-gradient(to right,#c0392b 0%,#b86e00 35%,#16692f 60%,#1565c0 100%);
    }
    .bw-belief-slider::-webkit-slider-thumb {
      -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
      background:#1d2a38; cursor:pointer; border:2px solid #ffffff;
    }
    .bw-belief-labels { display:flex; justify-content:space-between; margin-top:4px; }
    .bw-belief-labels span { font-size:11px; color:#566673; }
    .bw-belief-value { text-align:center; font-size:12px; color:#1565c0; margin-top:4px; font-weight:500; }

    /* Evidence table — now full-width under the content area, so items are
       laid out as real table rows (tag | excerpt | remove) rather than as a
       cramped vertical list sized for a 280px column. */
    .bw-ev-list { display:flex; flex-direction:column; gap:5px; }
    .bw-ev-item {
      background:#ffffff; border:1px solid #d0d9e3; border-left:3px solid #16692f;
      border-radius:5px; padding:8px 12px; font-size:12px; color:#33424f;
      display:grid; grid-template-columns:84px 1fr 28px; align-items:start; gap:14px;
    }
    .bw-ev-tag {
      flex-shrink:0; font-size:10px; padding:1px 5px; border-radius:3px;
      font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:1px;
    }
    .tag-patient { background:#d3e4f5; color:#0d5aa7; }
    .tag-assess  { background:#dcefc4; color:#2f6618; }
    .tag-obs     { background:#f3e4c4; color:#6e5210; }
    .bw-ev-rm { background:transparent; border:none; color:#566673; cursor:pointer; font-size:14px; line-height:1; min-width:24px; min-height:24px; display:flex; align-items:center; justify-content:center; }
    .bw-ev-rm:hover { color:#c0392b; }
    .bw-ev-empty { font-size:12px; color:#566673; font-style:italic; padding:8px 0; }

    /* Content area — 2/3 of the right column height; evidence table takes 1/3 */
    .bw-content {
      flex:2; overflow-y:auto; padding:24px 28px; min-width:0; text-align:left;
      background:#ffffff; border:1px solid #d0d9e3; border-radius:8px; min-height:0;
    }
    .bw-panel { display:none; }
    .bw-panel.active { display:block; }
    /* hidden attribute on tabpanels is managed by JS; .active overrides it */
    .bw-panel[hidden].active { display:block; }

    /* Patient header */
    .bw-patient-header {
      display:flex; align-items:flex-start; gap:20px;
      margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid #d0d9e3;
    }
    .bw-avatar {
      width:56px; height:56px; border-radius:50%; background:#d3e4f5;
      border:2px solid #a9c8e6; display:flex; align-items:center;
      justify-content:center; font-size:20px; font-weight:600; color:#1565c0; flex-shrink:0;
    }
    .bw-patient-meta h2 { font-size:18px; font-weight:600; color:#16202e; margin-bottom:4px; }
    .bw-meta-row { display:flex; gap:16px; flex-wrap:wrap; }
    .bw-meta-chip { font-size:12px; color:#566673; display:flex; align-items:center; gap:4px; }
    .bw-meta-chip strong { color:#1d2a38; }

    .bw-section-heading {
      font-size:11px; font-weight:600; letter-spacing:.08em;
      text-transform:uppercase; color:#566673; margin:20px 0 10px;
    }
    .bw-narrative { font-size:14px; line-height:1.75; color:#2a3744; text-align:left; }
    .bw-narrative p { margin-bottom:12px; text-align:left; }

    /* Paragraph evidence — free-text highlight model */
    .bw-ev-para {
      position:relative; padding:10px 12px; border:1px solid transparent;
      border-radius:6px; margin-bottom:10px; transition:border-color .15s,background .15s;
      user-select:text; -webkit-user-select:text;
    }
    .bw-ev-para p { margin:0; }
    .bw-ev-para.para-added { border-color:#3aa564; background:#e6f4ea; }

    /* Floating selection popover */
    #bw-sel-popover {
      position:fixed; z-index:9999;
      background:#e3f4e9; border:1px solid #3aa564; border-radius:6px;
      padding:5px 10px; display:flex; align-items:center; gap:8px;
      box-shadow:0 4px 16px rgba(0,0,0,.5); pointer-events:auto;
      animation:bw-pop-in .1s ease;
    }
    @keyframes bw-pop-in { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    #bw-sel-popover button {
      background:#3aa564; border:1px solid #3aa564; border-radius:4px;
      color:#ffffff; font-size:11px; font-weight:600; padding:4px 10px; cursor:pointer;
      white-space:nowrap;
    }
    #bw-sel-popover button:hover { background:#2a8e52; color:#ffffff; }
    #bw-sel-popover .bw-sel-dismiss {
      background:transparent; border:none; color:#8a9bab; font-size:16px;
      line-height:1; padding:0 2px; cursor:pointer;
    }
    #bw-sel-popover .bw-sel-dismiss:hover { color:#c0392b; }

    /* Assessment grid */
    .bw-assess-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:4px; }
    .bw-assess-card {
      background:#f4f7fa; border:1px solid #d0d9e3; border-radius:8px;
      padding:14px; cursor:pointer; transition:border-color .15s,background .15s; position:relative;
    }
    .bw-assess-card:hover { border-color:#9fb3c4; background:#eaf0f6; }
    .bw-assess-card.ordered { border-color:#3aa564; background:#e6f4ea; }
    .bw-assess-card.ordered::after { content:'✓ Ordered'; position:absolute; top:8px; right:10px; font-size:10px; color:#16692f; font-weight:600; }
    .bw-assess-name { font-size:13px; font-weight:600; color:#1d2a38; margin-bottom:4px; }
    .bw-assess-desc { font-size:12px; color:#44545f; line-height:1.5; }
    .bw-result-area { margin-top:20px; display:none; }
    .bw-result-area.visible { display:block; }
    .bw-result-card { background:#e6f4ea; border:1px solid #bfe3c9; border-radius:8px; padding:16px; margin-bottom:10px; }
    .bw-result-title { font-size:13px; font-weight:600; color:#16692f; margin-bottom:8px; }
    .bw-result-body { font-size:13px; color:#3a4a3a; line-height:1.6; }
    .bw-result-send { margin-top:8px; background:#e3f4e9; border:1px solid #3aa564; color:#16692f; font-size:11px; padding:4px 10px; border-radius:4px; cursor:pointer; }
    .bw-result-send:hover { background:#bfe3c9; }

    /* Library */
    .bw-lib-entry { background:#f4f7fa; border:1px solid #d0d9e3; border-radius:8px; padding:14px; margin-bottom:10px; }
    .bw-lib-entry h4 { font-size:13px; font-weight:600; color:#1d2a38; margin-bottom:6px; }
    .bw-lib-entry p { font-size:12px; color:#44545f; line-height:1.5; }
    .bw-lib-send { margin-top:8px; background:#d3e4f5; border:1px solid #a9c8e6; color:#1565c0; font-size:11px; padding:3px 10px; border-radius:4px; cursor:pointer; }
    .bw-lib-send:hover { background:#a9c8e6; }

    /* Plan options */
    .bw-plan-options { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
    .bw-plan-option {
      display:flex; align-items:flex-start; gap:10px; background:#f4f7fa;
      border:1px solid #d0d9e3; border-radius:6px; padding:10px 12px;
      cursor:pointer; transition:border-color .15s;
    }
    .bw-plan-option:hover { border-color:#9fb3c4; }
    .bw-plan-option input { margin-top:2px; flex-shrink:0; accent-color:#1565c0; }
    .bw-plan-option-name { font-size:13px; font-weight:600; color:#1d2a38; }
    .bw-plan-option-rationale { font-size:12px; color:#44545f; margin-top:3px; line-height:1.4; }
    .bw-summary-input {
      width:100%; min-height:120px; background:#f4f7fa; border:1px solid #7790a5;
      border-radius:6px; color:#1d2a38; font-size:13px; padding:10px 12px;
      resize:vertical; line-height:1.6; font-family:inherit;
    }
    .bw-summary-input:focus { border-color:#1565c0; }
    .bw-summary-input::placeholder { color:#8a9bab; }

    /* Bottom bar */
    .bw-bottom {
      background:#e3e9f0; border-top:1px solid #d0d9e3;
      padding:10px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0;
    }
    .bw-elapsed { font-size:11px; color:#5a6a76; margin-right:auto; font-family:monospace; }
    .bw-btn {
      padding:7px 16px; border-radius:5px; font-size:13px;
      font-weight:500; cursor:pointer; border:1px solid;
    }
    .bw-btn-secondary { background:transparent; border-color:#7790a5; color:#566673; }
    .bw-btn-secondary:hover { border-color:#9fb3c4; color:#1d2a38; }
    .bw-btn-submit {
      background:#1e8e4e; border-color:#16692f; color:#ffffff;
      padding:9px 22px; font-size:14px; font-weight:600;
    }
    .bw-btn-submit:hover:not(:disabled) { background:#1a7a43; }
    .bw-btn-submit:disabled {
      background:#f2f5f9; border-color:#c0cad6; color:#7a8794;
      cursor:not-allowed; opacity:1;
    }
    @keyframes bw-submit-pulse {
      0%   { box-shadow:0 0 0 0 rgba(90,192,112,0.7); }
      60%  { box-shadow:0 0 0 10px rgba(90,192,112,0); }
      100% { box-shadow:0 0 0 0 rgba(90,192,112,0); }
    }
    .bw-btn-submit.unlocked { animation:bw-submit-pulse 0.8s ease-out 1; }
    .bw-submit-hint {
      font-size:11px; color:#566673; margin-right:8px; font-style:italic;
    }
    .bw-submit-hint.ready { color:#16692f; font-style:normal; font-weight:500; }
    .bw-tab-final::after { content:" ★"; color:#16692f; font-size:10px; }

    /* ── On-screen instruction banner ── */
    .bw-instructions {
      background:#eef4fb; border:1px solid #9cc0e0; border-radius:8px;
      padding:14px 16px; margin-bottom:20px; font-size:13px; line-height:1.7;
      color:#2a3744; position:relative;
    }
    .bw-instructions h4 {
      margin:0 0 10px; font-size:13px; color:#1565c0; font-weight:600;
      letter-spacing:.04em; text-transform:uppercase;
    }
    .bw-instructions ul { margin:0; padding-left:18px; }
    .bw-instructions li { margin-bottom:4px; }

<body style="margin:0;padding:0;background:#e9eef3;font-family:'Segoe UI',Arial,sans-serif;">
<script>
/* =====================================================================
   BROWSER COMPATIBILITY GATE
   The study needs three hard capabilities:
     1. Tab-level getDisplayMedia (screen recording of this tab)
     2. WebM MediaRecorder (the recording container)
     3. WebAssembly (Whisper speech-to-text runs as a WASM module)
   Plus a webcam (WebGazer) and getUserMedia (microphone for RTA).

   We gate on CAPABILITY, not browser NAME. Checking the user-agent for
   "chrome" (as the jsPsych browser-check example does) would wrongly reject
   Edge, Brave, Arc, Vivaldi, and Opera — all Chromium browsers that support
   these APIs. Feature detection is also immune to UA spoofing and to a browser
   that reports the right name but lacks a working API in a locked-down context.

   We still use the UA only to produce a HELPFUL message naming the likely
   culprit (Firefox/Safari/mobile), but the pass/fail decision is purely the
   capability tests below.
   ===================================================================== */
(function checkBrowser() {
  const ua        = navigator.userAgent;
  const isMobile  = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  const isFirefox = /Firefox\//.test(ua);
  const isSafari  = /Safari\//.test(ua) && !/Chrome\//.test(ua) && !/Chromium\//.test(ua);

  /* ── Capability probes ── */
  const missing = [];
  // 1. Tab-level screen capture
  if (!(navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === "function")) {
    missing.push("screen recording (getDisplayMedia)");
  }
  // 2. Microphone / camera capture
  if (!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function")) {
    missing.push("microphone/camera access (getUserMedia)");
  }
  // 3. MediaRecorder with a usable WebM codec
  let webmOK = false;
  if (typeof MediaRecorder !== "undefined" && typeof MediaRecorder.isTypeSupported === "function") {
    webmOK = MediaRecorder.isTypeSupported("video/webm") ||
             MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ||
             MediaRecorder.isTypeSupported("video/webm;codecs=vp8");
  }
  if (!webmOK) missing.push("WebM video recording (MediaRecorder)");
  // 4. WebAssembly (Whisper transcription)
  if (typeof WebAssembly !== "object" || typeof WebAssembly.instantiate !== "function") {
    missing.push("local speech processing (WebAssembly)");
  }
  // 5. Fullscreen API (the case runs fullscreen)
  const el = document.documentElement;
  if (!(el.requestFullscreen || el.webkitRequestFullscreen)) {
    missing.push("fullscreen mode");
  }

  /* Mobile is unsupported regardless of probes (no reliable tab share, small
     viewport, WebGazer unreliable). Otherwise, only fail if a probe failed. */
  if (isMobile || missing.length > 0) {
    /* Build a helpful, specific reason. */
    let reason;
    if (isMobile) {
      reason = "mobile browsers (this study must run on a desktop or laptop)";
    } else if (isFirefox) {
      reason = "Firefox, which does not support tab-level screen recording";
    } else if (isSafari) {
      reason = "Safari, which does not support the required recording format";
    } else {
      reason = "this browser, which is missing: " + missing.join(", ");
    }
    document.body.style.background = "#e3e9f0";
    document.body.innerHTML = `
      <div style="max-width:580px;margin:12% auto;text-align:left;color:#1d2a38;
           font-family:'Segoe UI',Arial,sans-serif;padding:0 20px;">
        <h2 style="color:#c0392b;">Unsupported Browser</h2>
        <p style="font-size:17px;line-height:1.7;">This study requires a <strong>Chromium-based desktop browser</strong>
           such as Google Chrome, Microsoft Edge, Arc, Brave, or Vivaldi.</p>
        <p style="font-size:15px;color:#566673;">The study uses tab-level screen recording and local
           speech processing that are not supported in ${reason}.
           Please reopen this link in a supported browser on a desktop or laptop computer.</p>
      </div>`;
    throw new Error("Unsupported browser — study halted (" +
      (isMobile ? "mobile" : missing.join("; ") || "ua") + ").");
  }
})();

/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG = {
  OSF_EXPERIMENT_ID: "7to0EiezFvtE",
  WHISPER_MODEL: "Xenova/whisper-small.en",
  FORCE_CONDITION: null,           // set to "dashboard" or "control" to override randomization
  MIN_DWELL_MS: 150,
  SCREEN_FPS: 15,
  RTA_MAX_SECONDS: 240,
  /* Administrative bypass key.
     >>> SET THIS TO null BEFORE DATA COLLECTION BEGINS. <<<
     null or "" disables DEV mode entirely, regardless of URL parameters.
     The repo is public, so this key is readable in source by anyone who
     looks — it is a guard against accidental triggering, not security. The
     real protections are the upload block in postToDataPipe() and the
     persistent red banner. */
  DEV_KEY: "rC1oon5liFE4UF7uFYkUnZ3ljXaY7uFy"
};

/* =====================================================================
   SESSION STATE
   ===================================================================== */
// Detect OS for platform-appropriate fullscreen shortcut
const study = {
  participant_code: null,
  sub_id_from_url: new URLSearchParams(location.search).get("sub_id"),
  experimental_condition: null,
  calibration: {},
  calibration_viewport: null,
  screen_geometry: {},
  browser_check: null,
  unlinked_session: false,
  cases: {},
  user_agent: navigator.userAgent,
  started_at: new Date().toISOString(),
  /* Recorded unconditionally so a bypassed session is identifiable in the
     data even if the banner was missed or a screenshot was cropped. */
  dev_mode: false,
  dev_params: null
};
const caseMedia = {};

/* =====================================================================
   TRANSCRIBER — inline Blob Worker (WORKER_CODE string above).
   No external file needed; avoids CORS and MIME-type issues on GitHub Pages.
   warmUpTranscriber() and transcribeBlob() are defined in the inline script.
   __modelProgress is updated by worker progress messages.
   ===================================================================== */

/* =====================================================================
   SCREEN RECORDING
   ===================================================================== */
function pickVideoMime() {
  for (const c of ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  return "";
}
async function startScreenRecording(id) {
  const stream = await navigator.mediaDevices.getDisplayMedia({
    video: { frameRate: CONFIG.SCREEN_FPS },
    audio: false,
    // Chrome/Edge 94+: pre-selects this tab in the share picker
    preferCurrentTab: true,
    selfBrowserSurface: "include"
  });
  const mime = pickVideoMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  caseMedia[id] = { stream, recorder:rec, chunks, blob:null, url:null };
  rec.start(1000);
  return stream;
}
function stopScreenRecording(id) {
  return new Promise(res => {
    const m = caseMedia[id];
    if (!m || !m.recorder || m.recorder.state === "inactive") return res();
    m.recorder.onstop = () => {
      m.blob = new Blob(m.chunks, { type:m.recorder.mimeType || "video/webm" });
      m.url = URL.createObjectURL(m.blob);
      m.stream.getTracks().forEach(t => t.stop());
      res();
    };
    try { m.recorder.stop(); } catch (e) { res(); }
  });
}

/* =====================================================================
   DEV / ADMINISTRATIVE BYPASS

   Purpose: reach the cases during development without sitting through
   calibration every time. NOT a participant-facing feature.

   Three properties this must have, in priority order:
     1. Impossible to trigger accidentally — gated on a long random key.
     2. Impossible to miss — persistent red banner + title marker, so a
        bypassed session can never be mistaken for a real one.
     3. Cannot contaminate the dataset — uploads are suppressed outright
        (see postToDataPipe), and study.dev_mode is recorded either way.

   Usage:
     ?devkey=KEY&skip=calib,practice
     ?devkey=KEY&skip=all&cond=dashboard
     ?devkey=KEY&skip=all&start=2

   Skip flags: chinrest, calib, webcam, whisper, practice, rtaintro,
               midcal, case1, all
     calib   — camera still initialises; calibration grid skipped. Gaze will
               be untrained and RQA meaningless, but the interface runs.
     webcam  — camera not initialised at all. This ALSO strips the WebGazer
               extension from the case trials; without that, the extension
               would attach to nothing and the case would appear to run fine
               while silently producing zero gaze samples.
   ===================================================================== */
const DEV = (function () {
  const p   = new URLSearchParams(location.search);
  const on  = p.get("devkey") === CONFIG.DEV_KEY && !!CONFIG.DEV_KEY;
  const set = new Set((p.get("skip") || "").split(",").map(x => x.trim()).filter(Boolean));
  return {
    active: on,
    skip:   id => on && (set.has(id) || set.has("all")),
    cond:   on ? p.get("cond")  : null,
    start:  on ? p.get("start") : null,
    raw:    on ? location.search : null
  };
})();

if (DEV.active) {
  document.title = "DEV MODE — " + document.title;
  window.addEventListener("DOMContentLoaded", () => {
    const b = document.createElement("div");
    b.id = "dev_banner";
    b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:2147483647;" +
      "background:#c0392b;color:#fff;font:600 12px/22px 'Segoe UI',sans-serif;" +
      "text-align:center;pointer-events:none;letter-spacing:.06em;";
    b.textContent = "DEV MODE — uploads suppressed — this session is not study data";
    document.body.appendChild(b);
  });
}

/* =====================================================================
   OSF / DataPipe
   ===================================================================== */
function uniqueName(tag) {
  const id    = study.participant_code || study.sub_id_from_url || "ANON";
  const stamp = new Date().toISOString().replace(/[:.]/g,"-");
  const rand  = Math.random().toString(36).substr(2,5);
  return id + "_" + tag + "_" + stamp + "_" + rand + ".json";
}
function postToDataPipe(filename, dataObj) {
  /* Hard block. A dev run must never reach the real OSF component. Note this
     means the upload path itself goes untested in dev — if you need to
     exercise it, point CONFIG.OSF_EXPERIMENT_ID at a separate test component
     rather than removing this guard. */
  if (DEV.active) {
    console.warn("[DEV] upload suppressed:", filename, dataObj);
    return Promise.resolve({ ok:true, status:0, body:{ dev_suppressed:true } });
  }
  return fetch("https://pipe.jspsych.org/api/data/", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Accept":"*/*" },
    body: JSON.stringify({ experimentID: CONFIG.OSF_EXPERIMENT_ID, filename, data: JSON.stringify(dataObj) })
  }).then(async resp => {
    let body = null; try { body = await resp.json(); } catch (e) { body = await resp.text(); }
    return { ok: resp.ok && !(body && body.error), status: resp.status, body };
  });
}
function sanitiseCaseForUpload(caseData) {
  /* Deep-copy the case object and strip any runtime-only mutation fields
     that must not appear in the OSF dataset. Currently: _flashed (set by
     the RTA click-replay animation) and _gaze_raw (large, not de-identified
     until explicitly deleted after transcription — but should never reach
     here; included as a safety guard). */
  const c = JSON.parse(JSON.stringify(caseData));
  (c.click_events || []).forEach(ev => { delete ev._flashed; });
  delete c._gaze_raw;
  return c;
}

function uploadCaseInBackground(caseId) {
  const payload = {
    participant_code: study.participant_code,
    sub_id_from_url: study.sub_id_from_url,
    experimental_condition: study.experimental_condition,
    randomization_method: study.randomization_method,
    unlinked_session: study.unlinked_session,
    calibration: study.calibration,
    screen_geometry: study.screen_geometry,
    calibration_viewport: study.calibration_viewport,
    browser_check: study.browser_check,
    case_id: caseId, partial: true,
    "case": sanitiseCaseForUpload(study.cases[caseId] || {}),
    started_at: study.started_at,
    saved_at: new Date().toISOString()
  };
  return postToDataPipe(uniqueName("case"+caseId), payload)
    .catch(e => { console.error("Per-case OSF save (case "+caseId+") failed:", e); return null; });
}

/* =====================================================================
   jsPsych + final OSF save
   ===================================================================== */
var jsPsych = initJsPsych({
  extensions: [{ type: jsPsychExtensionWebgazer }],
  on_finish: async function () {
    document.body.innerHTML = `<div style="text-align:center;margin-top:18%;color:#1d2a38;">
      <h3>Saving de-identified session data...</h3><p>No audio or video is uploaded.</p></div>`;
    const payload = {
      participant_code: study.participant_code,
      sub_id_from_url: study.sub_id_from_url,
      experimental_condition: study.experimental_condition,
      randomization_method: study.randomization_method,
    unlinked_session: study.unlinked_session,
      calibration: study.calibration,
      screen_geometry: study.screen_geometry,
    calibration_viewport: study.calibration_viewport,
    browser_check: study.browser_check,
      cases: Object.fromEntries(
        Object.entries(study.cases).map(([k, v]) => [k, sanitiseCaseForUpload(v)])
      ),
      partial: false,
      user_agent: study.user_agent,
      started_at: study.started_at,
      finished_at: new Date().toISOString()
    };
    try {
      const r = await postToDataPipe(uniqueName("full"), payload);
      if (r.ok) {
        document.body.innerHTML = `<div style="text-align:center;margin-top:18%;color:#1e8e4e;"><h3>Sync complete. You may close this tab.</h3></div>`;
      } else {
        document.body.innerHTML = `<div style="text-align:center;margin-top:14%;color:#c0392b;max-width:680px;margin-left:auto;margin-right:auto;">
          <h3>OSF save was rejected.</h3><p>Status: ${r.status}</p>
          <p style="font-family:monospace;font-size:13px;background:#d3e4f5;color:#16263d;padding:10px;border-radius:6px;">${JSON.stringify(r.body)}</p>
          <p>Open the console for details, then notify the researcher.</p></div>`;
      }
    } catch (e) {
      document.body.innerHTML = `<div style="text-align:center;margin-top:18%;color:#c0392b;"><h3>Cloud sync failed: ${e.message}</h3><p>Please notify the researcher.</p></div>`;
    }
  }
});

var timeline = [];

/* DEV flags are parsed from the URL before the timeline is built, so gating is
   a plain build-time decision — no conditional_function needed. */
function pushUnless(flag, node) { if (!DEV.skip(flag)) timeline.push(node); }

study.dev_mode   = DEV.active;
study.dev_params = DEV.raw;

/* =====================================================================
   BROWSER CHECK (window size + metadata)
   Requires the v7-compatible browser-check plugin: version 1.0.3
   (js/plugin-browser-check.js). Do NOT use 2.x — that is the v8 build and
   calls jsPsych APIs renamed in v8 (abortExperiment), which will break on
   this v7 core. The parameters used below (minimum_width/height,
   allow_window_resize, inclusion_function) and the data fields are identical
   across 1.0.3 and 2.x, so only the downloaded file version matters.

   The hard browser/capability gate already ran above (checkBrowser).
   This plugin trial is used for two complementary jobs the native gate
   does NOT do:
     1. Enforce a minimum window size with an interactive resize prompt —
        the BioWorld layout (280px left panel + content + AOIs) needs room;
        a cramped window degrades gaze-to-AOI validity.
     2. Log browser/OS/refresh-rate/device metadata into the dataset for
        reporting and for diagnosing any per-participant anomalies.

   inclusion_function is intentionally permissive for BROWSER (the native
   capability gate already decided that). It only blocks if the participant
   refuses/can't reach the minimum window size. Browser NAME is not used to
   exclude here, so Edge/Brave/Arc/etc. are not wrongly rejected.
   ===================================================================== */
timeline.push({
  type: jsPsychBrowserCheck,
  minimum_width: 1000,
  /* Raised from 600. AOI height scales with viewport, and at 600px the
     evidence table renders ~184px tall — inside WebGazer's error band, so it
     stops being separable from its neighbours. 700 keeps every AOI above the
     band without excluding 1366x768 laptops. Per-participant adequacy is
     still checked empirically in gazeQualityMetrics(). */
  minimum_height: 700,
  allow_window_resize: true,
  inclusion_function: () => true,   // browser gating handled by native checkBrowser()
  on_finish: function(data) {
    study.browser_check = {
      browser:         data.browser,
      browser_version: data.browser_version,
      os:              data.os,
      mobile:          data.mobile,
      width:           data.width,
      height:          data.height,
      webaudio:        data.webaudio,
      fullscreen:      data.fullscreen,
      vsync_rate:      data.vsync_rate,
      webcam:          data.webcam,
      microphone:      data.microphone
    };
  }
});

/* =====================================================================
   BLOCK RANDOMIZATION
   Randomly permuted blocks (sizes 2 and 4, mixed at random) ensure
   balanced group sizes even with small samples. The sequence is
   pre-generated with a fixed seed (documented in the methods) and
   indexed by the participant's sub_id from Qualtrics, which is a
   sequential integer assigned before redirect.

   Methodological basis:
     Schulz & Grimes (2002). Unequal group sizes in randomised trials:
       guarding against guessing. Lancet, 359(9310), 966–970.
     Efird (2011). Blocked randomization with randomly selected block
       sizes. International Journal of Environmental Research and
       Public Health, 8(1), 15–20.

   If sub_id is absent (direct testing) or FORCE_CONDITION is set,
   falls back to simple randomization so testing is never blocked.
   ===================================================================== */
const BLOCK_SEQ = ["control", "dashboard", "control", "dashboard", "dashboard", "control", "control", "dashboard", "control", "dashboard", "control", "dashboard", "control", "dashboard", "control", "dashboard", "dashboard", "dashboard", "control", "control", "control", "dashboard", "control", "dashboard", "control", "dashboard", "dashboard", "control", "control", "dashboard", "control", "dashboard", "control", "dashboard", "control", "control", "dashboard", "dashboard", "dashboard", "control", "dashboard", "control", "control", "dashboard", "dashboard", "control", "control", "dashboard", "control", "dashboard", "control", "dashboard", "dashboard", "control", "control", "dashboard", "dashboard", "control", "dashboard", "control", "dashboard", "control", "control", "dashboard", "control", "dashboard", "dashboard", "dashboard", "control", "control", "control", "dashboard", "control", "dashboard", "dashboard", "dashboard", "control", "control", "dashboard", "control", "dashboard", "control", "dashboard", "control", "dashboard", "control", "control", "dashboard", "dashboard", "control", "dashboard", "control", "dashboard", "control", "dashboard", "control", "control", "dashboard", "control", "dashboard", "dashboard", "control", "dashboard", "control", "dashboard", "control", "dashboard", "control", "control", "dashboard", "control", "control", "dashboard", "dashboard", "dashboard", "dashboard", "control", "control", "control", "dashboard", "dashboard", "control", "dashboard", "control", "dashboard", "control", "control", "dashboard", "control", "dashboard", "dashboard", "control", "control", "control", "dashboard", "dashboard", "control", "dashboard", "dashboard", "control", "control", "dashboard", "dashboard", "control", "dashboard", "control", "control", "dashboard", "dashboard", "control", "dashboard", "control", "dashboard", "control", "control", "dashboard", "dashboard", "control", "control", "dashboard", "control", "control", "dashboard", "dashboard", "control", "dashboard", "control", "dashboard", "control", "dashboard", "dashboard", "control", "control", "dashboard", "control", "dashboard", "dashboard", "control", "dashboard", "dashboard", "control", "control", "control", "dashboard", "dashboard", "control", "dashboard", "dashboard", "control", "control", "control", "dashboard", "dashboard", "control", "control", "dashboard", "control", "dashboard", "dashboard", "control"];

(function assignCondition() {
  if (DEV.cond === "dashboard" || DEV.cond === "control") {
    study.experimental_condition = DEV.cond;
    study.randomization_method   = "dev_override";
    return;
  }
  if (CONFIG.FORCE_CONDITION) {
    study.experimental_condition = CONFIG.FORCE_CONDITION;
    study.randomization_method   = "forced";
    return;
  }
  const sub = parseInt(study.sub_id_from_url, 10);
  if (!isNaN(sub) && sub >= 0 && sub < BLOCK_SEQ.length) {
    study.experimental_condition = BLOCK_SEQ[sub];
    study.randomization_method   = "block_seq_idx_" + sub;
  } else {
    /* Fallback: simple randomization (used during direct testing) */
    study.experimental_condition = jsPsych.randomization
      .sampleWithoutReplacement(["dashboard","control"], 1)[0];
    study.randomization_method   = "simple_fallback";
    /* A null/invalid sub_id means this session cannot be linked back to the
       Qualtrics consent record or to a Phase-3 retest. Expected during manual
       testing; a data-integrity problem if it happens in real collection.
       Flag it explicitly so such sessions are filterable in analysis, and warn
       in the console so the researcher notices during pilot runs. */
    study.unlinked_session = true;
    console.warn("No valid sub_id in URL — session is UNLINKED (not tied to Qualtrics). " +
                 "This is fine for testing but should not occur for enrolled participants.");
  }
})();

/* =====================================================================
   SELF-GENERATED CODE
   ===================================================================== */
timeline.push({
  timeline: [{
    type: jsPsychSurveyText,
    preamble: `<div style="max-width:640px;margin:auto;text-align:left;color:#1d2a38;">
        <h3>Create your anonymous study code</h3>
        <p>Links your data across phases without your name. Answer the same way each time.</p></div>`,
    questions: [
      { prompt:"First TWO letters of the street you grew up on:", required:true, name:"street" },
      { prompt:"First TWO letters of your first pet's name:", required:true, name:"pet" },
      { prompt:"Two-digit birth month (e.g., 03):", required:true, name:"month" }
    ],
    on_finish: d => { study.participant_code = (d.response.street + d.response.pet + d.response.month).toUpperCase().replace(/\s+/g,""); }
  }],
  conditional_function: () => !study.sub_id_from_url
});

/* =====================================================================
   CALIBRATION
   ===================================================================== */
timeline.push({
  type: jsPsychInitializeMicrophone,
  error_message:"<p>Microphone access is required.</p>",
  on_finish: function(data) {
    /* Persist the device the participant chose here so every RTA trial can
       reopen the SAME microphone. Without this, each RTA fell back to the OS
       default input (often the internal mic) regardless of what was picked. */
    if (data && data.device_id) {
      study.mic_device_id = data.device_id;
    }
  }
});
pushUnless("webcam", {
  type: jsPsychWebgazerInitCamera,
  instructions:"<p>Center your face in the webcam window. Sit ~50cm away, ensure even lighting, and keep your head still during the study.</p>",
  button_text:"Continue",
  on_load: function() {
    warmUpTranscriber();
    try {
      webgazer.applyKalmanFilter(true);
      /* weightedRidge gives more recent training samples higher influence,
         which makes implicit recalibration during the task take effect
         quickly rather than being diluted by old calibration data. */
      webgazer.setRegression("weightedRidge");
    } catch(e) {}
  }
});

/* =====================================================================
   VIRTUAL CHINREST  (Li, Joo, Yeatman, & Reinecke, 2020)
   Measures each participant's physical screen scale (px-to-mm) and
   viewing distance via a credit-card resize + blind-spot task. This
   converts gaze error from pixels — meaningless across the heterogeneous

/* Calibration: single pass — calibrate once, validate once, proceed regardless.
   Accuracy is recorded in study.calibration for analytical exclusion in R.
   No retry loops, no alert dialogs — participant frustration and dropout
   are a greater threat to sample size than imperfect gaze data on some participants.

   Note: a 1500ms stabilisation pause is inserted between calibration_grid and
   validation_instructions. Without it, the weightedRidge regression model may
   not have produced stable predictions yet when validation begins, causing
   percent_in_roi to return null even when tracking is working. */

/* Offset-based fallback quality scorer — used when percent_in_roi is null.
   Computes a synthetic score from the mean offset radius relative to the ROI. */
function gazeQualityFromOffsets(offsets, roiRadius) {
  if (!offsets || !offsets.length) return { pct: null, quality: "unknown" };
  const mean = offsets.reduce((s, o) => s + (o.r || 0), 0) / offsets.length;
  /* Proportion of mean offset within ROI, clamped 0–100 */
  const syntheticPct = Math.max(0, Math.min(100, Math.round((1 - mean / roiRadius) * 100)));
  const quality = syntheticPct >= 75 ? "good" : syntheticPct >= 55 ? "acceptable" : "poor";
  return { pct: syntheticPct, quality };
}

/* 1500ms stabilisation pause — inserted between calibration_grid and
   validation so the weightedRidge model has time to converge. */

};

    show_validation_data: false,
    on_finish: function(data) {
      const pct = data.percent_in_roi;
      const offsets = data.average_offset;
      /* Use offset-based fallback when percent_in_roi is null */
      const scored = (pct != null)
        ? { pct: Math.round(pct), quality: pct >= 75 ? "good" : pct >= 55 ? "acceptable" : "poor" }
        : gazeQualityFromOffsets(offsets, 150);

      /* ── Convert pixel error to degrees of visual angle ──
         Pixel error is not comparable across the heterogeneous monitors in a
         remote cluster sample. The virtual chinrest (Li et al., 2020) gives us
         px2deg per participant, letting us express gaze error in degrees — the
         metric the WebGazer paper (Papoutsaki et al., 2016) reports (their
         best webcam accuracy was ~4.17° vs a commercial tracker). This is the
         defensible basis for a pre-registered gaze-quality exclusion rule.

         pixels / px2deg (NOT pixels * px2deg). Verified against the same data:
         win_width_deg * px2deg ≈ viewport width in px, which only holds if
         px2deg is pixels-per-degree. */
      const px2deg = (study.screen_geometry && study.screen_geometry.px2deg) || null;
      let meanOffsetPx = null, meanOffsetDeg = null;
      if (offsets && offsets.length) {
        meanOffsetPx = offsets.reduce((s, o) => s + (o.r || 0), 0) / offsets.length;
        if (px2deg != null && px2deg > 0) meanOffsetDeg = +(meanOffsetPx / px2deg).toFixed(3);
      }

      study.calibration = {
        calibration_pct:      scored.pct,
        calibration_pct_raw:  pct,          // preserve raw value (may be null)
        average_offset:       offsets,
        roi_radius_used:      150,
        gaze_quality:         scored.quality,
        score_method:         pct != null ? "percent_in_roi" : "offset_fallback",
        /* Visual-angle accuracy — the cross-device-comparable metric. */
        mean_offset_px:       meanOffsetPx != null ? Math.round(meanOffsetPx) : null,
        mean_offset_deg:      meanOffsetDeg,           // null if chinrest was skipped/blocked
        px2deg_used:          px2deg,
        view_dist_mm:         (study.screen_geometry && study.screen_geometry.view_dist_mm) || null
      };
    }
  }]
});
