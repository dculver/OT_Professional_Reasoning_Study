  <!-- Whisper transcription via inline Blob Worker (no external file needed, no CORS issues) -->
  <script>
    let __whisperWorker   = null;
    let __workerReady     = false;
    let __modelProgress   = 0;
    let __pendingResolve  = null;
    let __pendingReject   = null;

    /* The entire worker code as a string — avoids file-serving and MIME-type issues.
       Uses importScripts with the UMD/classic build which works in classic workers. */
    const WORKER_CODE = `
      let transcriber = null;

      async function loadModel() {
        if (transcriber) return;
        const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
        env.allowLocalModels = false;
        env.useBrowserCache  = true;
        transcriber = await pipeline(
          "automatic-speech-recognition",
          "Xenova/whisper-small.en",
          {
            progress_callback: (p) => {
              if (p && p.progress != null)
                self.postMessage({ type:"progress", progress: Math.round(p.progress) });
            }
          }
        );
      }

      self.onmessage = async (e) => {
        const { type, audioData } = e.data;
        if (type === "warmup") {
          try { await loadModel(); self.postMessage({ type:"ready" }); }
          catch(err) { self.postMessage({ type:"error", message: String(err) }); }
          return;
        }
        if (type === "transcribe") {
          try {
            await loadModel();
            const result = await transcriber(audioData, {
              return_timestamps: true, chunk_length_s: 30, stride_length_s: 5
            });
            self.postMessage({ type:"result", text: result.text||"", chunks: Array.isArray(result.chunks)?result.chunks:[] });
          } catch(err) {
            self.postMessage({ type:"error", message: String(err) });
          }
          return;
        }
      };
    `;

    function initWhisperWorker() {
      if (__whisperWorker) return;
      /* Create worker from Blob — same-origin, no file needed, no MIME issues */
      const blob = new Blob([WORKER_CODE], { type:"application/javascript" });
      const url  = URL.createObjectURL(blob);
      __whisperWorker = new Worker(url, { type:"module" });

      __whisperWorker.onmessage = (e) => {
        const { type, progress, text, chunks, message } = e.data;
        if (type === "progress") {
          __modelProgress = progress;
        } else if (type === "ready") {
          __workerReady = true;
        } else if (type === "result") {
          if (__pendingResolve) { __pendingResolve({ text, chunks }); __pendingResolve = null; __pendingReject = null; }
        } else if (type === "error") {
          console.error("Whisper worker error:", message);
          if (__pendingReject) { __pendingReject(new Error(message)); __pendingResolve = null; __pendingReject = null; }
        }
      };
      __whisperWorker.onerror = (e) => {
        console.error("Whisper worker onerror:", e);
        if (__pendingReject) { __pendingReject(new Error("Worker error")); __pendingResolve = null; __pendingReject = null; }
      };
      __whisperWorker.postMessage({ type:"warmup" });
    }

    function warmUpTranscriber() { initWhisperWorker(); }

    async function transcribeBlob(blob) {
      try {
        initWhisperWorker();
        const ab = await blob.arrayBuffer();

        /* Decode at the native sample rate first — forcing 16kHz on the AudioContext
           causes decodeAudioData to time-compress the audio on some Chrome/macOS builds,
           which produces garbled input and Whisper hallucinations ("you you you you").
           We decode natively then resample manually to the 16kHz Whisper expects. */
        const nativeCtx = new (window.AudioContext || window.webkitAudioContext)();
        const nativeBuf = await nativeCtx.decodeAudioData(ab);
        nativeCtx.close();

        let audioData;
        if (nativeBuf.sampleRate === 16000) {
          audioData = nativeBuf.getChannelData(0);
        } else {
          /* Offline resample to 16kHz */
          const offlineCtx = new OfflineAudioContext(
            1,
            Math.ceil(nativeBuf.duration * 16000),
            16000
          );
          const src = offlineCtx.createBufferSource();
          src.buffer = nativeBuf;
          src.connect(offlineCtx.destination);
          src.start(0);
          const resampled = await offlineCtx.startRendering();
          audioData = resampled.getChannelData(0);
        }

        /* Normalize amplitude — if the recording is very quiet (peak < 0.1),
           scale it up so Whisper receives a usable signal rather than
           near-silence which causes hallucinations like "you you you". */
        const peak = audioData.reduce((m, v) => Math.max(m, Math.abs(v)), 0);
        if (peak > 0 && peak < 0.1) {
          const scale = Math.min(0.95 / peak, 10);  // cap at 10× to avoid amplifying pure noise
          const normalized = new Float32Array(audioData.length);
          for (let i = 0; i < audioData.length; i++) normalized[i] = audioData[i] * scale;
          audioData = normalized;
        } else if (peak === 0) {
          /* Completely silent — return empty result rather than hallucinating */
          return { text: "", chunks: [] };
        }

        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            __pendingResolve = null; __pendingReject = null;
            resolve({ text:"[transcription timeout]", chunks:[] });
          }, 120000);

          __pendingResolve = (result) => { clearTimeout(timeout); resolve(result); };
          __pendingReject  = (err)    => { clearTimeout(timeout); reject(err); };

          __whisperWorker.postMessage({ type:"transcribe", audioData }, [audioData.buffer]);
        });
      } catch(e) {
        console.error("transcribeBlob error:", e);
        return { text:"[transcription error: " + e.message + "]", chunks:[] };
      }
    }
  </script>

  <style>
    /* Screen-reader-only utility — visually hidden but available to AT */
    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    /* ── jsPsych global overrides ── */
    .jspsych-display-element, .jspsych-content { color:#dbe6f0; }
    /* jsPsych centers stimulus content by default — override for the BioWorld interface */
    .jspsych-display-element { text-align:left; }
    .jspsych-content h1,.jspsych-content h2,.jspsych-content h3,
    .jspsych-content h4,.jspsych-content p,.jspsych-content label,
    .jspsych-content span,.jspsych-survey-text-question label { color:#dbe6f0; }
    .jspsych-content input[type="text"],.jspsych-content textarea,
    .jspsych-content select { color:#16263d; background:#ffffff; }
    .jspsych-btn { color:#16263d; background:#e8eef5; border:1px solid #b8c6d6; }
    .jspsych-btn:hover { background:#ffffff; }

    /* ── Calibration dots ── */
    .jspsych-webgazer-calibrate-point,.jspsych-webgazer-validate-point,
    .calibration-point,.validation-point,
    div[id^="calibration-point"],div[id^="validation-point"],#webgazerGazeDot {
      background-color:#ffd400 !important;
      border:2px solid #16263d !important;
      box-shadow:0 0 8px 2px rgba(255,212,0,0.8) !important;
      opacity:1 !important;
      transition: top 80ms linear, left 80ms linear !important;
    }

    /* ================================================================
       BIOWORLD INTERFACE STYLES
       ================================================================ */
    * { box-sizing:border-box; }

    .bw-root {
      width:100vw; height:100vh; display:flex; flex-direction:column;
      background:#1a2332; color:#e8edf3;
      font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden;
    }

    /* Top nav */
    .bw-topbar {
      background:#0f1923; border-bottom:1px solid #2a3a4a;
      padding:0 16px; height:48px; display:flex; align-items:center; gap:0; flex-shrink:0;
    }
    .bw-tab {
      height:48px; padding:0 20px; background:transparent; border:none;
      border-bottom:3px solid transparent; color:#7a8fa0;
      font-size:13px; font-weight:500; cursor:pointer;
      letter-spacing:.04em; text-transform:uppercase;
      transition:color .15s,border-color .15s;
    }
    .bw-tab:hover { color:#c8d8e8; }
    .bw-tab.active { color:#5ab0f0; border-bottom-color:#5ab0f0; }
    .bw-patient-label { margin-left:auto; font-size:12px; color:#8aaabb; letter-spacing:.06em; }

    /* Main layout */
    .bw-main { display:flex; flex:1; overflow:hidden; }

    /* Left panel */
    .bw-left {
      width:280px; flex-shrink:0; background:#141e2b;
      border-right:1px solid #2a3a4a; display:flex; flex-direction:column; overflow:hidden;
    }
    .bw-panel-section { border-bottom:1px solid #2a3a4a; padding:12px 14px; }
    .bw-panel-label {
      font-size:11px; font-weight:600; letter-spacing:.1em;
      text-transform:uppercase; color:#7a9ab0; margin-bottom:8px;
    }

    /* Hypothesis manager */
    .bw-hyp-list { display:flex; flex-direction:column; gap:6px; }
    .bw-hyp-row {
      display:flex; align-items:center; gap:8px;
      background:#1e2d3d; border:1px solid #2a3a4a;
      border-radius:6px; padding:7px 10px;
    }
    .bw-hyp-name { flex:1; font-size:13px; color:#c8d8e8; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bw-hyp-rm { width:24px; height:24px; background:transparent; border:none; color:#7a9ab0; cursor:pointer; font-size:16px; line-height:1; padding:0; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .bw-hyp-rm:hover { color:#e05a5a; }
    .bw-hyp-input-row { display:flex; gap:6px; margin-top:8px; }
    .bw-hyp-input {
      flex:1; background:#1e2d3d; border:1px solid #2a3a4a; border-radius:5px;
      color:#c8d8e8; font-size:12px; padding:5px 8px;
    }
    .bw-hyp-input::placeholder { color:#4a6070; }
    .bw-hyp-input:focus { border-color:#5ab0f0; }
    .bw-hyp-add {
      background:#1e4a6e; border:1px solid #2a6090; border-radius:5px;
      color:#5ab0f0; font-size:12px; padding:5px 10px; cursor:pointer;
    }
    .bw-hyp-add:hover { background:#2a5a80; }

    /* Belief meter */
    .bw-belief-select {
      width:100%; background:#1e2d3d; border:1px solid #2a3a4a; border-radius:5px;
      color:#c8d8e8; font-size:12px; padding:5px 8px; margin-bottom:10px;
    }
    .bw-belief-select:focus { border-color:#5ab0f0; }
    .bw-belief-slider {
      width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
      background:linear-gradient(to right,#e05a5a 0%,#e0a040 35%,#4a9a60 60%,#5ab0f0 100%);
    }
    .bw-belief-slider::-webkit-slider-thumb {
      -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
      background:#c8d8e8; cursor:pointer; border:2px solid #1a2332;
    }
    .bw-belief-labels { display:flex; justify-content:space-between; margin-top:4px; }
    .bw-belief-labels span { font-size:11px; color:#7a9ab0; }
    .bw-belief-value { text-align:center; font-size:12px; color:#5ab0f0; margin-top:4px; font-weight:500; }

    /* Evidence table */
    .bw-evidence-section { flex:1; overflow-y:auto; padding:12px 14px; min-height:0; }
    .bw-ev-list { display:flex; flex-direction:column; gap:5px; }
    .bw-ev-item {
      background:#1e2d3d; border:1px solid #2a3a4a; border-left:3px solid #4a9a60;
      border-radius:5px; padding:6px 10px; font-size:12px; color:#a0b8c8;
      display:flex; align-items:flex-start; gap:8px;
    }
    .bw-ev-tag {
      flex-shrink:0; font-size:10px; padding:1px 5px; border-radius:3px;
      font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-top:1px;
    }
    .tag-patient { background:#1e3d5a; color:#8acfff; }
    .tag-assess  { background:#2a3a1a; color:#a0d060; }
    .tag-obs     { background:#3a2a1a; color:#f0c060; }
    .bw-ev-rm { margin-left:auto; background:transparent; border:none; color:#7a9ab0; cursor:pointer; font-size:14px; line-height:1; flex-shrink:0; min-width:24px; min-height:24px; display:flex; align-items:center; justify-content:center; }
    .bw-ev-rm:hover { color:#e05a5a; }
    .bw-ev-empty { font-size:12px; color:#7a9ab0; font-style:italic; padding:8px 0; }

    /* Content area */
    .bw-content { flex:1; overflow-y:auto; padding:24px 28px; min-width:0; text-align:left; }
    .bw-panel { display:none; }
    .bw-panel.active { display:block; }
    /* hidden attribute on tabpanels is managed by JS; .active overrides it */
    .bw-panel[hidden].active { display:block; }

    /* Patient header */
    .bw-patient-header {
      display:flex; align-items:flex-start; gap:20px;
      margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid #2a3a4a;
    }
    .bw-avatar {
      width:56px; height:56px; border-radius:50%; background:#1e3d5a;
      border:2px solid #2a5070; display:flex; align-items:center;
      justify-content:center; font-size:20px; font-weight:600; color:#5ab0f0; flex-shrink:0;
    }
    .bw-patient-meta h2 { font-size:18px; font-weight:600; color:#e8edf3; margin-bottom:4px; }
    .bw-meta-row { display:flex; gap:16px; flex-wrap:wrap; }
    .bw-meta-chip { font-size:12px; color:#7a9ab0; display:flex; align-items:center; gap:4px; }
    .bw-meta-chip strong { color:#c8d8e8; }

    .bw-section-heading {
      font-size:11px; font-weight:600; letter-spacing:.08em;
      text-transform:uppercase; color:#7a9ab0; margin:20px 0 10px;
    }
    .bw-narrative { font-size:14px; line-height:1.75; color:#b8ccd8; text-align:left; }
    .bw-narrative p { margin-bottom:12px; text-align:left; }

    /* Paragraph evidence — free-text highlight model */
    .bw-ev-para {
      position:relative; padding:10px 12px; border:1px solid transparent;
      border-radius:6px; margin-bottom:10px; transition:border-color .15s,background .15s;
      user-select:text; -webkit-user-select:text;
    }
    .bw-ev-para p { margin:0; }
    .bw-ev-para.para-added { border-color:#2a6a3a; background:#1a2d1e; }

    /* Floating selection popover */
    #bw-sel-popover {
      position:fixed; z-index:9999;
      background:#1e4a2a; border:1px solid #3a8050; border-radius:6px;
      padding:5px 10px; display:flex; align-items:center; gap:8px;
      box-shadow:0 4px 16px rgba(0,0,0,.5); pointer-events:auto;
      animation:bw-pop-in .1s ease;
    }
    @keyframes bw-pop-in { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    #bw-sel-popover button {
      background:#2a6a3a; border:1px solid #3a8a50; border-radius:4px;
      color:#a0e8b0; font-size:11px; font-weight:600; padding:4px 10px; cursor:pointer;
      white-space:nowrap;
    }
    #bw-sel-popover button:hover { background:#3a7a48; color:#9ae0a8; }
    #bw-sel-popover .bw-sel-dismiss {
      background:transparent; border:none; color:#4a6070; font-size:16px;
      line-height:1; padding:0 2px; cursor:pointer;
    }
    #bw-sel-popover .bw-sel-dismiss:hover { color:#e05a5a; }

    /* Assessment grid */
    .bw-assess-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:4px; }
    .bw-assess-card {
      background:#1e2d3d; border:1px solid #2a3a4a; border-radius:8px;
      padding:14px; cursor:pointer; transition:border-color .15s,background .15s; position:relative;
    }
    .bw-assess-card:hover { border-color:#3a5a70; background:#1e3040; }
    .bw-assess-card.ordered { border-color:#2a6a3a; background:#1a2d1e; }
    .bw-assess-card.ordered::after { content:'✓ Ordered'; position:absolute; top:8px; right:10px; font-size:10px; color:#5ac070; font-weight:600; }
    .bw-assess-name { font-size:13px; font-weight:600; color:#c8d8e8; margin-bottom:4px; }
    .bw-assess-desc { font-size:12px; color:#8aaabb; line-height:1.5; }
    .bw-result-area { margin-top:20px; display:none; }
    .bw-result-area.visible { display:block; }
    .bw-result-card { background:#1a2d1e; border:1px solid #2a4a2a; border-radius:8px; padding:16px; margin-bottom:10px; }
    .bw-result-title { font-size:13px; font-weight:600; color:#5ac070; margin-bottom:8px; }
    .bw-result-body { font-size:13px; color:#a0b8a0; line-height:1.6; }
    .bw-result-send { margin-top:8px; background:#1e4a2a; border:1px solid #2a6a3a; color:#5ac070; font-size:11px; padding:4px 10px; border-radius:4px; cursor:pointer; }
    .bw-result-send:hover { background:#2a5a3a; }

    /* Library */
    .bw-lib-entry { background:#1e2d3d; border:1px solid #2a3a4a; border-radius:8px; padding:14px; margin-bottom:10px; }
    .bw-lib-entry h4 { font-size:13px; font-weight:600; color:#c8d8e8; margin-bottom:6px; }
    .bw-lib-entry p { font-size:12px; color:#8aaabb; line-height:1.5; }
    .bw-lib-send { margin-top:8px; background:#1e3d5a; border:1px solid #2a5070; color:#5ab0f0; font-size:11px; padding:3px 10px; border-radius:4px; cursor:pointer; }
    .bw-lib-send:hover { background:#2a5080; }

    /* Plan options */
    .bw-plan-options { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
    .bw-plan-option {
      display:flex; align-items:flex-start; gap:10px; background:#1e2d3d;
      border:1px solid #2a3a4a; border-radius:6px; padding:10px 12px;
      cursor:pointer; transition:border-color .15s;
    }
    .bw-plan-option:hover { border-color:#3a5a70; }
    .bw-plan-option input { margin-top:2px; flex-shrink:0; accent-color:#5ab0f0; }
    .bw-plan-option-name { font-size:13px; font-weight:600; color:#c8d8e8; }
    .bw-plan-option-rationale { font-size:12px; color:#8aaabb; margin-top:3px; line-height:1.4; }
    .bw-summary-input {
      width:100%; min-height:120px; background:#1e2d3d; border:1px solid #2a3a4a;
      border-radius:6px; color:#c8d8e8; font-size:13px; padding:10px 12px;
      resize:vertical; line-height:1.6; font-family:inherit;
    }
    .bw-summary-input:focus { border-color:#5ab0f0; }
    .bw-summary-input::placeholder { color:#4a6070; }

    /* Bottom bar */
    .bw-bottom {
      background:#0f1923; border-top:1px solid #2a3a4a;
      padding:10px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0;
    }
    .bw-elapsed { font-size:11px; color:#6a8a9a; margin-right:auto; font-family:monospace; }
    .bw-btn {
      padding:7px 16px; border-radius:5px; font-size:13px;
      font-weight:500; cursor:pointer; border:1px solid;
    }
    .bw-btn-secondary { background:transparent; border-color:#2a3a4a; color:#7a9ab0; }
    .bw-btn-secondary:hover { border-color:#3a5a70; color:#c8d8e8; }
    .bw-btn-submit {
      background:#1e4a2a; border-color:#2a6a3a; color:#5ac070;
      padding:9px 22px; font-size:14px; font-weight:600;
    }
    .bw-btn-submit:hover:not(:disabled) { background:#2a5a3a; }
    .bw-btn-submit:disabled {
      background:transparent; border-color:#2a3a4a; color:#3a5060;
      cursor:not-allowed; opacity:1;
    }
    @keyframes bw-submit-pulse {
      0%   { box-shadow:0 0 0 0 rgba(90,192,112,0.7); }
      60%  { box-shadow:0 0 0 10px rgba(90,192,112,0); }
      100% { box-shadow:0 0 0 0 rgba(90,192,112,0); }
    }
    .bw-btn-submit.unlocked { animation:bw-submit-pulse 0.8s ease-out 1; }
    .bw-submit-hint {
      font-size:11px; color:#7a9ab0; margin-right:8px; font-style:italic;
    }
    .bw-submit-hint.ready { color:#5ac070; font-style:normal; font-weight:500; }
    .bw-tab-final::after { content:" ★"; color:#5ac070; font-size:10px; }

    /* ── On-screen instruction banner ── */
    .bw-instructions {
      background:#0d2035; border:1px solid #2a5a7a; border-radius:8px;
      padding:14px 16px; margin-bottom:20px; font-size:13px; line-height:1.7;
      color:#b8ccd8; position:relative;
    }
    .bw-instructions h4 {
      margin:0 0 10px; font-size:13px; color:#5ab0f0; font-weight:600;
      letter-spacing:.04em; text-transform:uppercase;
    }
    .bw-instructions ul { margin:0; padding-left:18px; }
    .bw-instructions li { margin-bottom:4px; }
    .bw-instructions li strong { color:#c8d8e8; }
    .bw-instructions-dismiss {
      position:absolute; top:10px; right:12px;
      background:transparent; border:none; color:#4a6070;
      font-size:18px; line-height:1; cursor:pointer; padding:2px 4px;
    }
    .bw-instructions-dismiss:hover { color:#5ab0f0; }

    /* ── Focus indicators (WCAG 2.4.7, 2.4.11) ──
       Using :focus-visible so keyboard users get clear indicators
       without affecting mouse users.  outline:none is removed from
       inputs/selects/textarea in favour of a visible ring. */
    .bw-tab:focus-visible,
    .bw-hyp-add:focus-visible,
    .bw-hyp-rm:focus-visible,
    .bw-ev-rm:focus-visible,
    .bw-btn:focus-visible,
    .bw-lib-send:focus-visible,
    .bw-result-send:focus-visible,
    .bw-assess-card:focus-visible,
    #bw-sel-popover button:focus-visible {
      outline:3px solid #5ab0f0;
      outline-offset:2px;
    }
    .bw-hyp-input:focus-visible,
    .bw-belief-select:focus-visible,
    .bw-summary-input:focus-visible,
    .bw-belief-slider:focus-visible {
      outline:3px solid #5ab0f0;
      outline-offset:1px;
      border-color:#5ab0f0;
    }

(function checkBrowser() {
  const ua        = navigator.userAgent;
  const isMobile  = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  const isFirefox = /Firefox\//.test(ua);
  const isSafari  = /Safari\//.test(ua) && !/Chrome\//.test(ua);

  if (isMobile || isFirefox || isSafari) {
    const reason = isMobile
      ? "mobile browsers"
      : isFirefox
        ? "Firefox (tab-level screen recording is not supported)"
        : "Safari (the required audio/video format is not supported)";
    document.body.style.background = "#0f1923";
    document.body.innerHTML = `

})();

/* =====================================================================

   ===================================================================== */
function pickVideoMime() {
  for (const c of ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  return "";
}
async function startScreenRecording(id) {
  const stream = await navigator.mediaDevices.getDisplayMedia({
    video: { frameRate: CONFIG.SCREEN_FPS },
    audio: false,
    // Chrome/Edge 94+: pre-selects this tab in the share picker
    preferCurrentTab: true,
    selfBrowserSurface: "include"
  });
  const mime = pickVideoMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  caseMedia[id] = { stream, recorder:rec, chunks, blob:null, url:null };
  rec.start(1000);
  return stream;
}
function stopScreenRecording(id) {
  return new Promise(res => {
    const m = caseMedia[id];
    if (!m || !m.recorder || m.recorder.state === "inactive") return res();
    m.recorder.onstop = () => {
      m.blob = new Blob(m.chunks, { type:m.recorder.mimeType || "video/webm" });
      m.url = URL.createObjectURL(m.blob);
      m.stream.getTracks().forEach(t => t.stop());
      res();
    };
    try { m.recorder.stop(); } catch (e) { res(); }
  });
}

function uniqueName(tag) {
  const id    = study.participant_code || study.sub_id_from_url || "ANON";

  const rand  = Math.random().toString(36).substr(2,5);
  return id + "_" + tag + "_" + stamp + "_" + rand + ".json";
}
function postToDataPipe(filename, dataObj) {
  return fetch("https://pipe.jspsych.org/api/data/", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Accept":"*/*" },
    body: JSON.stringify({ experimentID: CONFIG.OSF_EXPERIMENT_ID, filename, data: JSON.stringify(dataObj) })
  }).then(async resp => {
    let body = null; try { body = await resp.json(); } catch (e) { body = await resp.text(); }
    return { ok: resp.ok && !(body && body.error), status: resp.status, body };
  });
}
function sanitiseCaseForUpload(caseData) {
  /* Deep-copy the case object and strip any runtime-only mutation fields
     that must not appear in the OSF dataset. Currently: _flashed (set by
     the RTA click-replay animation) and _gaze_raw (large, not de-identified
     until explicitly deleted after transcription — but should never reach
     here; included as a safety guard). */
  const c = JSON.parse(JSON.stringify(caseData));
  (c.click_events || []).forEach(ev => { delete ev._flashed; });
  delete c._gaze_raw;
  return c;
}

/* Offset-based fallback quality scorer — used when percent_in_roi is null.
   Computes a synthetic score from the mean offset radius relative to the ROI. */
function gazeQualityFromOffsets(offsets, roiRadius) {
  if (!offsets || !offsets.length) return { pct: null, quality: "unknown" };
  const mean = offsets.reduce((s, o) => s + (o.r || 0), 0) / offsets.length;
  /* Proportion of mean offset within ROI, clamped 0–100 */
  const syntheticPct = Math.max(0, Math.min(100, Math.round((1 - mean / roiRadius) * 100)));
  const quality = syntheticPct >= 75 ? "good" : syntheticPct >= 55 ? "acceptable" : "poor";
  return { pct: syntheticPct, quality };
}
