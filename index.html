        if (stray && stray.parentNode) stray.parentNode.removeChild(stray);
      }

      /* Full audio-UI teardown — safe to call multiple times. Called both when
         the participant clicks Done and from the trial's on_finish guard. */
      function cleanupAudioUI() {
        clearSilenceBanner();
        if (meterTick) { clearInterval(meterTick); meterTick = null; }
        if (meterCtx)  { try { meterCtx.close(); } catch(e){} meterCtx = null; }
        if (aStream)   { try { aStream.getTracks().forEach(t => t.stop()); } catch(e){} }
      }
      /* Expose for the trial-level on_finish (set on the rtaTrial object). */
      window.__rtaCleanup = window.__rtaCleanup || {};
      window.__rtaCleanup[c.id] = cleanupAudioUI;

      /* ── Open a mic stream for a given deviceId (or default if null) ──
         Never pass echoCancellation:false to getUserMedia — on macOS this
         causes Bluetooth HFP re-negotiation that can drop the stream.
         Never call applyConstraints() afterwards either — same risk on some
         Bluetooth stacks. Instead, the resampling and amplitude normalization
         in transcribeBlob handle audio quality regardless of device type.

         `isSwitch` = true when the participant changes the device mid-RTA. In
         that case we PRESERVE already-recorded audio (aChunks) by flushing the
         old recorder's final data before tearing it down, and we keep the
         original recording start time so the transcript offset stays correct.
         Previously a switch discarded everything recorded before it. ── */
      async function openMicStream(deviceId, isSwitch) {
        /* Flush + stop the previous recorder. On a switch, SEAL its chunks into
           a standalone valid blob (with the time it started) and push to
           priorSegments so the audio is not lost and stays decodable. */
        if (aRec && aRec.state !== "inactive") {
          const sealedChunks = aChunks;
          const sealedStart  = segStartWall;
          const sealedMime   = aRec.mimeType || "audio/webm";
          await new Promise(res => {
            aRec.onstop = () => res();
            try { aRec.requestData(); } catch(e){}
            try { aRec.stop(); } catch(e){ res(); }
          });
          if (isSwitch && sealedChunks.length) {
            priorSegments.push({
              blob: new Blob(sealedChunks, { type: sealedMime }),
              startWall: sealedStart
            });
          }
        }
        if (aStream) aStream.getTracks().forEach(t => t.stop());
        if (meterTick) { clearInterval(meterTick); meterTick = null; }
        if (meterCtx)  { try { meterCtx.close(); } catch(e){} meterCtx = null; }
        clearSilenceBanner();

        const constraints = deviceId
          ? { audio: { deviceId: { exact: deviceId } } }
          : { audio: true };

        aStream = await navigator.mediaDevices.getUserMedia(constraints);

        /* On a fresh start, reset everything and anchor the offset clock.
           On a switch, clear priorSegments only on a fresh start; the new
           recorder always gets its own chunk buffer and its own start time. */
        if (!isSwitch) {
          priorSegments = [];
          aStart = performance.now();   // anchor for transcript offset (first device)
        }
        aChunks = [];
        segStartWall = performance.now();   // when THIS recorder begins
        aRec = new MediaRecorder(aStream);
        aRec.ondataavailable = e => { if(e.data && e.data.size) aChunks.push(e.data); };
        aRec.start(1000);

        /* ── Mic level meter using RMS on time-domain data ──
           RMS is a true measure of audio energy and is sensitive to quiet
           voices and compressed Bluetooth audio where frequency-domain
           averages often read near-zero even when audio is present. */
        try {
          meterCtx = new (window.AudioContext || window.webkitAudioContext)();
          const analyser  = meterCtx.createAnalyser();
          analyser.fftSize = 512;
          analyser.smoothingTimeConstant = 0.4;
          meterCtx.createMediaStreamSource(aStream).connect(analyser);
          const timeBuf  = new Float32Array(analyser.fftSize);
          const micBar   = document.getElementById("rta_mic_bar_"+c.id);

          /* Silence detection — warn if RMS stays below threshold for 8s */
          let silentMs = 0;
          let silenceWarnShown = false;
          const SILENCE_THRESHOLD = 0.005;  // RMS below this = effectively silent
          const SILENCE_WARN_MS   = 8000;

          meterTick = setInterval(() => {
            if (!micBar || !document.body.contains(micBar)) {
              /* Bar gone = trial DOM torn down. Force full cleanup so nothing
                 leaks into the next trial. */
              cleanupAudioUI();
              return;
            }
            analyser.getFloatTimeDomainData(timeBuf);
            const rms = Math.sqrt(timeBuf.reduce((s, v) => s + v*v, 0) / timeBuf.length);
            /* Scale: RMS of 0.02 (quiet speech) → ~40% width; 0.1 (normal) → ~100% */
            micBar.style.width = Math.min(100, rms * 1400).toFixed(1) + "%";
            /* Colour: green when active, amber when very quiet */
            micBar.style.background = rms > SILENCE_THRESHOLD ? "#1e8e4e" : "#b86e00";

            if (rms < SILENCE_THRESHOLD) {
              silentMs += 80;
              if (silentMs >= SILENCE_WARN_MS && !silenceWarnShown) {
                silenceWarnShown = true;
                const w = document.createElement("div");
                w.id = "rta_silence_warn_"+c.id;
                w.style.cssText = "position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:30;background:#fdf3dc;border:2px solid #b86e00;border-radius:8px;padding:12px 20px;color:#7a5c10;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;text-align:center;max-width:480px;line-height:1.6;";
                w.innerHTML = "&#127908; <strong>No audio detected.</strong> Please speak clearly — or use the microphone selector above to switch to a different input device.";
                document.body.appendChild(w);
                silenceBannerEl = w;
                /* Auto-dismiss when audio returns */
                dismissCheckInterval = setInterval(() => {
                  if (!meterCtx) { clearInterval(dismissCheckInterval); dismissCheckInterval = null; return; }
                  analyser.getFloatTimeDomainData(timeBuf);
                  const r = Math.sqrt(timeBuf.reduce((s,v)=>s+v*v,0)/timeBuf.length);
                  if (r > SILENCE_THRESHOLD) {
                    clearInterval(dismissCheckInterval); dismissCheckInterval = null;
                    silenceWarnShown = false;
                    silentMs = 0;
                    clearSilenceBanner();
                  }
                }, 200);
              }
            } else {
              silentMs = 0;
            }
          }, 80);
        } catch(meterErr) {
          console.warn("mic meter failed:", meterErr);
        }
      }

      /* ── Populate mic device selector ── */
      async function populateMicSelector() {
        const sel = document.getElementById("rta_mic_sel_"+c.id);
        if (!sel) return;
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const mics    = devices.filter(d => d.kind === "audioinput");
          sel.innerHTML = mics.map((d, i) =>
            `<option value="${d.deviceId}">${d.label || "Microphone " + (i+1)}</option>`
          ).join("");
          /* Pre-select the device currently in use */
          if (aStream) {
            const activeId = aStream.getAudioTracks()[0].getSettings().deviceId;
            if (activeId) sel.value = activeId;
          }
          sel.addEventListener("change", async () => {
            sel.disabled = true;
            try {
              /* isSwitch=true preserves audio already recorded on the old device. */
              await openMicStream(sel.value, true);
            } catch(e) {
              console.error("mic switch failed:", e);
              /* If the chosen device fails, fall back to default so recording
                 continues rather than leaving a dead recorder. */
              try { await openMicStream(null, true); } catch(e2) { console.error("fallback mic failed:", e2); }
            } finally {
              sel.disabled = false;
            }
          });
        } catch(e) {
          if (sel) sel.style.display = "none";
        }
      }

      try {
        /* Open the device chosen at study start. If it is no longer available
           (e.g. AirPods disconnected), getUserMedia with exact deviceId throws
           OverconstrainedError — we catch that below and retry with default. */
        try {
          await openMicStream(study.mic_device_id || null, false);
        } catch(constraintErr) {
          console.warn("Saved mic unavailable, falling back to default:", constraintErr);
          await openMicStream(null, false);
        }
        await populateMicSelector(); // then enumerate and show selector
      } catch(e) {
        console.error("mic failed", e);
        const micWarn = document.createElement("div");
        micWarn.style.cssText = "position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:20;background:#fbe4e1;border:2px solid #c0392b;border-radius:8px;padding:12px 20px;color:#7a1c12;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;text-align:center;max-width:520px;line-height:1.6;";
        micWarn.innerHTML = "<strong>Microphone access was denied.</strong><br>Your narration cannot be recorded. Please check your browser microphone permissions, then reload and try again.";
        document.body.appendChild(micWarn);
      }

      /* ── Click flash state ──
         Each active flash: { cx, cy, born, fromAOI }
         born = video timestamp (ms) when the click occurred
         cx/cy = canvas coords of the element center that was clicked   */
      const activeFlashes = [];
      const FLASH_DURATION_MS = 600;   // how long the ripple animates

      /* Pre-index click events by AOI so we can look them up by video time */
      const clickEventsForCase = (study.cases[c.id] && study.cases[c.id].click_events) || [];

      function loop() {
        if (video.paused || video.ended) return;
        canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const tMs=video.currentTime*1000;

        // Letterbox-aware scaling using stored fullscreen viewport dims.
        // This ensures AOI highlights land on the video content, not the
        // black bars, regardless of the participant's screen size or DPR.
        const vp=(study.cases[c.id]&&study.cases[c.id].viewport)||{w:window.innerWidth,h:window.innerHeight};
        const cW=canvas.width, cH=canvas.height;
        const vidAspect=vp.w/vp.h, canAspect=cW/cH;
        let drawW, drawH, offX=0, offY=0;
        if (vidAspect>canAspect) { drawW=cW; drawH=cW/vidAspect; offY=(cH-drawH)/2; }
        else { drawH=cH; drawW=cH*vidAspect; offX=(cW-drawW)/2; }
        const sx=drawW/vp.w, sy=drawH/vp.h;

        /* ── Trigger new click flashes ──
           For each click event whose timestamp falls within the last frame's
           worth of video time (~16ms window), spawn a flash on that AOI's rect. */
        const FRAME_MS = 20;
        clickEventsForCase.forEach(ev => {
          if (ev.t > tMs - FRAME_MS && ev.t <= tMs && !ev._flashed) {
            ev._flashed = true;
            /* Prefer stored x,y if available; fall back to AOI rect center */
            let cx, cy;
            if (ev.x && ev.y) {
              cx = offX + ev.x * sx;
              cy = offY + ev.y * sy;
            } else {
              const rect = aoiRects.find(r => r.id === ev.aoi);
              if (rect) {
                cx = offX + ((rect.left + rect.right) / 2) * sx;
                cy = offY + ((rect.top  + rect.bottom) / 2) * sy;
              }
            }
            if (cx != null && cy != null) {
              activeFlashes.push({ cx, cy, born: tMs });
            }
          }
        });

        /* ── Cursor position from click events ──
           Gaze dot removed — WebGazer accuracy drifts enough during a session
           that a floating dot frequently misleads rather than orients.
           Mouse cursor position (stored on every click event) is reliable and
           accurate. We find the most recent click event at or before tMs and
           use its x,y as the cursor position. Between clicks the cursor is
           shown at the last known position with a gentle fade to indicate
           it hasn't moved recently. */
        const cursorEvents = clickEventsForCase.filter(ev => ev.x && ev.y && ev.t <= tMs);
        const lastCursorEv = cursorEvents.length > 0 ? cursorEvents[cursorEvents.length - 1] : null;
        let curX = null, curY = null, curAge = null;
        if (lastCursorEv) {
          curX   = offX + lastCursorEv.x * sx;
          curY   = offY + lastCursorEv.y * sy;
          curAge = tMs - lastCursorEv.t;
        }

        /* ── Draw click flash ripples ──
           Each flash is a pair of expanding concentric rings that fade out.
           Inner ring: white; outer ring: yellow. Both fade over FLASH_DURATION_MS. */
        for (let i = activeFlashes.length - 1; i >= 0; i--) {
          const f = activeFlashes[i];
          const age = tMs - f.born;
          if (age > FLASH_DURATION_MS) { activeFlashes.splice(i, 1); continue; }
          const progress = age / FLASH_DURATION_MS;
          const eased    = 1 - Math.pow(1 - progress, 2);
          const alpha    = 1 - progress;

          /* Outer ripple ring — expands from 18px to 52px */
          const r1 = 18 + eased * 34;
          ctx.beginPath(); ctx.arc(f.cx, f.cy, r1, 0, 2*Math.PI);
          ctx.strokeStyle = `rgba(255,212,0,${alpha * 0.9})`;
          ctx.lineWidth   = 3;
          ctx.stroke();

          /* Inner ripple ring — expands from 10px to 28px */
          const r2 = 10 + eased * 18;
          ctx.beginPath(); ctx.arc(f.cx, f.cy, r2, 0, 2*Math.PI);
          ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.7})`;
          ctx.lineWidth   = 2;
          ctx.stroke();

          /* Static filled dot at center */
          ctx.beginPath(); ctx.arc(f.cx, f.cy, 7, 0, 2*Math.PI);
          ctx.fillStyle   = `rgba(255,212,0,${alpha})`;
          ctx.fill();
          ctx.strokeStyle = `rgba(0,0,0,${alpha * 0.5})`;
          ctx.lineWidth   = 1.5;
          ctx.stroke();
        }

        /* ── Draw cursor ring at last known mouse position ──
           Fades slightly if no click has fired recently (cursor idle),
           so participants understand it's a position marker, not a live pointer.
           Disappears entirely after 10 seconds of no recorded click activity
           to avoid a stale dot being misleading. */
        if (curX != null && curAge < 10000) {
          const idleAlpha = curAge < 2000 ? 1 : Math.max(0.25, 1 - (curAge - 2000) / 8000);

          /* Outer ring */
          ctx.beginPath(); ctx.arc(curX, curY, 18, 0, 2*Math.PI);
          ctx.strokeStyle = `rgba(255,212,0,${0.55 * idleAlpha})`;
          ctx.lineWidth   = 2;
          ctx.stroke();

          /* Inner filled dot */
          ctx.beginPath(); ctx.arc(curX, curY, 7, 0, 2*Math.PI);
          ctx.fillStyle   = `rgba(255,212,0,${0.85 * idleAlpha})`;
          ctx.strokeStyle = `rgba(0,0,0,${0.5 * idleAlpha})`;
          ctx.lineWidth   = 1.5;
          ctx.fill(); ctx.stroke();
        }

        requestAnimationFrame(loop);
      }

      video.addEventListener("play",()=>{
        vStart=performance.now();
        /* aRec already started above — recording began before video play to
           avoid missing the first words. vStart is used for offset calculation. */
        /* Reset flash flags so replays work correctly */
        clickEventsForCase.forEach(ev => { delete ev._flashed; });
        activeFlashes.length = 0;
        requestAnimationFrame(loop);
      });
      let videoHasPlayed = false;
      video.addEventListener("play",    () => { videoHasPlayed = true; });
      video.addEventListener("ended",   () => {
        if (videoHasPlayed) { done.disabled=false; done.style.background="#1e8e4e"; }
      });
      /* Safety unlock: after RTA_MAX_SECONDS, enable Done regardless —
         but only if the video actually started playing at some point. */
      setTimeout(() => {
        if (videoHasPlayed && done.disabled) {
          done.disabled=false; done.style.background="#1e8e4e";
        }
      }, CONFIG.RTA_MAX_SECONDS*1000);
      try {
        await video.play();
      } catch(e) {
        /* video.play() rejected — blob may have failed to load.
           Show an error rather than silently enabling Done with no video. */
        console.error("RTA video.play() failed:", e);
        const errDiv = document.createElement("div");
        errDiv.style.cssText = "position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:20;background:#fbe4e1;border:2px solid #c0392b;border-radius:8px;padding:14px 22px;color:#7a1c12;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;text-align:center;max-width:500px;";
        errDiv.innerHTML = "<strong>Recording could not be loaded for playback.</strong><br>Click Done to continue — your typed responses and interaction data are still saved.";
        document.body.appendChild(errDiv);
        done.disabled=false; done.style.background="#b85a1e";
      }

      done.addEventListener("click", async () => {
        done.disabled=true; done.textContent="Saving…";
        try { video.pause(); } catch(e){}
        /* Per-segment offsets are computed inside finalize (each device segment
           carries its own start time), so no single offset is needed here. */

        /* ── Full-screen saving overlay ──
           Transcription (Whisper) and the OSF upload can take 30–90s. A small
           corner toast made the page look frozen. This full-screen overlay
           covers the RTA screen, can't be missed, and shows an animated
           indeterminate indicator plus stage text so participants know work is
           ongoing. It stays up until BOTH transcription and upload finish. */
        const overlay = document.createElement("div");
        overlay.id = "bw_saving_overlay_"+c.id;
        overlay.setAttribute("role","status");
        overlay.setAttribute("aria-live","polite");
        overlay.style.cssText = "position:fixed;inset:0;z-index:99999;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;color:#16202e;";
        overlay.innerHTML = `
          <div style="width:min(520px,86vw);text-align:center;">
            <div style="font-size:22px;font-weight:700;color:#1565c0;margin-bottom:10px;">Saving your responses…</div>
            <div id="bw_save_stage_${c.id}" style="font-size:16px;color:#2a3744;line-height:1.6;margin-bottom:26px;">
              Processing your narration. This can take up to a minute.
            </div>
            <!-- Indeterminate animated bar (we cannot measure true Whisper progress) -->
            <div style="background:#e3e9f0;border-radius:6px;height:10px;overflow:hidden;position:relative;">
              <div id="bw_save_bar_${c.id}" style="position:absolute;top:0;left:-40%;width:40%;height:100%;border-radius:6px;background:#1565c0;animation:bw-indeterminate 1.3s ease-in-out infinite;"></div>
            </div>
            <div style="font-size:14px;color:#566673;margin-top:22px;line-height:1.6;">
              <strong>Please do not close this tab or navigate away.</strong><br>
              Your audio and video are processed on your computer and never uploaded — only de-identified text and interaction data are saved.
            </div>
          </div>`;
        document.body.appendChild(overlay);
        /* Inject the keyframes once. */
        if (!document.getElementById("bw_indeterminate_kf")) {
          const kf = document.createElement("style");
          kf.id = "bw_indeterminate_kf";
          kf.textContent = "@keyframes bw-indeterminate{0%{left:-40%}50%{left:60%}100%{left:100%}}";
          document.head.appendChild(kf);
        }
        const setStage = (msg) => {
          const el = document.getElementById("bw_save_stage_"+c.id);
          if (el) el.textContent = msg;
        };
        /* If the Whisper model is still downloading (can happen on the very
           first case if warm-up hasn't finished), show real download % so the
           wait is explained rather than mysterious. Stops once transcription
           begins (setStage overwrites it). */
        let modelPollActive = true;
        const modelPoll = setInterval(() => {
          if (!modelPollActive) { clearInterval(modelPoll); return; }
          if (__modelProgress > 0 && __modelProgress < 100) {
            setStage(`Preparing the speech processor (${__modelProgress}%)… first case only.`);
          }
        }, 400);

        const finalize = async (finalSegment) => {
          /* Build the full ordered list of recording segments: every device
             the participant used, in order, each a self-contained valid blob.
             In the common case (no mid-RTA switch) this is just one segment. */
          const allSegments = priorSegments.slice();
          if (finalSegment && finalSegment.blob && finalSegment.blob.size) {
            allSegments.push(finalSegment);
          }

          let segs = [];
          let fullTextParts = [];
          let segIndex = 0;
          modelPollActive = false;   // stop model-download polling; transcription stages take over
          clearInterval(modelPoll);
          setStage("Processing your narration. This can take up to a minute.");
          for (const seg of allSegments) {
            segIndex++;
            if (allSegments.length > 1) {
              setStage(`Processing your narration (part ${segIndex} of ${allSegments.length})…`);
            }
            /* Offset = where this device's recording sits relative to the video
               timeline. vStart is when the video began playing. */
            const segOffset = (seg.startWall - vStart) / 1000;
            try {
              const out = await transcribeBlob(seg.blob);
              const mapped = (out.chunks || []).map(ch => {
                const [s, e] = ch.timestamp || [null, null];
                return {
                  start_ms: s == null ? null : Math.max(0, Math.round((s + segOffset) * 1000)),
                  end_ms:   e == null ? null : Math.max(0, Math.round((e + segOffset) * 1000)),
                  text: (ch.text || "").trim()
                };
              }).filter(x => x.text);
              segs = segs.concat(mapped);
              if (out.text && out.text.trim()) fullTextParts.push(out.text.trim());
            } catch(transcribeErr) {
              console.error("Transcription failed for a segment:", transcribeErr);
            }
          }
          /* Order merged segments chronologically by start time. */
          segs.sort((a, b) => (a.start_ms ?? 0) - (b.start_ms ?? 0));

          study.cases[c.id].transcript_full     = fullTextParts.join(" ").trim() ||
                                                   (allSegments.length ? "[transcription error]" : "");
          study.cases[c.id].transcript_segments = segs;
          delete study.cases[c.id]._gaze_raw;
          cleanupAudioUI();   // clears meterTick, dismiss-check, silence banner, stops stream
          if (m.url){ try { URL.revokeObjectURL(m.url); } catch(e){} m.url=null; m.blob=null; }

          /* Upload now, with the overlay still up, and WAIT for it so the
             participant doesn't advance before their data is saved. */
          setStage("Saving your data securely…");
          try {
            await uploadCaseInBackground(c.id);
          } catch(uploadErr) {
            console.error("Upload await error:", uploadErr);
            /* Don't trap the participant on a failed background save — the final
               end-of-study upload re-sends all cases. Continue. */
          }
          setStage("Done. Continuing…");
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          jsPsych.finishTrial();
        };

        /* Stop the active recorder, seal its chunks as the final segment, then
           transcribe all segments together. */
        if (aRec && aRec.state !== "inactive") {
          const activeChunks = aChunks;
          const activeStart  = segStartWall;
          const activeMime   = aRec.mimeType || "audio/webm";
          aRec.onstop  = () => finalize({ blob: new Blob(activeChunks, { type: activeMime }), startWall: activeStart });
          aRec.onerror = () => finalize(null);
          try { aRec.requestData(); } catch(e){}
          try { aRec.stop(); } catch(e) { finalize(null); }
        } else {
          finalize(null);
        }
      });
    }
  };

  return [navWarn, startRec, ehrTrial, rtaTrial];
}

/* ── Practice trial (non-clinical: scheduling scenario) ──
   Uses BioWorld visual style. No hypothesis manager, no assessments,
   no library — just 2 evidence paragraphs + submit so participants
   learn the mechanics without rehearsing OT clinical reasoning. */
const practiceNavWarn = {
  type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
  stimulus:`<div style="max-width:660px;margin:7% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">

    (function attachPrSelectionHandlers() {
      let popover = null;
      let rafHandle = null;

      function removePopover() {
        if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
        if (popover)   { popover.remove(); popover = null; }
      }

      function positionPopover(rect) {
        const margin = 8;
        const pw = popover.offsetWidth, ph = popover.offsetHeight;
        const vw = window.innerWidth,   vh = window.innerHeight;
        let top  = rect.top - ph - margin;
        if (top < margin) top = rect.bottom + margin;
        top  = Math.max(margin, Math.min(top,  vh - ph - margin));
        let left = rect.left + rect.width / 2 - pw / 2;
        left = Math.max(margin, Math.min(left, vw - pw - margin));
        popover.style.left = left + "px";
        popover.style.top  = top  + "px";
        popover.style.visibility = "visible";
      }

      function showPopover(selectedText, paraEl, paraId, selectionRect) {
        removePopover();
        popover = document.createElement("div");
        popover.id = "bw-sel-popover";
        popover.style.visibility = "hidden";

        const addBtn = document.createElement("button");
        addBtn.textContent = "＋ Add to Evidence";

        popover.appendChild(dismissBtn);
        document.body.appendChild(popover);

        rafHandle = requestAnimationFrame(() => {
          rafHandle = null;
          if (!popover) return;
          positionPopover(selectionRect);
        });

        addBtn.addEventListener("click", () => {
          if (!prEv.some(e => e.text === selectedText)) {
            prEv.push({ id: prEvCounter++, text: selectedText });
            paraEl.classList.add("para-added");

          try { window.getSelection().removeAllRanges(); } catch(e) {}
          removePopover();
        });
      }

      document.querySelectorAll("#bw_root_pr .bw-ev-para").forEach(paraEl => {
        paraEl.addEventListener("mouseup", () => {
          setTimeout(() => {
            try {
              const sel = window.getSelection();
              if (!sel || sel.rangeCount === 0) { removePopover(); return; }
              const text = sel.toString().trim();
              if (!text) { removePopover(); return; }
              const anchor = sel.anchorNode, focus = sel.focusNode;
              if (!anchor || !focus) { removePopover(); return; }
              if (!paraEl.contains(anchor) && !paraEl.contains(focus)) { removePopover(); return; }
              const range = sel.getRangeAt(0);
              const rect  = range.getBoundingClientRect();
              if (!rect || (rect.width === 0 && rect.height === 0)) { removePopover(); return; }
              showPopover(text, paraEl, paraEl.id, rect);

              console.warn("pr-sel mouseup:", err);
              removePopover();
            }
          }, 0);
        });
      });

      document.addEventListener("mousedown", (e) => {
        if (popover && !popover.contains(e.target)) removePopover();
      }, true);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { removePopover(); try { window.getSelection().removeAllRanges(); } catch(ex) {} }

    let aStream=null,aRec=null,aChunks=[];
    try{
      /* Use the same device chosen at study start so the participant exercises
         the real mic path during practice. Falls back to default if unavailable. */
      const micConstraints = study.mic_device_id

        aStream = await navigator.mediaDevices.getUserMedia({ audio: true });

      aRec=new MediaRecorder(aStream);
      aRec.ondataavailable=e=>{if(e.data&&e.data.size)aChunks.push(e.data);};
      aRec.start(1000);
    }catch(e){}
    video.addEventListener("ended",()=>{done.disabled=false;done.style.background="#1e8e4e";});
