/* =====================================================================
   AOI RECT SNAPSHOT  — called at trial start and on each tab switch
   ===================================================================== */
function snapshotAOIRects(caseConfig, caseStart) {
  const rects = [];
  const cid = caseConfig.id;
  caseConfig.gaze_aois.forEach(aoi => {
    /* Resolve the element for this AOI id. Tab-panel AOIs are suffixed with the
       case id in the DOM (e.g. bw_panel_chart -> bw_panel_chart_2); always-present
       left-panel AOIs use their bare id. Try both forms. */
    const el = document.getElementById(aoi.id) ||
               document.getElementById(aoi.id + "_" + cid) ||
               document.getElementById("bw_panel_" + aoi.id.replace("bw_panel_","") + "_" + cid);
    if (!el) return;
    /* Skip elements that aren't currently rendered (hidden inactive tabs have
       zero size). Only the visible tab's content has a valid rect at this
       instant — which is exactly why we take a NEW snapshot on every tab switch
       and time-window the matching, rather than relying on one static set. */
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    rects.push({
      id: aoi.id, label: aoi.label,
      left:r.left, right:r.right, top:r.top, bottom:r.bottom,
      /* Stored so the per-participant AOI adequacy check can be computed in R
         against this participant's actual rendered geometry, not assumed sizes. */
      w: Math.round(r.width), h: Math.round(r.height)
    });
  });
  return { t: Math.round(performance.now() - caseStart), rects };
}

/* =====================================================================
   GAZE → DWELL EVENTS
   Each event in the output represents one unbroken AOI visit:
     t          — onset time (ms from case start)
     aoi        — element id (e.g. "bw_panel_chart") — this is the RQA symbol
     label      — human-readable AOI name from gaze_aois
     dwell_ms   — duration of this AOI visit in milliseconds
     aoi_from   — aoi id of the immediately preceding visit (null for first event)
     aoi_to     — aoi id of the immediately following visit (null for last event, filled by post-pass)
     from_label — human-readable label for aoi_from (null for first event)
     to_label   — human-readable label for aoi_to (filled by post-pass)
     source     — always "gaze"
   ===================================================================== */
function pointToAOI(x, y, rects) {
  for (const r of rects) if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return r;
  return null;
}

/* Given the array of time-stamped snapshots [{t, rects}, ...] (sorted ascending
   by t), return the rect set that was valid at gaze-sample time `sampleT`.
   The valid snapshot is the most recent one whose t <= sampleT. Before the
   first snapshot, use the first one. This is the core of the fix: AOI geometry
   changes when the participant switches tabs, so a gaze sample must be matched
   against the layout that existed AT THAT MOMENT, not the end-of-case layout. */
function rectsAtTime(snapshots, sampleT) {
  if (!snapshots || !snapshots.length) return [];
  let chosen = snapshots[0].rects;
  for (const snap of snapshots) {
    if (snap.t <= sampleT) chosen = snap.rects;
    else break;
  }
  return chosen;
}

/* Resolve the rect (with label/emic/etic) for a given AOI id from the snapshot
   valid at time `t`. Used when emitting a completed dwell so its label/codes
   come from the layout that existed during the visit. */
function lastValidRect(snapshots, aoiId, t) {
  const rects = rectsAtTime(snapshots, t);
  return rects.find(rr => rr.id === aoiId) || null;
}

function gazeToDwells(samples, snapshots) {
  /* ── Pass 1: segment raw samples into candidate dwell visits ──
     Each sample is matched against the time-valid AOI snapshot. */
  const visits = [];   // { aoi, label, start, end }
  let cur = null, curStart = null, lastT = null;

  const sorted = (samples || []).filter(s => s && s.x != null).sort((a, b) => a.t - b.t);

  for (const s of sorted) {
    const rects = rectsAtTime(snapshots, s.t);
    const hit = pointToAOI(s.x, s.y, rects);
    const aoi = hit ? hit.id : null;

    if (aoi !== cur) {
      if (cur !== null && (lastT - curStart) >= CONFIG.MIN_DWELL_MS) {
        const r = lastValidRect(snapshots, cur, lastT);
        visits.push({
          aoi:   cur,
          label: r ? (r.label || cur) : cur,
          start: curStart,
          end:   lastT
        });
      }
      cur = aoi; curStart = s.t;
    }
    lastT = s.t;
  }
  /* Flush final visit */
  if (cur !== null && lastT !== null && (lastT - curStart) >= CONFIG.MIN_DWELL_MS) {
    const r = lastValidRect(snapshots, cur, lastT);
    visits.push({
      aoi:   cur,
      label: r ? (r.label || cur) : cur,
      start: curStart,
      end:   lastT
    });
  }

  /* ── Pass 2: keep AOI-matched visits, then add dwell_ms + transition fields ──
     Filter is on AOI membership, NOT on emic/etic codes. (The previous version
     filtered `v.emic || v.etic`; once codes were removed from the AOI table that
     predicate would have silently dropped every dwell and returned an empty
     gaze stream with no error.) A null aoi means the sample fell in a gutter or
     off-panel — deliberately uncoded dead space, correctly excluded here. */
  const coded = visits.filter(v => v.aoi !== null && v.aoi !== undefined);

  return coded.map((v, i) => {
    const prev = i > 0             ? coded[i - 1] : null;
    const next = i < coded.length - 1 ? coded[i + 1] : null;
    return {
      t:          Math.round(v.start),
      aoi:        v.aoi,
      label:      v.label,
      dwell_ms:   Math.round(v.end - v.start),
      aoi_from:   prev ? prev.aoi   : null,
      from_label: prev ? prev.label : null,
      aoi_to:     next ? next.aoi   : null,
      to_label:   next ? next.label : null,
      source:     "gaze"
    };
  });
}

/* =====================================================================
   GAZE → TRANSITION SUMMARY
   Extracts all consecutive AOI pairs from the dwell event list as a
   flat array for direct use in transition-rate analysis.
   Each entry: { t, from, from_label, to, to_label }
   ===================================================================== */
function gazeToTransitions(dwellEvents) {
  const transitions = [];
  for (let i = 0; i < dwellEvents.length - 1; i++) {
    const a = dwellEvents[i];
    const b = dwellEvents[i + 1];
    /* Only record transitions where the AOI actually changes.
       Same-AOI consecutive entries can appear if a participant briefly
       looks away to an uncoded region and back within MIN_DWELL_MS. */
    if (a.aoi === b.aoi) continue;
    transitions.push({
      t:          a.t + a.dwell_ms,   // transition occurs at end of the departing dwell
      from:       a.aoi,
      from_label: a.label,
      to:         b.aoi,
      to_label:   b.label
    });
  }
  return transitions;
}

/* =====================================================================
   CLICK → AOI SEQUENCE  (second RQA stream)

   Produces a categorical sequence over the SAME seven-symbol alphabet as the
   gaze stream, so %DET and LAM computed on each are directly comparable.

   Role: gaze is the primary RQA stream (RQ3/RQ4); clicks are reported in
   every scenario as convergent evidence from an exactly-measured stream, and
   become the inferential stream only if gaze data quality fails the
   pre-specified threshold. That switch rule must be fixed before data
   collection — see gazeQualityMetrics() below.

   Caveat to carry into analysis: click sequences are short (tens of events
   per case, versus hundreds of gaze dwells). RQA on short categorical
   sequences is unstable, and %DET/LAM degrade as length drops. The pilot
   must report observed click counts per case before this stream is relied
   on for anything inferential.
   ===================================================================== */
const GAZE_ALPHABET = [
  "bw_hyp_panel","bw_belief_panel","bw_ev_panel",
  "bw_panel_problem","bw_panel_chart","bw_panel_library","bw_panel_plan"
];

/* Normalise a logged click AOI id onto the seven-symbol alphabet.
   Click ids arrive in three forms:
     bare            "bw_hyp_panel"
     case-suffixed   "bw_panel_chart_2"
     paragraph ids   "bw_para_a1"   (live inside the Problem tab)
   Anything outside the alphabet (e.g. the instructions banner) returns null
   and is excluded, mirroring how off-AOI gaze samples are dropped. */
function normaliseClickAOI(rawId) {
  if (!rawId) return null;
  let id = String(rawId).replace(/_\d+$/, "");     // strip case suffix
  if (id.indexOf("bw_para_") === 0) id = "bw_panel_problem";
  return GAZE_ALPHABET.indexOf(id) !== -1 ? id : null;
}

function clickToSequence(clickEvents, gazeAois) {
  const labelOf = {};
  (gazeAois || []).forEach(a => { labelOf[a.id] = a.label; });
  const seq = [];
  (clickEvents || []).slice().sort((a,b) => a.t - b.t).forEach(ev => {
    const aoi = normaliseClickAOI(ev.aoi);
    if (!aoi) return;
    seq.push({
      t: ev.t, aoi, label: labelOf[aoi] || aoi,
      action: ev.action || null, source: "click"
    });
  });
  return seq.map((v, i) => ({
    t: v.t, aoi: v.aoi, label: v.label, action: v.action,
    aoi_from:   i > 0               ? seq[i-1].aoi   : null,
    from_label: i > 0               ? seq[i-1].label : null,
    aoi_to:     i < seq.length - 1  ? seq[i+1].aoi   : null,
    to_label:   i < seq.length - 1  ? seq[i+1].label : null,
    source: "click"
  }));
}

/* Consecutive-pair transitions, matching gazeToTransitions in shape.
   Same-symbol repeats are retained here (unlike gaze, where they cannot
   occur by construction) because two successive clicks in one panel are a
   real behavioural repetition, not a measurement artefact. */
function clickToTransitions(clickSeq) {
  const out = [];
  for (let i = 0; i < clickSeq.length - 1; i++) {
    out.push({
      t: clickSeq[i+1].t,
      from: clickSeq[i].aoi,   from_label: clickSeq[i].label,
      to:   clickSeq[i+1].aoi, to_label:   clickSeq[i+1].label
    });
  }
  return out;
}

/* =====================================================================
   GAZE DATA-QUALITY METRICS  (participant-level inclusion criterion)

   adequacy = smallest rendered AOI dimension / this participant's measured
   validation error. It combines instrument error and actual rendered
   geometry into one number, which is what determines whether THIS
   participant's gaze can resolve THEIR AOIs. Window size varies across
   participants, so AOI sizes do too — assumed geometry is not sufficient.

   Threshold is intentionally left unset here. Calibrate it in the pilot,
   pre-register the value, and gate gaze inclusion on it. A provisional
   value in the 1.0-1.5 range is a defensible starting point.
   ===================================================================== */
function gazeQualityMetrics(rawSamples, dwells, snapshots, meanOffsetPx) {
  const nRaw = (rawSamples || []).length;
  const nOnAoi = (dwells || []).reduce((k, d) => k + 1, 0);
  let minDim = null;
  (snapshots || []).forEach(sn => (sn.rects || []).forEach(r => {
    const d = Math.min(r.w != null ? r.w : (r.right - r.left),
                       r.h != null ? r.h : (r.bottom - r.top));
    if (minDim === null || d < minDim) minDim = d;
  }));
  const dwellMs = (dwells || []).reduce((k, d) => k + (d.dwell_ms || 0), 0);
  return {
    n_raw_samples:      nRaw,
    n_dwells:           nOnAoi,
    total_dwell_ms:     dwellMs,
    min_aoi_dimension:  minDim,
    mean_offset_px:     meanOffsetPx != null ? meanOffsetPx : null,
    aoi_adequacy:       (minDim != null && meanOffsetPx) ? +(minDim / meanOffsetPx).toFixed(3) : null,
    /* Realised alphabet size: symbols this participant actually visited.
       Smaller realised alphabets inflate %REC for reasons unrelated to
       search strategy, so this is needed to interpret RQA across people. */
    realised_alphabet:  Array.from(new Set((dwells || []).map(d => d.aoi))).length
  };
}

/* =====================================================================
   BIOWORLD TRIAL FACTORY
   ===================================================================== */
function buildBioWorldTrials(c) {

  /* ── Pre-case navigation warning ── */
  const navWarn = {
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    stimulus:`<div style="max-width:660px;margin:7% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
        <h2 style="color:#1565c0;">Before You Begin: Case ${c.id}</h2>

        <div style="background:#fbe4e1;border-left:4px solid #c0392b;padding:18px 22px;border-radius:6px;margin:18px 0;">
          <p style="margin:0 0 10px;font-weight:700;font-size:16px;color:#8a241a;">&#9888;&nbsp; Do not navigate away during the case</p>
          <p style="margin:0;font-size:15px;line-height:1.7;">
            Once the case begins, <strong>do not switch tabs, open other windows, or leave this browser.</strong>
            The study records your eye movements and interactions continuously.
            Switching away stops the screen recording and interrupts the data collection — there is no way to resume.
          </p>
        </div>

        <div style="background:#f2f5f9;border:1px solid #d0d9e3;border-radius:6px;padding:16px 20px;margin:18px 0;font-size:15px;line-height:1.8;">
          <p style="margin:0 0 8px;font-weight:700;color:#1565c0;">If you need to pause or step away:</p>
          <ul style="margin:0;padding-left:20px;">
            <li>Do so <strong>before</strong> clicking "Start Recording" on the next screen.</li>
            <li>Once the case is open, plan to work through it without interruption.</li>
            <li>Cases typically take 10–15 minutes each.</li>
          </ul>
        </div>

        <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;margin-top:22px;padding:14px 18px;background:#eef4fb;border:1px solid #7fb0dc;border-radius:6px;">
          <input type="checkbox" id="nav_ack_${c.id}"
            style="width:20px;height:20px;margin-top:2px;accent-color:#1565c0;cursor:pointer;flex-shrink:0;" />
          <span style="font-size:15px;line-height:1.6;color:#16202e;">
            I understand. I will not switch tabs or navigate away once the case begins.
            I am ready to work through this case without interruption.
          </span>
        </label>

        <button id="nav_ack_btn_${c.id}" disabled
          style="margin-top:18px;padding:13px 32px;background:#c4d3e2;color:#566673;border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:not-allowed;transition:background 0.2s,color 0.2s;">
          Continue to Case ${c.id} &rarr;
        </button>
      </div>`,
    on_load: function () {
      const ack = document.getElementById("nav_ack_"+c.id);
      const btn = document.getElementById("nav_ack_btn_"+c.id);
      ack.addEventListener("change", () => {
        if (ack.checked) {
          btn.disabled = false;
          btn.style.background = "#1565c0";
          btn.style.color = "#ffffff";
          btn.style.cursor = "pointer";
        } else {
          btn.disabled = true;
          btn.style.background = "#c4d3e2";
          btn.style.color = "#566673";
          btn.style.cursor = "not-allowed";
        }
      });
      btn.addEventListener("click", () => { if (!btn.disabled) jsPsych.finishTrial(); });
    }
  };

  /* ── Screen-share consent + recording start ── */
  const startRec = {
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    stimulus:`<div style="max-width:680px;margin:9% auto;text-align:left;color:#1d2a38;font-family:'Segoe UI',Arial,sans-serif;">
        <h2 style="color:#1565c0;">Case ${c.id}: ${c.patientName}</h2>
        <p style="font-size:17px;line-height:1.7;">We will record this browser tab while you review the chart, so you can narrate over it afterward. The recording stays on your computer — only transcribed text is uploaded.</p>

        <div style="background:#d3e4f5;border-left:4px solid #1565c0;padding:16px 20px;border-radius:6px;margin:18px 0;">
          <p style="margin:0;font-size:16px;">Click the button below. The window will go <strong>fullscreen first</strong>, then your browser will ask you to <strong>select a tab to share</strong> — choose <strong>this experiment's tab</strong> (not Window or Entire Screen).</p>
        </div>

        <button id="rec_${c.id}"
          style="margin-top:6px;padding:14px 30px;background:#1e8e4e;color:#ffffff;border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;">
          Start Recording &amp; Open Case ${c.id}
        </button>
        <p id="err_${c.id}" style="color:#c0392b;margin-top:10px;"></p>
      </div>`,
    on_load: function () {
      const recBtn = document.getElementById("rec_"+c.id);
      const errEl  = document.getElementById("err_"+c.id);

      recBtn.addEventListener("click", async () => {
        recBtn.disabled = true;
        try {
          /* Request fullscreen SYNCHRONOUSLY inside the user gesture before any
             await — Chrome requires transient activation for requestFullscreen()
             and it is consumed by the first await (getDisplayMedia). Requesting
             here guarantees the gesture is still live.
             On some platforms the share picker may momentarily exit fullscreen;
             we re-enter it after getDisplayMedia resolves (second try block). */
          try { await document.documentElement.requestFullscreen(); } catch(fe) {
            console.warn("requestFullscreen (pre-share) failed:", fe);
          }
          const s = await startScreenRecording(c.id);
          /* Re-enter fullscreen if the share picker dismissed it (common on macOS). */
          if (!document.fullscreenElement) {
            try { await document.documentElement.requestFullscreen(); } catch(fe) {
              console.warn("requestFullscreen (post-share re-enter) failed:", fe);
            }
          }
          s.getVideoTracks()[0].addEventListener("ended", () => {
            /* Screen share was stopped by the browser (tab switch, Esc, user revoked
               permission, etc.). Do NOT auto-submit — that would advance the timeline
               silently while the participant may still be mid-case. Instead show a
               prominent warning and require an explicit decision. */
            const sub = document.getElementById("bw_submit_"+c.id);
            if (!sub || sub.dataset.submitted === "true") return;

            const warn = document.createElement("div");
            warn.id = "bw_stream_warn_"+c.id;
            warn.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.82);";
            warn.innerHTML = `
              <div style="background:#ffffff;border:2px solid #c0392b;border-radius:10px;padding:32px 36px;max-width:500px;text-align:left;font-family:'Segoe UI',Arial,sans-serif;color:#1d2a38;">
                <h3 style="color:#c0392b;margin:0 0 14px;">Screen recording stopped</h3>
                <p style="font-size:15px;line-height:1.7;margin:0 0 20px;">
                  The screen recording was interrupted — this usually happens when you switch to another tab or window, or stop sharing from the browser toolbar.
                </p>
                <p style="font-size:15px;line-height:1.7;margin:0 0 24px;">
                  <strong>Your work so far has not been lost.</strong>
                  You can submit what you have completed, or return to the case to finish.
                </p>
                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                  <button id="bw_warn_submit_${c.id}" style="padding:11px 22px;background:#c0392b;color:#ffffff;border:none;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;">
                    Submit case as-is
                  </button>
                  <button id="bw_warn_dismiss_${c.id}" style="padding:11px 22px;background:#d3e4f5;color:#1565c0;border:1px solid #7fb0dc;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;">
                    Return to case
                  </button>
                </div>
              </div>`;
            document.body.appendChild(warn);

            document.getElementById("bw_warn_submit_"+c.id).addEventListener("click", () => {
              warn.remove();
              if (sub && sub.dataset.submitted !== "true") sub.click();
            });
            document.getElementById(`bw_warn_dismiss_${c.id}`).addEventListener("click", () => {
              warn.remove();
              /* Participant continues without a recording for the remainder.
                 Partial gaze and click data collected before the drop is preserved. */
            });
          });
          /* ── Settle delay (borrowed from the fullscreen plugin's delay_after) ──
             Entering fullscreen and starting the share both trigger transient
             browser notifications ("X is sharing your screen", "press Esc to
             exit fullscreen"). Pausing briefly lets those clear before the EHR
             renders, so the participant isn't reading the chart — or being gaze-
             tracked — while a banner is still fading at the top of the viewport.
             A short "Preparing…" message keeps the screen from looking frozen. */
          const settle = document.createElement("div");
          settle.style.cssText = "position:fixed;inset:0;z-index:50;background:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;color:#1565c0;font-size:18px;font-weight:600;";
          settle.textContent = "Preparing the case…";
          document.body.appendChild(settle);
          await new Promise(res => setTimeout(res, 700));
          if (settle.parentNode) settle.parentNode.removeChild(settle);
          jsPsych.finishTrial();
        } catch (e) {
          recBtn.disabled = false;
          errEl.textContent = "Screen share cancelled — click Step 2 again and select this experiment's tab from the list.";
        }
      });
    }
  };

  /* ── Main BioWorld EHR trial ── */
  const ehrTrial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: buildBioWorldUI(c),
    choices: "NO_KEYS",
    /* If DEV skipped camera init, WebGazer was never started and the extension
       would have nothing to attach to — the case would appear to run normally
       while silently producing zero gaze samples. Strip it instead, so the
       absence of gaze data is structural and obvious rather than a silent gap. */
    extensions: DEV.skip("webcam")
      ? []
      : [{ type: jsPsychExtensionWebgazer, params:{ targets:["#bw_root_"+c.id] } }],
    data: { trial_tag:"bw_ehr_case", case_id:c.id },

    on_load: function () {
      /* hide live gaze dot */
      try { webgazer.showVideo(false); webgazer.showPredictionPoints(false); } catch(e) {}
      const dot = document.getElementById("webgazerGazeDot"); if (dot) dot.style.display="none";

      /* ── WebGazer heartbeat ──
         Explicitly resume the prediction loop at trial start — it can stall
         after the calibration/validation sequence or if the tab was backgrounded.
         Then poll every 3 seconds; if no prediction has arrived in that window,
         resume() again to restart the internal rAF loop. */
      try { webgazer.resume(); } catch(e) {}
      let _lastGazePrediction = performance.now();
      webgazer.setGazeListener((data) => {
        if (data) _lastGazePrediction = performance.now();
      });
      const _gazeHeartbeat = setInterval(() => {
        const stalledMs = performance.now() - _lastGazePrediction;
        if (stalledMs > 3000) {
          try { webgazer.resume(); } catch(e) {}
        }
      }, 3000);
      /* Heartbeat is cleared in the on_finish of the EHR trial (see below)
         via the timerInterval cleanup — stored on the closure so on_finish
         can reach it. */
      const _clearHeartbeat = () => { clearInterval(_gazeHeartbeat); try { webgazer.clearGazeListener(); } catch(e) {} };

      const caseStart = performance.now();
      const clickEvents = [];
      const hypState    = [];   // { id, t, text, belief, belief_rated, belief_history[] }
      const evState     = [];   // { id, text, tag }
      const orderedAssessments = [];
      let   currentTab  = "problem";
      /* Accumulate every AOI-geometry snapshot with its timestamp, rather than
         keeping only the latest. Each gaze sample is later matched against the
         snapshot valid at its time (see gazeToDwells). The first snapshot is
         taken after DOM settles (setTimeout below); a new one is pushed on every
         tab switch. */
      const aoiSnapshots = [];
      let   timerInterval;
      /* Track last mouse position so logClick can capture cursor coords */
      let _lastMouseX = null, _lastMouseY = null;
      document.addEventListener("mousemove", (e) => { _lastMouseX = e.clientX; _lastMouseY = e.clientY; }, { passive:true });

      /* timer */
      timerInterval = setInterval(() => {
        const el = document.getElementById("bw_elapsed_"+c.id);
        if (!el) return;
        const sec = Math.floor((performance.now()-caseStart)/1000);
        el.textContent = String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
      }, 1000);

      /* ── Submit gate: track visited tabs + plan selection ── */
      const visitedTabs = new Set(["problem"]);  // problem is shown on load
      let   planSelected = false;
      const REQUIRED_TABS = new Set(["problem", "chart", "library", "plan"]);

      function checkSubmitReady() {
        const allVisited = [...REQUIRED_TABS].every(t => visitedTabs.has(t));
        const hasHyp     = hypState.length > 0;
        const ready      = allVisited && hasHyp && planSelected;
        const submitBtn  = document.getElementById("bw_submit_"+c.id);
        const hintEl     = document.getElementById("bw_submit_hint_"+c.id);
        if (!submitBtn) return;

        if (ready && submitBtn.disabled) {
          /* First time unlocking — enable and pulse once to draw attention */
          submitBtn.disabled = false;
          submitBtn.removeAttribute("aria-disabled");
          submitBtn.classList.add("unlocked");
          submitBtn.addEventListener("animationend", () => submitBtn.classList.remove("unlocked"), { once:true });
          if (hintEl) { hintEl.textContent = "Ready to submit"; hintEl.classList.add("ready"); }
        } else if (!ready) {
          submitBtn.disabled = true;
          submitBtn.setAttribute("aria-disabled","true");
          submitBtn.classList.remove("unlocked");
          if (hintEl) {
            hintEl.classList.remove("ready");
            if (!hasHyp) {
              hintEl.textContent = "Add at least one hypothesis to submit";
            } else if (!allVisited) {
              hintEl.textContent = "Visit all tabs to submit";
            } else {
              hintEl.textContent = "Select an intervention plan to submit";
            }
          }
        }
      }

      /* ── helpers ── */
      /* Actions where gaze is tightly coupled to click position —
         used to feed implicit recalibration samples to WebGazer.
         Excluded: submit, clear, dismiss, slider, remove buttons. */
      const RECALIB_ACTIONS = new Set([
        "tab_switch", "evidence_added", "assessment_ordered",
        "plan_selected", "equip_selected", "library_sent",
        "hypothesis_added", "result_sent"
      ]);

      /* Click events are BEHAVIOURAL RECORDS ONLY — no emic/etic codes.
         An action's location in the interface does not reveal the reasoning
         behind it: clicking the Chart tab does not make the student's thinking
         SCIENTIFIC any more than looking at a paragraph does. Pre-assigning
         codes here would (a) make IRR undefined, since two raters would agree
         100% on a deterministic lookup, and (b) push the interface's own
         structure into the T/ONA network as if it were a finding about
         clinical reasoning.

         Emic/etic codes are applied later, by hand during the pilot and then
         via nCoder regex, to the REASONING ARTEFACTS (hypothesis text,
         evidence excerpts, confidence ratings, assessment and plan
         selections, reasoning summary) and to the RTA transcript — objects
         that contain language a human can interpret and a second rater can
         disagree about. */
      function logClick(aoi, action, detail, x, y) {
        const cx = Math.round(x != null ? x : (_lastMouseX || 0));
        const cy = Math.round(y != null ? y : (_lastMouseY || 0));
        clickEvents.push({
          t:Math.round(performance.now()-caseStart),
          aoi, source:"click", action, detail:detail||null,
          x: cx, y: cy
        });
        /* Implicit recalibration — feed click coordinates back into WebGazer
           as training samples. Only for actions where the participant was
           visually attending to the click target (not programmatic or micro-target
           clicks). Throttled: skip if last recalib was < 500ms ago to avoid
           flooding the regression with correlated samples. */
        if (RECALIB_ACTIONS.has(action) && cx > 0 && cy > 0) {
          try {
            const now = performance.now();
            if (!logClick._lastRecalib || now - logClick._lastRecalib > 500) {
              webgazer.recordScreenPosition(cx, cy, "click");
              logClick._lastRecalib = now;
            }
          } catch(e) {}
        }
      }

      function renderHypotheses() {
        const list = document.getElementById("bw_hyp_list_"+c.id);
        const sel  = document.getElementById("bw_belief_sel_"+c.id);
        if (!list || !sel) return;
        list.innerHTML = hypState.map(h =>
          `<div class="bw-hyp-row" role="listitem">
             <span class="bw-hyp-name" title="${h.text}">${h.text}</span>
             <button class="bw-hyp-rm" data-hyp-id="${h.id}" aria-label="Remove hypothesis: ${h.text}">&times;</button>
           </div>`).join("");
        const curSel = sel.value;
        sel.innerHTML = '<option value="">— Select hypothesis —</option>' +
          hypState.map(h => `<option value="${h.id}" ${h.id==curSel?"selected":""}>${h.text}</option>`).join("");
        /* rebind remove buttons */
        list.querySelectorAll(".bw-hyp-rm").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.hypId;
            const h = hypState.find(x=>x.id===id);
            hypState.splice(hypState.findIndex(x=>x.id===id),1);
            logClick("bw_hyp_panel","hypothesis_removed", h?h.text:id);
            renderHypotheses();
            checkSubmitReady();
          });
        });
      }

      function renderEvidence() {
        const list  = document.getElementById("bw_ev_list_"+c.id);
        const empty = document.getElementById("bw_ev_empty_"+c.id);
        if (!list) return;
        if (evState.length === 0) { list.innerHTML=""; if(empty) empty.style.display="block"; return; }
        if (empty) empty.style.display="none";
        list.innerHTML = evState.map(e =>
          `<div class="bw-ev-item" role="listitem">
             <span class="bw-ev-tag tag-${e.tag}" aria-label="Source: ${e.tag}">${e.tag}</span>
             <span style="font-size:12px;line-height:1.4;">${e.text}</span>
             <button class="bw-ev-rm" data-ev-id="${e.id}" aria-label="Remove evidence: ${e.text.substring(0,40)}">&times;</button>
           </div>`).join("");
        list.querySelectorAll(".bw-ev-rm").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = parseInt(btn.dataset.evId);
            const item = evState.find(x=>x.id===id);
            evState.splice(evState.findIndex(x=>x.id===id),1);
            logClick("bw_ev_panel","evidence_removed", item?item.text.substring(0,40):id);
            renderEvidence();
          });
        });
      }

      /* An evidence entry is a REASONING ARTEFACT — it will be hand-coded in
         the pilot and later by nCoder. It therefore records what a coder needs
         and nothing more: the excerpt text, where it came from, and when.
         source_aoi is PROVENANCE (which paragraph or panel the excerpt was
         taken from), not a reasoning code — a student may pull from the ADL
         paragraph for narrative reasons as easily as scientific ones. */
      function addEvidence(text, tag, aoiId) {
        if (evState.some(e=>e.text===text)) return;
        const item = {
          id: Date.now(),
          t: Math.round(performance.now()-caseStart),
          text, tag,
          source_aoi: aoiId || null
        };
        evState.push(item);
        logClick(aoiId||"bw_ev_panel", "evidence_added", text.substring(0,60));
        renderEvidence();
      }

      /* ── Tab switching ── */
      document.querySelectorAll(".bw-tab[data-case='"+c.id+"']").forEach(btn => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          /* Visual + ARIA state */
          document.querySelectorAll(".bw-tab[data-case='"+c.id+"']").forEach(b => {
            b.classList.remove("active");
            b.setAttribute("aria-selected","false");
          });
          btn.classList.add("active");
          btn.setAttribute("aria-selected","true");
          /* Show/hide panels — use hidden attribute (removes from AT tree) */
          document.querySelectorAll("#bw_root_"+c.id+" .bw-panel").forEach(p => {
            p.classList.remove("active");
            p.setAttribute("hidden","");
          });
          const activePanel = document.getElementById("bw_panel_"+tab+"_"+c.id);
          if (activePanel) { activePanel.classList.add("active"); activePanel.removeAttribute("hidden"); }
          currentTab = tab;
          visitedTabs.add(tab);
          checkSubmitReady();
          aoiSnapshots.push(snapshotAOIRects(c, caseStart));   // re-snapshot on tab change
          const aoiMap = { problem:"bw_panel_problem", chart:"bw_panel_chart", library:"bw_panel_library", plan:"bw_panel_plan" };
          logClick(aoiMap[tab]+"_"+c.id, "tab_switch", tab);
        });
      });

      /* ── Hypothesis add ── */
      const hypAddBtn = document.querySelector(".bw-hyp-add[data-case='"+c.id+"']");
      const hypInput  = document.getElementById("bw_hyp_input_"+c.id);
      function doAddHyp() {
        const text = hypInput.value.trim(); if (!text) return;
        /* t = case-relative onset, so this artefact can be placed on the same
           in-case timeline as evidence entries and RTA segments when coded.
           belief starts at the slider default but belief_rated stays false
           until the participant actually commits a value — otherwise an
           untouched slider is indistinguishable from a deliberate 50. */
        const h = {
          id: String(Date.now()),
          t: Math.round(performance.now()-caseStart),
          text,
          belief: 50,
          belief_rated: false,
          belief_history: []
        };
        hypState.push(h);
        hypInput.value = "";
        logClick("bw_hyp_panel","hypothesis_added",text);
        renderHypotheses();
        checkSubmitReady();
      }
      if (hypAddBtn) hypAddBtn.addEventListener("click", doAddHyp);
      if (hypInput)  hypInput.addEventListener("keydown", e => { if(e.key==="Enter") doAddHyp(); });

      /* ── Confidence meter ──
         What gets coded is the REVISION — did the participant raise or lower
         their confidence, and by how much — not the absolute value. So the
         artefact is a history of committed changes, each carrying from/to/delta.

         Two capture problems this handles:

         1. "input" fires on every pixel of a drag. Logging there would turn one
            deliberate 50->75 adjustment into ~25 events of +1 each: noise in the
            click stream and meaningless deltas. Display updates stay on "input"
            (so the readout tracks the thumb); the RECORD is written on "change",
            which fires once on release.

         2. Keyboard users move the slider one step per arrow press, and each
            press fires its own "change". Consecutive same-direction changes
            within MERGE_MS are therefore merged into the preceding revision
            rather than appended, so a burst of arrow presses reads as one
            revision. Merging happens on write, so there is no pending timer to
            flush if the participant submits immediately.

         belief_rated distinguishes "deliberately set to 50" from "never touched"
         — without it the 50 default is indistinguishable from a real rating. */
      const beliefSel    = document.getElementById("bw_belief_sel_"+c.id);
      const beliefSlider = document.getElementById("bw_belief_slider_"+c.id);
      const beliefVal    = document.getElementById("bw_belief_val_"+c.id);
      const BELIEF_MERGE_MS = 800;

      if (beliefSlider) {
        /* Live display only — never writes to hypState or the click log. */
        beliefSlider.addEventListener("input", () => {
          const val = parseInt(beliefSlider.value);
          if (beliefVal) beliefVal.textContent = "Confidence: "+val+"%";
          const vt = val<=25?"low confidence":val<=50?"moderate confidence":val<=75?"high confidence":"very high confidence";
          beliefSlider.setAttribute("aria-valuenow", val);
          beliefSlider.setAttribute("aria-valuetext", val+"% — "+vt);
        });

        /* Commit — fires once per deliberate adjustment. */
        beliefSlider.addEventListener("change", () => {
          if (!beliefSel || !beliefSel.value) return;
          const h = hypState.find(x => x.id === beliefSel.value);
          if (!h) return;

          const to   = parseInt(beliefSlider.value);
          const from = h.belief_rated ? h.belief : null;   // null = first rating
          if (from === to) return;                          // no-op

          const t = Math.round(performance.now()-caseStart);
          h.belief_history = h.belief_history || [];
          const prev = h.belief_history[h.belief_history.length - 1];
          const delta = from === null ? null : to - from;
          const dir = from === null ? "initial" : (delta > 0 ? "raised" : "lowered");

          /* Merge a same-direction change that lands inside the window. */
          if (prev && prev.direction === dir && dir !== "initial" &&
              (t - prev.t) <= BELIEF_MERGE_MS) {
            prev.to    = to;
            prev.delta = to - prev.from;
            prev.t     = t;
          } else {
            h.belief_history.push({ t, from, to, delta, direction: dir });
          }

          h.belief = to;
          h.belief_rated = true;
          logClick("bw_belief_panel", "belief_" + dir,
                   (beliefSel.options[beliefSel.selectedIndex]?.text || "") +
                   "|" + (from === null ? "-" : from) + "->" + to +
                   "|" + (delta === null ? "-" : (delta > 0 ? "+" : "") + delta));
        });

        /* Switching the target hypothesis snaps the slider to that hypothesis's
           stored value. Setting .value programmatically fires neither "input"
           nor "change", so this cannot manufacture a spurious revision. */
        if (beliefSel) beliefSel.addEventListener("change", () => {
          const h = hypState.find(x=>x.id===beliefSel.value);
          if (h && beliefSlider) { beliefSlider.value=h.belief; if(beliefVal) beliefVal.textContent="Confidence: "+h.belief+"%"; }
        });
      }

      /* ── Free-text highlight → Evidence popover ── */
      (function attachSelectionHandlers() {
        let popover    = null;
        let rafHandle  = null;   // pending rAF for positioning

        function removePopover() {
          if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
          if (popover)   { popover.remove(); popover = null; }
        }

        function positionPopover(rect) {
          /* Called inside rAF — popover is in DOM so offsetWidth/Height are real. */
          const margin = 8;
          const pw = popover.offsetWidth;
          const ph = popover.offsetHeight;
          const vw = window.innerWidth;
          const vh = window.innerHeight;

          /* Prefer above the selection; flip below if insufficient room. */
          let top = rect.top - ph - margin;
          if (top < margin) top = rect.bottom + margin;
          /* Final clamp — keeps it fully on-screen even on small viewports. */
          top = Math.max(margin, Math.min(top, vh - ph - margin));

          let left = rect.left + rect.width / 2 - pw / 2;
          left = Math.max(margin, Math.min(left, vw - pw - margin));

          popover.style.left = left + "px";
          popover.style.top  = top  + "px";
          popover.style.visibility = "visible";
        }

        function showPopover(selectedText, paraEl, paraId, selectionRect) {
          removePopover();

          popover = document.createElement("div");
          popover.id = "bw-sel-popover";
          /* Start invisible so the pre-paint frame isn't visible at 0,0 */
          popover.style.visibility = "hidden";

          const addBtn = document.createElement("button");
          addBtn.textContent = "＋ Add to Evidence";

          const dismissBtn = document.createElement("button");
          dismissBtn.className = "bw-sel-dismiss";
          dismissBtn.innerHTML = "&times;";
          dismissBtn.title = "Dismiss";
          dismissBtn.setAttribute("aria-label", "Dismiss");

          popover.appendChild(addBtn);
          popover.appendChild(dismissBtn);
          document.body.appendChild(popover);

          /* Wait one frame so the browser has painted and offsetWidth is real. */
          rafHandle = requestAnimationFrame(() => {
            rafHandle = null;
            if (!popover) return;   // was removed before frame fired
            positionPopover(selectionRect);
          });

          addBtn.addEventListener("click", () => {
            addEvidence(selectedText, "patient", paraId);
            paraEl.classList.add("para-added");
            try { window.getSelection().removeAllRanges(); } catch(e) {}
            removePopover();
          });

          dismissBtn.addEventListener("click", () => {
            try { window.getSelection().removeAllRanges(); } catch(e) {}
            removePopover();
          });
        }

        /* Attach mouseup to every clinical narrative paragraph. */
        document.querySelectorAll("#bw_root_"+c.id+" .bw-ev-para").forEach(paraEl => {
          const paraId = paraEl.id;

          paraEl.addEventListener("mouseup", () => {
            /*
             * Delay one tick: on some browsers the selection object isn't
             * fully committed at the moment mouseup fires.
             */
            setTimeout(() => {
              try {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) { removePopover(); return; }

                const text = sel.toString().trim();
                if (!text) { removePopover(); return; }

                /* Verify both endpoints of the selection are inside this paragraph.
                   Checking anchorNode alone misses backwards-drag edge cases. */
                const anchor = sel.anchorNode;
                const focus  = sel.focusNode;
                if (!anchor || !focus) { removePopover(); return; }
                if (!paraEl.contains(anchor) && !paraEl.contains(focus)) {
                  removePopover(); return;
                }

                /* Snapshot the rect NOW (before rAF) while the selection range
                   is still guaranteed to exist. */
                const range = sel.getRangeAt(0);
                const rect  = range.getBoundingClientRect();
                if (!rect || (rect.width === 0 && rect.height === 0)) {
                  removePopover(); return;
                }

                showPopover(text, paraEl, paraId, rect);

              } catch(err) {
                /* Silently swallow — never crash the experiment. */
                console.warn("bw-sel mouseup handler:", err);
                removePopover();
              }
            }, 0);
          });
        });

        /* ── Global dismissal listeners ── */

        /* Mousedown outside the popover closes it (capture phase so it fires
           before the next mouseup, preventing flicker on fast clicks). */
        document.addEventListener("mousedown", (e) => {
          if (popover && !popover.contains(e.target)) removePopover();
        }, true);

        /* Scroll in the content pane invalidates the rect we positioned against. */
        const contentPane = document.querySelector("#bw_root_"+c.id+" .bw-content");
        if (contentPane) contentPane.addEventListener("scroll", removePopover, { passive:true });

        /* Keyboard Escape */
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") { removePopover(); try { window.getSelection().removeAllRanges(); } catch(ex) {} }
        });

      })();

      /* ── Clear evidence ── */
      const clearBtn = document.getElementById("bw_clear_ev_"+c.id);
      if (clearBtn) clearBtn.addEventListener("click", () => {
        evState.length = 0;
        logClick("bw_ev_panel","evidence_cleared",null);
        renderEvidence();
        document.querySelectorAll("#bw_root_"+c.id+" .bw-ev-para").forEach(p=>p.classList.remove("para-added"));
        /* Re-enable every "Send to Evidence" source button (assessment results
           and library entries). Clearing the table previously left these stuck
           on "✓ Added"/disabled, so a participant who cleared could never re-add
           chart or library evidence. Restore their original enabled state. */
        document.querySelectorAll("#bw_root_"+c.id+" .bw-result-send").forEach(b => {
          b.disabled = false;
          b.textContent = "+ Send to Evidence";
        });
        document.querySelectorAll("#bw_root_"+c.id+" .bw-lib-send").forEach(b => {
          b.disabled = false;
          b.textContent = "+ Send to Evidence";
        });
      });

      /* ── Assessment cards ── */
      document.querySelectorAll("#bw_root_"+c.id+" .bw-assess-card").forEach(card => {
        /* Keyboard activation for role="button" divs */
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); }
        });

          card.setAttribute("aria-pressed","true");

          const assess   = c.assessments.find(a=>a.id===assessId);
          orderedAssessments.push(assessId);

          const area = document.getElementById("bw_result_area_"+c.id);
          const list = document.getElementById("bw_result_list_"+c.id);
          if (!area || !list || !assess) return;

          const card2 = document.createElement("div");
          card2.className = "bw-result-card";

            <div class="bw-result-body">${assess.result}</div>`;

      });

      /* ── Library send buttons ── */
      c.library.forEach(entry => {
        const btn = document.querySelector(`#bw_root_${c.id} [data-lib-id="${entry.id}"]`);
        if (!btn) return;

        btn.addEventListener("click", () => {

          btn.textContent = "✓ Added";
          btn.disabled = true;
          logClick("bw_panel_library_"+c.id,"library_sent", entry.title);
        });
      });

      /* ── Intervention plan radio + checkboxes ── */
      document.querySelectorAll(`input[name="bw_plan_${c.id}"]`).forEach(r => {
        r.addEventListener("change", () => {
          planSelected = true;
          checkSubmitReady();
          logClick("bw_panel_plan_"+c.id,"plan_selected",r.value);
        });
      });
      document.querySelectorAll("#bw_panel_plan_"+c.id+" input[type='checkbox']").forEach(cb => {
        cb.addEventListener("change", () => {
          logClick("bw_panel_plan_"+c.id,cb.checked?"equip_selected":"equip_deselected",cb.value);
        });
      });

      /* ── Click logging on the three persistent panel regions ── */
      ["bw_hyp_panel","bw_belief_panel","bw_ev_panel"].forEach(panelId => {
        const el = document.getElementById(panelId);
        if (!el) return;
        el.addEventListener("click", () => {
          logClick(panelId, "panel_click", panelId);
        });
      });

      /* ── Submit ── */
      const submitBtn = document.getElementById("bw_submit_"+c.id);
      if (submitBtn) submitBtn.addEventListener("click", async () => {
        submitBtn.dataset.submitted = "true";   // prevents stream-ended handler from re-triggering
        clearInterval(timerInterval);
        _clearHeartbeat();   // stop WebGazer heartbeat
        const pickedPlan  = document.querySelector(`input[name="bw_plan_${c.id}"]:checked`);
        const pickedEquip = [...document.querySelectorAll("#bw_panel_plan_"+c.id+" input[type='checkbox']:checked")].map(cb=>cb.value);
        const summary     = document.getElementById("bw_summary_"+c.id).value.trim();
        logClick("bw_panel_plan_"+c.id,"case_submitted",pickedPlan?pickedPlan.value:"none");
        // Capture viewport dims while still in fullscreen (no browser chrome bias)
        const captureW = window.innerWidth, captureH = window.innerHeight;
        /* Final snapshot at submit time so the last-active layout is captured. */
        aoiSnapshots.push(snapshotAOIRects(c, caseStart));
        await stopScreenRecording(c.id);
        // Exit fullscreen before RTA replay screen
        if (document.fullscreenElement) try { await document.exitFullscreen(); } catch(fe) {}
        jsPsych.finishTrial({
          click_events:        clickEvents,
          aoi_snapshots:       aoiSnapshots,
          hypotheses:          hypState,
          evidence_table:      evState,
          assessments_ordered: orderedAssessments,
          selected_plan:       pickedPlan ? pickedPlan.value : null,
          selected_equipment:  pickedEquip,
          case_summary:        summary,
          captureW, captureH
        });
      });

      /* initial AOI snapshot after DOM settles; also set initial hint text */
      setTimeout(() => {
        aoiSnapshots.push(snapshotAOIRects(c, caseStart));
        checkSubmitReady();
      }, 300);

      /* ── Instruction banner dismiss ── */
      const instrDismiss = document.getElementById("bw_instr_dismiss_"+c.id);
      const instrBanner  = document.getElementById("bw_instr_"+c.id);
      if (instrDismiss && instrBanner) {
        instrDismiss.addEventListener("click", () => {
          instrBanner.style.display = "none";
          logClick("bw_instr_"+c.id, "instructions_dismissed", null);
        });
      }
    },

    on_finish: function (data) {
      study.cases[c.id] = study.cases[c.id] || {};
      study.cases[c.id].click_events        = data.click_events        || [];
      study.cases[c.id].hypotheses          = data.hypotheses          || [];
      study.cases[c.id].evidence_table      = data.evidence_table      || [];
      study.cases[c.id].assessments_ordered = data.assessments_ordered || [];
      study.cases[c.id].selected_plan       = data.selected_plan;
      study.cases[c.id].selected_equipment  = data.selected_equipment  || [];
      study.cases[c.id].case_summary        = data.case_summary        || "";
      study.cases[c.id].choice              = data.selected_plan;      // dashboard compat
      study.cases[c.id].gaze_aois           = c.gaze_aois;
      /* Time-windowed AOI snapshots: array of {t, rects}. Each gaze sample is
         matched against the snapshot valid at its timestamp, so tab switches no
         longer cause the whole case's gaze to be matched against end-of-case
         geometry. */
      const snapshots = data.aoi_snapshots || [];
      study.cases[c.id].aoi_snapshots       = snapshots;
      const dwells = gazeToDwells(data.webgazer_data||[], snapshots);
      study.cases[c.id].gaze_events         = dwells;
      study.cases[c.id].gaze_transitions    = gazeToTransitions(dwells);
      study.cases[c.id]._gaze_raw           = data.webgazer_data       || [];

      /* ── Click stream: same seven-symbol alphabet, second RQA input ── */
      const clickSeq = clickToSequence(study.cases[c.id].click_events || [], c.gaze_aois);
      study.cases[c.id].click_sequence      = clickSeq;
      study.cases[c.id].click_transitions   = clickToTransitions(clickSeq);

      /* ── Participant-level gaze usability, for the pre-registered
            inclusion rule and the gaze-vs-click role switch ── */
      study.cases[c.id].gaze_quality = gazeQualityMetrics(
        data.webgazer_data || [], dwells, snapshots,
        (study.calibration && study.calibration.mean_offset_px) || null
      );

      const taskVp = { w: data.captureW || window.innerWidth, h: data.captureH || window.innerHeight };
      study.cases[c.id].viewport            = taskVp;
      /* Record how much the task viewport differs from the calibration viewport.
         The Chrome "sharing this tab" bar shrinks the task viewport relative to
         calibration; a non-zero height delta quantifies the gaze-y bias for this
         case so it can be corrected or used as an exclusion criterion in R.
         Within-task gaze→AOI matching is unaffected (gaze and AOI rects share
         the task viewport); this delta only affects calibration alignment. */
      const calVp = study.calibration_viewport;
      study.cases[c.id].viewport_vs_calibration = calVp
        ? { calib_w: calVp.w, calib_h: calVp.h,
            task_w: taskVp.w, task_h: taskVp.h,
            dw: taskVp.w - calVp.w, dh: taskVp.h - calVp.h }
        : null;
    }
  };

  /* ── RTA (retrospective think-aloud) — identical pattern to original ── */
  const rtaTrial = {
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    stimulus:`<div style="position:fixed;inset:0;background:#000000;">
        <div style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;background:#ffffff;padding:10px 16px;border:2px solid #1565c0;border-radius:6px;text-align:center;display:flex;align-items:center;gap:14px;white-space:nowrap;">
          <span><strong>Retrospective Review</strong> <span style="color:#c0392b;margin-left:6px;">&#127908; narrate your reasoning as you re-watch</span></span>
          <select id="rta_mic_sel_${c.id}" style="font-size:12px;padding:3px 6px;border:1px solid #9fb3c4;border-radius:4px;color:#16263d;background:#f0f4f8;max-width:200px;" aria-label="Select microphone"></select>
        </div>
        <video id="rv_${c.id}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000000;" muted playsinline></video>
        <canvas id="ro_${c.id}" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"></canvas>
        <!-- Playback progress bar -->
        <div style="position:fixed;bottom:0;left:0;right:0;z-index:10;padding:10px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.75));">
          <div style="display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto;">
            <span id="rta_cur_${c.id}" style="font-size:13px;color:#1d2a38;font-family:'Segoe UI',monospace;min-width:38px;text-align:right;">0:00</span>
            <div style="flex:1;background:rgba(255,255,255,0.2);border-radius:3px;height:5px;overflow:hidden;">
              <div id="rta_bar_${c.id}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Video playback progress" style="height:100%;width:0%;background:#1565c0;border-radius:3px;transition:width 0.25s linear;"></div>
            </div>
            <span id="rta_dur_${c.id}" style="font-size:13px;color:#44545f;font-family:'Segoe UI',monospace;min-width:38px;">-:--</span>
          </div>
        </div>
        <!-- Mic level meter — shows participant mic is active and picking up voice -->
        <div style="position:fixed;bottom:60px;left:24px;z-index:11;display:flex;align-items:center;gap:8px;">
          <span style="font-size:11px;color:#44545f;font-family:'Segoe UI',Arial,sans-serif;">&#127908;</span>
          <div style="width:80px;height:5px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden;">
            <div id="rta_mic_bar_${c.id}" style="height:100%;width:0%;background:#1e8e4e;border-radius:3px;transition:width 0.08s;"></div>
          </div>
        </div>
        <button id="rd_${c.id}" disabled style="position:fixed;bottom:36px;right:24px;z-index:11;padding:14px 28px;background:#5a6470;color:#ffffff;border:none;border-radius:6px;font-weight:700;">Done narrating</button>
      </div>`,
    data: { trial_tag:"rta", case_id:c.id },
    on_finish: function () {
      /* Safety net: guarantee no audio meter interval or silence banner
         survives into the next trial (recalibration), regardless of how the
         RTA ended. The per-trial cleanup fn is stashed on window.__rtaCleanup. */
      try { if (window.__rtaCleanup && window.__rtaCleanup[c.id]) window.__rtaCleanup[c.id](); } catch(e){}
      /* Belt-and-suspenders: remove any stray silence banner by id. */
      const stray = document.getElementById("rta_silence_warn_"+c.id);
      if (stray && stray.parentNode) stray.parentNode.removeChild(stray);
    },
    on_load: async function () {
      const m      = caseMedia[c.id];
      const video  = document.getElementById("rv_"+c.id);
      const canvas = document.getElementById("ro_"+c.id);
      const done   = document.getElementById("rd_"+c.id);
      const rtaBar = document.getElementById("rta_bar_"+c.id);
      const rtaCur = document.getElementById("rta_cur_"+c.id);
      const rtaDur = document.getElementById("rta_dur_"+c.id);
      const ctx    = canvas.getContext("2d");
      /* _gaze_raw retained in study.cases for analytical export but not used in the RTA overlay */
      /* Flatten all time-windowed AOI snapshots into one id->rect lookup for the
         click-flash fallback (used only when a click event lacks x,y). Last
         snapshot wins for a given id; positions here are approximate by design. */
      const _snaps = (study.cases[c.id] && study.cases[c.id].aoi_snapshots) || [];
      const aoiRects = [];
      const _seen = {};
      for (let i = _snaps.length - 1; i >= 0; i--) {
        for (const r of (_snaps[i].rects || [])) {
          if (!_seen[r.id]) { _seen[r.id] = true; aoiRects.push(r); }
        }
      }

      /* ── Progress bar helpers ── */
      function fmtTime(sec) {
        if (!isFinite(sec) || isNaN(sec)) return "-:--";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ":" + String(s).padStart(2, "0");
      }

        const cur = video.currentTime;

          if (rtaDur) rtaDur.textContent = fmtTime(dur);

            rtaBar.style.width = pct.toFixed(2) + "%";
            rtaBar.setAttribute("aria-valuenow", Math.round(pct));
          }

      });

      video.src = m.url;

      let aStream=null, aRec=null, aChunks=[], aStart=0, vStart=0;
      let meterCtx=null, meterTick=null;
      /* Each completed device segment is sealed into its own valid blob with
         the wall-clock time it started. Concatenating WebM chunks from two
         different MediaRecorder sessions produces two glued containers that
         decodeAudioData cannot read past the first — so we keep them separate
         and transcribe each, merging segments by their individual offsets. */
      let priorSegments = [];   // [{ blob, startWall }]
      let segStartWall = 0;     // wall clock when the CURRENT recorder started
      /* Track every interval and the silence banner at trial scope so they can
         be force-cleaned when the trial ends — previously the dismiss-check
         interval and the banner leaked into the next trial (recalibration). */
      let dismissCheckInterval = null;
      let silenceBannerEl = null;

      /* Remove any silence banner and stop the dismiss-check loop. */
      function clearSilenceBanner() {
        if (dismissCheckInterval) { clearInterval(dismissCheckInterval); dismissCheckInterval = null; }

        silenceBannerEl = null;
