/* =====================================================================
   AOI RECT SNAPSHOT  — called at trial start and on each tab switch
   ===================================================================== */
function snapshotAOIRects(caseConfig, caseStart) {
  const rects = [];
  caseConfig.aoi_map.forEach(aoi => {
    const el = document.getElementById(aoi.id) ||
               document.getElementById("bw_panel_" + aoi.id.replace("bw_panel_","") + "_" + caseConfig.id);
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    rects.push({
      id: aoi.id, emic: aoi.emic, etic: aoi.etic, label: aoi.label,
      left:r.left, right:r.right, top:r.top, bottom:r.bottom,
      snapshot_t: Math.round(performance.now() - caseStart)
    });
  });
  return rects;
}

/* =====================================================================
   GAZE → DWELL EVENTS
   Each event in the output represents one unbroken AOI visit:
     t          — onset time (ms from case start)
     aoi        — element id (e.g. "bw_para_h1")
     label      — human-readable AOI name from aoi_map (e.g. "Patient History Para 1")
     emic       — Schell emic code (SCIENTIFIC / NARRATIVE / PRAGMATIC)
     etic       — Winne & Hadwin etic code (TASK-DEF / GOAL-SET / ENACTING / MONITOR)
     dwell_ms   — duration of this AOI visit in milliseconds
     aoi_from   — aoi id of the immediately preceding visit (null for first event)
     aoi_to     — aoi id of the immediately following visit (null for last event, filled by post-pass)
     from_label — human-readable label for aoi_from (null for first event)
     to_label   — human-readable label for aoi_to (filled by post-pass)
     source     — always "gaze"
   ===================================================================== */
function pointToAOI(x, y, rects) {
  for (const r of rects) if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return r;
  return null;
}

function gazeToDwells(samples, rects) {
  /* ── Pass 1: segment raw samples into candidate dwell visits ── */
  const visits = [];   // { aoi, label, emic, etic, start, end }
  let cur = null, curStart = null, lastT = null;

  const sorted = (samples || []).filter(s => s && s.x != null).sort((a, b) => a.t - b.t);

  for (const s of sorted) {
    const hit = pointToAOI(s.x, s.y, rects);
    const aoi = hit ? hit.id : null;

    if (aoi !== cur) {
      if (cur !== null && (lastT - curStart) >= CONFIG.MIN_DWELL_MS) {
        const r = rects.find(rr => rr.id === cur);
        visits.push({
          aoi:   cur,
          label: r ? (r.label || cur) : cur,
          emic:  r ? r.emic : null,
          etic:  r ? r.etic : null,
          start: curStart,
          end:   lastT
        });
      }
      cur = aoi; curStart = s.t;
    }
    lastT = s.t;
  }
  /* Flush final visit */
  if (cur !== null && lastT !== null && (lastT - curStart) >= CONFIG.MIN_DWELL_MS) {
    const r = rects.find(rr => rr.id === cur);
    visits.push({
      aoi:   cur,
      label: r ? (r.label || cur) : cur,
      emic:  r ? r.emic : null,
      etic:  r ? r.etic : null,
      start: curStart,
      end:   lastT
    });
  }

  /* ── Pass 2: keep only coded AOIs, then add dwell_ms + transition fields ── */
  const coded = visits.filter(v => v.emic || v.etic);

  return coded.map((v, i) => {
    const prev = i > 0             ? coded[i - 1] : null;
    const next = i < coded.length - 1 ? coded[i + 1] : null;
    return {
      t:          Math.round(v.start),
      aoi:        v.aoi,
      label:      v.label,
      emic:       v.emic,
      etic:       v.etic,
      dwell_ms:   Math.round(v.end - v.start),
      aoi_from:   prev ? prev.aoi   : null,
      from_label: prev ? prev.label : null,
      aoi_to:     next ? next.aoi   : null,
      to_label:   next ? next.label : null,
      source:     "gaze"
    };
  });
}

/* =====================================================================
   GAZE → TRANSITION SUMMARY
   Extracts all consecutive AOI pairs from the dwell event list as a
   flat array for direct use in transition-rate analysis.
   Each entry: { t, from, from_label, from_emic, from_etic,
                      to,   to_label,   to_emic,   to_etic }
   ===================================================================== */
function gazeToTransitions(dwellEvents) {
  const transitions = [];
  for (let i = 0; i < dwellEvents.length - 1; i++) {
    const a = dwellEvents[i];
    const b = dwellEvents[i + 1];
    /* Only record transitions where the AOI actually changes.
       Same-AOI consecutive entries can appear if a participant briefly
       looks away to an uncoded region and back within MIN_DWELL_MS. */
    if (a.aoi === b.aoi) continue;
    transitions.push({
      t:          a.t + a.dwell_ms,   // transition occurs at end of the departing dwell
      from:       a.aoi,
      from_label: a.label,
      from_emic:  a.emic,
      from_etic:  a.etic,
      to:         b.aoi,
      to_label:   b.label,
      to_emic:    b.emic,
      to_etic:    b.etic
    });
  }
  return transitions;
}

/* =====================================================================
   BIOWORLD TRIAL FACTORY
   ===================================================================== */
function buildBioWorldTrials(c) {

  /* ── Screen-share consent + recording start ── */
  const startRec = {
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    stimulus:`<div style="max-width:680px;margin:9% auto;text-align:left;color:#c8d8e8;font-family:'Segoe UI',Arial,sans-serif;">
        <h2 style="color:#5ab0f0;">Case ${c.id}: ${c.patientName}</h2>
        <p style="font-size:17px;line-height:1.7;">We will record this browser tab while you review the chart, so you can narrate over it afterward. The recording stays on your computer — only transcribed text is uploaded.</p>

        <div style="background:#1d3450;border-left:4px solid #5ab0f0;padding:16px 20px;border-radius:6px;margin:18px 0;">
          <p style="margin:0;font-size:16px;">Click the button below. Your browser will ask you to <strong>select a tab to share</strong> — choose <strong>this experiment's tab</strong> (not Window or Entire Screen). The case will then open in fullscreen automatically.</p>
        </div>

        <button id="rec_${c.id}"
          style="margin-top:6px;padding:14px 30px;background:#27ae60;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;">
          Start Recording &amp; Open Case ${c.id}
        </button>
        <p id="err_${c.id}" style="color:#e05a5a;margin-top:10px;"></p>
      </div>`,
    on_load: function () {
      const recBtn = document.getElementById("rec_"+c.id);
      const errEl  = document.getElementById("err_"+c.id);

      recBtn.addEventListener("click", async () => {
        recBtn.disabled = true;
        try {
          const s = await startScreenRecording(c.id);
          /* Enter fullscreen AFTER the share dialog has resolved —
             avoids macOS Chrome exiting fullscreen to show the picker. */
          try { await document.documentElement.requestFullscreen(); } catch(fe) {
            /* Fullscreen not critical — log and continue */
            console.warn("requestFullscreen after share failed:", fe);
          }
          s.getVideoTracks()[0].addEventListener("ended", () => {
            /* Screen share was stopped by the browser (tab switch, Esc, user revoked
               permission, etc.). Do NOT auto-submit — that would advance the timeline
               silently while the participant may still be mid-case. Instead show a
               prominent warning and require an explicit decision. */
            const sub = document.getElementById("bw_submit_"+c.id);
            if (!sub || sub.dataset.submitted === "true") return;

            const warn = document.createElement("div");
            warn.id = "bw_stream_warn_"+c.id;
            warn.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.82);";
            warn.innerHTML = `
              <div style="background:#1a2332;border:2px solid #e05a5a;border-radius:10px;padding:32px 36px;max-width:500px;text-align:left;font-family:'Segoe UI',Arial,sans-serif;color:#c8d8e8;">
                <h3 style="color:#e05a5a;margin:0 0 14px;">Screen recording stopped</h3>
                <p style="font-size:15px;line-height:1.7;margin:0 0 20px;">
                  The screen recording was interrupted — this usually happens when you switch to another tab or window, or stop sharing from the browser toolbar.
                </p>
                <p style="font-size:15px;line-height:1.7;margin:0 0 24px;">
                  <strong>Your work so far has not been lost.</strong>
                  You can submit what you have completed, or return to the case to finish.
                </p>
                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                  <button id="bw_warn_submit_${c.id}" style="padding:11px 22px;background:#c0392b;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;">
                    Submit case as-is
                  </button>
                  <button id="bw_warn_dismiss_${c.id}" style="padding:11px 22px;background:#1e4a6e;color:#5ab0f0;border:1px solid #2a6090;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;">
                    Return to case
                  </button>
                </div>
              </div>`;
            document.body.appendChild(warn);

            document.getElementById("bw_warn_submit_"+c.id).addEventListener("click", () => {
              warn.remove();
              if (sub && sub.dataset.submitted !== "true") sub.click();
            });
            document.getElementById(`bw_warn_dismiss_${c.id}`).addEventListener("click", () => {
              warn.remove();
              /* Participant continues without a recording for the remainder.
                 Partial gaze and click data collected before the drop is preserved. */
            });
          });
          jsPsych.finishTrial();
        } catch (e) {
          recBtn.disabled = false;
          errEl.textContent = "Screen share cancelled — click Step 2 again and select this experiment's tab from the list.";
        }
      });
    }
  };

  /* ── Main BioWorld EHR trial ── */
  const ehrTrial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: buildBioWorldUI(c),
    choices: "NO_KEYS",
    extensions: [{ type: jsPsychExtensionWebgazer, params:{ targets:["#bw_root_"+c.id] } }],
    data: { trial_tag:"bw_ehr_case", case_id:c.id },

    on_load: function () {
      /* hide live gaze dot */
      try { webgazer.showVideo(false); webgazer.showPredictionPoints(false); } catch(e) {}
      const dot = document.getElementById("webgazerGazeDot"); if (dot) dot.style.display="none";

      /* ── WebGazer heartbeat ──
         Explicitly resume the prediction loop at trial start — it can stall
         after the calibration/validation sequence or if the tab was backgrounded.
         Then poll every 3 seconds; if no prediction has arrived in that window,
         resume() again to restart the internal rAF loop. */
      try { webgazer.resume(); } catch(e) {}
      let _lastGazePrediction = performance.now();
      webgazer.setGazeListener((data) => {
        if (data) _lastGazePrediction = performance.now();
      });
      const _gazeHeartbeat = setInterval(() => {
        const stalledMs = performance.now() - _lastGazePrediction;
        if (stalledMs > 3000) {
          try { webgazer.resume(); } catch(e) {}
        }
      }, 3000);
      /* Heartbeat is cleared in the on_finish of the EHR trial (see below)
         via the timerInterval cleanup — stored on the closure so on_finish
         can reach it. */
      const _clearHeartbeat = () => { clearInterval(_gazeHeartbeat); try { webgazer.clearGazeListener(); } catch(e) {} };

      const caseStart = performance.now();
      const clickEvents = [];
      const hypState    = [];   // { id, text, belief }
      const evState     = [];   // { id, text, tag }
      const orderedAssessments = [];
      let   currentTab  = "problem";
      let   aoiRects    = snapshotAOIRects(c, caseStart);
      let   timerInterval;
      /* Track last mouse position so logClick can capture cursor coords */
      let _lastMouseX = null, _lastMouseY = null;
      document.addEventListener("mousemove", (e) => { _lastMouseX = e.clientX; _lastMouseY = e.clientY; }, { passive:true });

      /* timer */
      timerInterval = setInterval(() => {
        const el = document.getElementById("bw_elapsed_"+c.id);
        if (!el) return;
        const sec = Math.floor((performance.now()-caseStart)/1000);
        el.textContent = String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
      }, 1000);

      /* ── Submit gate: track visited tabs + plan selection ── */
      const visitedTabs = new Set(["problem"]);  // problem is shown on load
      let   planSelected = false;
      const REQUIRED_TABS = new Set(["problem", "chart", "library", "plan"]);

      function checkSubmitReady() {
        const allVisited = [...REQUIRED_TABS].every(t => visitedTabs.has(t));
        const hasHyp     = hypState.length > 0;
        const ready      = allVisited && hasHyp && planSelected;
        const submitBtn  = document.getElementById("bw_submit_"+c.id);
        const hintEl     = document.getElementById("bw_submit_hint_"+c.id);
        if (!submitBtn) return;

        if (ready && submitBtn.disabled) {
          /* First time unlocking — enable and pulse once to draw attention */
          submitBtn.disabled = false;
          submitBtn.removeAttribute("aria-disabled");
          submitBtn.classList.add("unlocked");
          submitBtn.addEventListener("animationend", () => submitBtn.classList.remove("unlocked"), { once:true });
          if (hintEl) { hintEl.textContent = "Ready to submit"; hintEl.classList.add("ready"); }
        } else if (!ready) {
          submitBtn.disabled = true;
          submitBtn.setAttribute("aria-disabled","true");
          submitBtn.classList.remove("unlocked");
          if (hintEl) {
            hintEl.classList.remove("ready");
            if (!hasHyp) {
              hintEl.textContent = "Add at least one hypothesis to submit";
            } else if (!allVisited) {
              hintEl.textContent = "Visit all tabs to submit";
            } else {
              hintEl.textContent = "Select an intervention plan to submit";
            }
          }
        }
      }

      /* ── helpers ── */
      /* Actions where gaze is tightly coupled to click position —
         used to feed implicit recalibration samples to WebGazer.
         Excluded: submit, clear, dismiss, slider, remove buttons. */
      const RECALIB_ACTIONS = new Set([
        "tab_switch", "evidence_added", "assessment_ordered",
        "plan_selected", "equip_selected", "library_sent",
        "hypothesis_added", "result_sent"
      ]);

      function logClick(aoi, emic, etic, action, detail, x, y) {
        const cx = Math.round(x != null ? x : (_lastMouseX || 0));
        const cy = Math.round(y != null ? y : (_lastMouseY || 0));
        clickEvents.push({
          t:Math.round(performance.now()-caseStart),
          aoi, emic, etic, source:"click", action, detail:detail||null,
          x: cx, y: cy
        });
        /* Implicit recalibration — feed click coordinates back into WebGazer
           as training samples. Only for actions where the participant was
           visually attending to the click target (not programmatic or micro-target
           clicks). Throttled: skip if last recalib was < 500ms ago to avoid
           flooding the regression with correlated samples. */
        if (RECALIB_ACTIONS.has(action) && cx > 0 && cy > 0) {
          try {
            const now = performance.now();
            if (!logClick._lastRecalib || now - logClick._lastRecalib > 500) {
              webgazer.recordScreenPosition(cx, cy, "click");
              logClick._lastRecalib = now;
            }
          } catch(e) {}
        }
      }

      function renderHypotheses() {
        const list = document.getElementById("bw_hyp_list_"+c.id);
        const sel  = document.getElementById("bw_belief_sel_"+c.id);
        if (!list || !sel) return;
        list.innerHTML = hypState.map(h =>
          `<div class="bw-hyp-row" role="listitem">
             <span class="bw-hyp-name" title="${h.text}">${h.text}</span>
             <button class="bw-hyp-rm" data-hyp-id="${h.id}" aria-label="Remove hypothesis: ${h.text}">&times;</button>
           </div>`).join("");
        const curSel = sel.value;
        sel.innerHTML = '<option value="">— Select hypothesis —</option>' +
          hypState.map(h => `<option value="${h.id}" ${h.id==curSel?"selected":""}>${h.text}</option>`).join("");
        /* rebind remove buttons */
        list.querySelectorAll(".bw-hyp-rm").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.hypId;
            const h = hypState.find(x=>x.id===id);
            hypState.splice(hypState.findIndex(x=>x.id===id),1);
            logClick("bw_hyp_panel","","GOAL-SET","hypothesis_removed", h?h.text:id);
            renderHypotheses();
            checkSubmitReady();
          });
        });
      }

      function renderEvidence() {
        const list  = document.getElementById("bw_ev_list_"+c.id);
        const empty = document.getElementById("bw_ev_empty_"+c.id);
        if (!list) return;
        if (evState.length === 0) { list.innerHTML=""; if(empty) empty.style.display="block"; return; }
        if (empty) empty.style.display="none";
        list.innerHTML = evState.map(e =>
          `<div class="bw-ev-item" role="listitem">
             <span class="bw-ev-tag tag-${e.tag}" aria-label="Source: ${e.tag}">${e.tag}</span>
             <span style="flex:1;font-size:12px;line-height:1.4;">${e.text}</span>
             <button class="bw-ev-rm" data-ev-id="${e.id}" aria-label="Remove evidence: ${e.text.substring(0,40)}">&times;</button>
           </div>`).join("");
        list.querySelectorAll(".bw-ev-rm").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = parseInt(btn.dataset.evId);
            const item = evState.find(x=>x.id===id);
            evState.splice(evState.findIndex(x=>x.id===id),1);
            logClick("bw_ev_panel","","MONITOR","evidence_removed", item?item.text.substring(0,40):id);
            renderEvidence();
          });
        });
      }

      function addEvidence(text, tag, aoiId, emic, etic) {
        if (evState.some(e=>e.text===text)) return;
        const item = { id:Date.now(), text, tag };
        evState.push(item);
        logClick(aoiId||"bw_ev_panel", emic||"", etic||"MONITOR", "evidence_added", text.substring(0,60));
        renderEvidence();
      }

      /* ── Tab switching ── */
      document.querySelectorAll(".bw-tab[data-case='"+c.id+"']").forEach(btn => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          /* Visual + ARIA state */
          document.querySelectorAll(".bw-tab[data-case='"+c.id+"']").forEach(b => {
            b.classList.remove("active");
            b.setAttribute("aria-selected","false");
          });
          btn.classList.add("active");
          btn.setAttribute("aria-selected","true");
          /* Show/hide panels — use hidden attribute (removes from AT tree) */
          document.querySelectorAll("#bw_root_"+c.id+" .bw-panel").forEach(p => {
            p.classList.remove("active");
            p.setAttribute("hidden","");
          });
          const activePanel = document.getElementById("bw_panel_"+tab+"_"+c.id);
          if (activePanel) { activePanel.classList.add("active"); activePanel.removeAttribute("hidden"); }
          currentTab = tab;
          visitedTabs.add(tab);
          checkSubmitReady();
          aoiRects = snapshotAOIRects(c, caseStart);   // re-snapshot on tab change
          const aoiMap = { problem:"bw_panel_problem", chart:"bw_panel_chart", library:"bw_panel_library", plan:"bw_panel_plan" };
          const emicMap = { problem:"NARRATIVE", chart:"SCIENTIFIC", library:"SCIENTIFIC", plan:"PRAGMATIC" };
          const eticMap = { problem:"TASK-DEF", chart:"ENACTING", library:"ENACTING", plan:"ENACTING" };
          logClick(aoiMap[tab]+"_"+c.id, emicMap[tab]||"", eticMap[tab]||"ENACTING", "tab_switch", tab);
        });
      });

      /* ── Hypothesis add ── */
      const hypAddBtn = document.querySelector(".bw-hyp-add[data-case='"+c.id+"']");
      const hypInput  = document.getElementById("bw_hyp_input_"+c.id);
      function doAddHyp() {
        const text = hypInput.value.trim(); if (!text) return;
        const h = { id: String(Date.now()), text, belief:50 };
        hypState.push(h);
        hypInput.value = "";
        logClick("bw_hyp_panel","","GOAL-SET","hypothesis_added",text);
        renderHypotheses();
        checkSubmitReady();
      }
      if (hypAddBtn) hypAddBtn.addEventListener("click", doAddHyp);
      if (hypInput)  hypInput.addEventListener("keydown", e => { if(e.key==="Enter") doAddHyp(); });

      /* ── Belief meter ── */
      const beliefSel    = document.getElementById("bw_belief_sel_"+c.id);
      const beliefSlider = document.getElementById("bw_belief_slider_"+c.id);
      const beliefVal    = document.getElementById("bw_belief_val_"+c.id);
      if (beliefSlider) {
        beliefSlider.addEventListener("input", () => {
          const val = parseInt(beliefSlider.value);
          if (beliefVal) beliefVal.textContent = "Confidence: "+val+"%";
          const vt = val<=25?"low confidence":val<=50?"moderate confidence":val<=75?"high confidence":"very high confidence";
          beliefSlider.setAttribute("aria-valuenow", val);
          beliefSlider.setAttribute("aria-valuetext", val+"% — "+vt);
          if (beliefSel && beliefSel.value) {
            const h = hypState.find(x=>x.id===beliefSel.value);
            if (h) {
              h.belief = val;
              logClick("bw_belief_panel","","GOAL-SET","belief_updated", beliefSel.options[beliefSel.selectedIndex]?.text+":"+val+"%");
            }
          }
        });
        if (beliefSel) beliefSel.addEventListener("change", () => {
          const h = hypState.find(x=>x.id===beliefSel.value);
          if (h && beliefSlider) { beliefSlider.value=h.belief; if(beliefVal) beliefVal.textContent="Confidence: "+h.belief+"%"; }
        });
      }

      /* ── Free-text highlight → Evidence popover ── */
      (function attachSelectionHandlers() {
        let popover    = null;
        let rafHandle  = null;   // pending rAF for positioning

        function removePopover() {
          if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
          if (popover)   { popover.remove(); popover = null; }
        }

        function positionPopover(rect) {
          /* Called inside rAF — popover is in DOM so offsetWidth/Height are real. */
          const margin = 8;
          const pw = popover.offsetWidth;
          const ph = popover.offsetHeight;
          const vw = window.innerWidth;
          const vh = window.innerHeight;

          /* Prefer above the selection; flip below if insufficient room. */
          let top = rect.top - ph - margin;
          if (top < margin) top = rect.bottom + margin;
          /* Final clamp — keeps it fully on-screen even on small viewports. */
          top = Math.max(margin, Math.min(top, vh - ph - margin));

          let left = rect.left + rect.width / 2 - pw / 2;
          left = Math.max(margin, Math.min(left, vw - pw - margin));

          popover.style.left = left + "px";
          popover.style.top  = top  + "px";
          popover.style.visibility = "visible";
        }

        function showPopover(selectedText, paraEl, paraId, selectionRect) {
          removePopover();

          popover = document.createElement("div");
          popover.id = "bw-sel-popover";
          /* Start invisible so the pre-paint frame isn't visible at 0,0 */
          popover.style.visibility = "hidden";

          const addBtn = document.createElement("button");
          addBtn.textContent = "＋ Add to Evidence";

          const dismissBtn = document.createElement("button");
          dismissBtn.className = "bw-sel-dismiss";
          dismissBtn.innerHTML = "&times;";
          dismissBtn.title = "Dismiss";
          dismissBtn.setAttribute("aria-label", "Dismiss");

          popover.appendChild(addBtn);
          popover.appendChild(dismissBtn);
          document.body.appendChild(popover);

          /* Wait one frame so the browser has painted and offsetWidth is real. */
          rafHandle = requestAnimationFrame(() => {
            rafHandle = null;
            if (!popover) return;   // was removed before frame fired
            positionPopover(selectionRect);
          });

          addBtn.addEventListener("click", () => {
            const aoi = c.aoi_map.find(a => a.id === paraId);
            addEvidence(
              selectedText, "patient", paraId,
              aoi ? aoi.emic : "NARRATIVE",
              aoi ? aoi.etic : "TASK-DEF"
            );
            paraEl.classList.add("para-added");
            try { window.getSelection().removeAllRanges(); } catch(e) {}
            removePopover();
          });

          dismissBtn.addEventListener("click", () => {
            try { window.getSelection().removeAllRanges(); } catch(e) {}
            removePopover();
          });
        }

        /* Attach mouseup to every clinical narrative paragraph. */
        document.querySelectorAll("#bw_root_"+c.id+" .bw-ev-para").forEach(paraEl => {
          const paraId = paraEl.id;

          paraEl.addEventListener("mouseup", () => {
            /*
             * Delay one tick: on some browsers the selection object isn't
             * fully committed at the moment mouseup fires.
             */
            setTimeout(() => {
              try {
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0) { removePopover(); return; }

                const text = sel.toString().trim();
                if (!text) { removePopover(); return; }

                /* Verify both endpoints of the selection are inside this paragraph.
                   Checking anchorNode alone misses backwards-drag edge cases. */
                const anchor = sel.anchorNode;
                const focus  = sel.focusNode;
                if (!anchor || !focus) { removePopover(); return; }
                if (!paraEl.contains(anchor) && !paraEl.contains(focus)) {
                  removePopover(); return;
                }

                /* Snapshot the rect NOW (before rAF) while the selection range
                   is still guaranteed to exist. */
                const range = sel.getRangeAt(0);
                const rect  = range.getBoundingClientRect();
                if (!rect || (rect.width === 0 && rect.height === 0)) {
                  removePopover(); return;
                }

                showPopover(text, paraEl, paraId, rect);

              } catch(err) {
                /* Silently swallow — never crash the experiment. */
                console.warn("bw-sel mouseup handler:", err);
                removePopover();
              }
            }, 0);
          });
        });

        /* ── Global dismissal listeners ── */

        /* Mousedown outside the popover closes it (capture phase so it fires
           before the next mouseup, preventing flicker on fast clicks). */
        document.addEventListener("mousedown", (e) => {
          if (popover && !popover.contains(e.target)) removePopover();
        }, true);

        /* Scroll in the content pane invalidates the rect we positioned against. */
        const contentPane = document.querySelector("#bw_root_"+c.id+" .bw-content");
        if (contentPane) contentPane.addEventListener("scroll", removePopover, { passive:true });

        /* Keyboard Escape */
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") { removePopover(); try { window.getSelection().removeAllRanges(); } catch(ex) {} }
        });

      })();

      /* ── Clear evidence ── */
      const clearBtn = document.getElementById("bw_clear_ev_"+c.id);
      if (clearBtn) clearBtn.addEventListener("click", () => {
        evState.length = 0;
        logClick("bw_ev_panel","","MONITOR","evidence_cleared",null);
        renderEvidence();
        document.querySelectorAll("#bw_root_"+c.id+" .bw-ev-para").forEach(p=>p.classList.remove("para-added"));
      });

      /* ── Assessment cards ── */
      document.querySelectorAll("#bw_root_"+c.id+" .bw-assess-card").forEach(card => {
        /* Keyboard activation for role="button" divs */
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); }
        });
        card.addEventListener("click", () => {
          if (card.classList.contains("ordered")) return;
          card.classList.add("ordered");
          card.setAttribute("aria-label", (card.getAttribute("aria-label")||"").replace("Click to order this assessment.","Already ordered."));
          card.setAttribute("aria-pressed","true");
          const assessId = card.dataset.assessId;
          const assess   = c.assessments.find(a=>a.id===assessId);
          orderedAssessments.push(assessId);
          logClick("bw_panel_chart_"+c.id,"SCIENTIFIC","ENACTING","assessment_ordered", assess?assess.name:assessId);

          const area = document.getElementById("bw_result_area_"+c.id);
          const list = document.getElementById("bw_result_list_"+c.id);
          if (!area || !list || !assess) return;
          area.classList.add("visible");
          const card2 = document.createElement("div");
          card2.className = "bw-result-card";
          card2.innerHTML = `<div class="bw-result-title">${assess.fullName}</div>
            <div class="bw-result-body">${assess.result}</div>`;
          const sendBtn = document.createElement("button");
          sendBtn.className = "bw-result-send";
          sendBtn.textContent = "+ Send to Evidence";
          sendBtn._evidenceText = assess.name+": "+assess.result;
          sendBtn.addEventListener("click", () => {
            addEvidence(sendBtn._evidenceText, "assess", "bw_panel_chart_"+c.id, "SCIENTIFIC","ENACTING");
            sendBtn.textContent = "✓ Added";
            sendBtn.disabled = true;
          });
          card2.appendChild(sendBtn);
          list.appendChild(card2);
          logClick("bw_panel_chart_"+c.id,"SCIENTIFIC","ENACTING","assessment_result_shown", assess.name);
        });
      });

      /* ── Library send buttons ── */
      c.library.forEach(entry => {
        const btn = document.querySelector(`#bw_root_${c.id} [data-lib-id="${entry.id}"]`);
        if (!btn) return;
        btn._evidenceText = entry.title+": "+entry.body.substring(0,120)+"...";
        btn.addEventListener("click", () => {
          addEvidence(btn._evidenceText, "obs", "bw_panel_library_"+c.id, "SCIENTIFIC","ENACTING");
          btn.textContent = "✓ Added";
          btn.disabled = true;
          logClick("bw_panel_library_"+c.id,"SCIENTIFIC","ENACTING","library_sent", entry.title);
        });
      });

      /* ── Intervention plan radio + checkboxes ── */
      document.querySelectorAll(`input[name="bw_plan_${c.id}"]`).forEach(r => {
        r.addEventListener("change", () => {
          planSelected = true;
          checkSubmitReady();
          logClick("bw_panel_plan_"+c.id,"PRAGMATIC","ENACTING","plan_selected",r.value);
        });
      });
      document.querySelectorAll("#bw_panel_plan_"+c.id+" input[type='checkbox']").forEach(cb => {
        cb.addEventListener("change", () => {
          logClick("bw_panel_plan_"+c.id,"PRAGMATIC","ENACTING",cb.checked?"equip_selected":"equip_deselected",cb.value);
        });
      });

      /* ── AOI click logging on left panel regions ── */
      ["bw_hyp_panel","bw_belief_panel","bw_ev_panel"].forEach(panelId => {
        const el = document.getElementById(panelId);
        if (!el) return;
        const aoi = c.aoi_map.find(a=>a.id===panelId);
        el.addEventListener("click", () => {
          logClick(panelId, aoi?aoi.emic:"", aoi?aoi.etic:"GOAL-SET","panel_click",panelId);
        });
      });

      /* ── Submit ── */
      const submitBtn = document.getElementById("bw_submit_"+c.id);
      if (submitBtn) submitBtn.addEventListener("click", async () => {
        submitBtn.dataset.submitted = "true";   // prevents stream-ended handler from re-triggering
        clearInterval(timerInterval);
        _clearHeartbeat();   // stop WebGazer heartbeat
        const pickedPlan  = document.querySelector(`input[name="bw_plan_${c.id}"]:checked`);
        const pickedEquip = [...document.querySelectorAll("#bw_panel_plan_"+c.id+" input[type='checkbox']:checked")].map(cb=>cb.value);
        const summary     = document.getElementById("bw_summary_"+c.id).value.trim();
        logClick("bw_panel_plan_"+c.id,"PRAGMATIC","ENACTING","case_submitted",pickedPlan?pickedPlan.value:"none");
        // Capture viewport dims while still in fullscreen (no browser chrome bias)
        const captureW = window.innerWidth, captureH = window.innerHeight;
        await stopScreenRecording(c.id);
        // Exit fullscreen before RTA replay screen
        if (document.fullscreenElement) try { await document.exitFullscreen(); } catch(fe) {}
        jsPsych.finishTrial({
          click_events:        clickEvents,
          aoi_rects:           aoiRects,
          hypotheses:          hypState,
          evidence_table:      evState,
          assessments_ordered: orderedAssessments,
          selected_plan:       pickedPlan ? pickedPlan.value : null,
          selected_equipment:  pickedEquip,
          case_summary:        summary,
          captureW, captureH
        });
      });

      /* initial AOI snapshot after DOM settles; also set initial hint text */
      setTimeout(() => {
        aoiRects = snapshotAOIRects(c, caseStart);
        checkSubmitReady();
      }, 300);

      /* ── Instruction banner dismiss ── */
      const instrDismiss = document.getElementById("bw_instr_dismiss_"+c.id);
      const instrBanner  = document.getElementById("bw_instr_"+c.id);
      if (instrDismiss && instrBanner) {
        instrDismiss.addEventListener("click", () => {
          instrBanner.style.display = "none";
          logClick("bw_instr_"+c.id, "", "TASK-DEF", "instructions_dismissed", null);
        });
      }
    },

    on_finish: function (data) {
      study.cases[c.id] = study.cases[c.id] || {};
      study.cases[c.id].click_events        = data.click_events        || [];
      study.cases[c.id].hypotheses          = data.hypotheses          || [];
      study.cases[c.id].evidence_table      = data.evidence_table      || [];
      study.cases[c.id].assessments_ordered = data.assessments_ordered || [];
      study.cases[c.id].selected_plan       = data.selected_plan;
      study.cases[c.id].selected_equipment  = data.selected_equipment  || [];
      study.cases[c.id].case_summary        = data.case_summary        || "";
      study.cases[c.id].choice              = data.selected_plan;      // dashboard compat
      study.cases[c.id].aoi_map             = c.aoi_map;
      study.cases[c.id].aoi_rects           = data.aoi_rects           || [];
      const dwells = gazeToDwells(data.webgazer_data||[], data.aoi_rects||[]);
      study.cases[c.id].gaze_events         = dwells;
      study.cases[c.id].gaze_transitions    = gazeToTransitions(dwells);
      study.cases[c.id]._gaze_raw           = data.webgazer_data       || [];
      study.cases[c.id].viewport            = { w: data.captureW || window.innerWidth, h: data.captureH || window.innerHeight };
    }
  };

  /* ── RTA (retrospective think-aloud) — identical pattern to original ── */
  const rtaTrial = {
    type: jsPsychHtmlKeyboardResponse, choices:"NO_KEYS",
    stimulus:`<div style="position:fixed;inset:0;background:#000;">
        <div style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;background:#fff;padding:10px 16px;border:2px solid #2b9fd6;border-radius:6px;text-align:center;">
          <strong>Retrospective Review</strong> <span style="color:#c0392b;margin-left:8px;">&#127908; narrate your reasoning as you re-watch</span></div>
        <video id="rv_${c.id}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;" muted playsinline></video>
        <canvas id="ro_${c.id}" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"></canvas>
        <!-- Playback progress bar -->
        <div style="position:fixed;bottom:0;left:0;right:0;z-index:10;padding:10px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.75));">
          <div style="display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto;">
            <span id="rta_cur_${c.id}" style="font-size:13px;color:#cdd9e5;font-family:'Segoe UI',monospace;min-width:38px;text-align:right;">0:00</span>
            <div style="flex:1;background:rgba(255,255,255,0.2);border-radius:3px;height:5px;overflow:hidden;">
              <div id="rta_bar_${c.id}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Video playback progress" style="height:100%;width:0%;background:#2b9fd6;border-radius:3px;transition:width 0.25s linear;"></div>
            </div>
            <span id="rta_dur_${c.id}" style="font-size:13px;color:#8aa0b6;font-family:'Segoe UI',monospace;min-width:38px;">-:--</span>
          </div>
        </div>
        <!-- Mic level meter — shows participant mic is active and picking up voice -->
        <div style="position:fixed;bottom:60px;left:24px;z-index:11;display:flex;align-items:center;gap:8px;">
          <span style="font-size:11px;color:#8aa0b6;font-family:'Segoe UI',Arial,sans-serif;">&#127908;</span>
          <div style="width:80px;height:5px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden;">
            <div id="rta_mic_bar_${c.id}" style="height:100%;width:0%;background:#27ae60;border-radius:3px;transition:width 0.08s;"></div>
          </div>
        </div>
        <button id="rd_${c.id}" disabled style="position:fixed;bottom:36px;right:24px;z-index:11;padding:14px 28px;background:#7f8c8d;color:#fff;border:none;border-radius:6px;font-weight:700;">Done narrating</button>
      </div>`,
    data: { trial_tag:"rta", case_id:c.id },
    on_load: async function () {
      const m      = caseMedia[c.id];
      const video  = document.getElementById("rv_"+c.id);
      const canvas = document.getElementById("ro_"+c.id);
      const done   = document.getElementById("rd_"+c.id);
      const rtaBar = document.getElementById("rta_bar_"+c.id);
      const rtaCur = document.getElementById("rta_cur_"+c.id);
      const rtaDur = document.getElementById("rta_dur_"+c.id);
      const ctx    = canvas.getContext("2d");
      /* _gaze_raw retained in study.cases for analytical export but not used in the RTA overlay */
      const aoiRects = (study.cases[c.id] && study.cases[c.id].aoi_rects) || [];

      /* ── Progress bar helpers ── */
      function fmtTime(sec) {
        if (!isFinite(sec) || isNaN(sec)) return "-:--";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ":" + String(s).padStart(2, "0");
      }
      function updateBar() {
        const dur = video.duration;
        const cur = video.currentTime;
        if (rtaCur) rtaCur.textContent = fmtTime(cur);
        if (isFinite(dur) && dur > 0) {
          if (rtaDur) rtaDur.textContent = fmtTime(dur);
          const pct = Math.min(100, (cur / dur) * 100);
          if (rtaBar) {
            rtaBar.style.width = pct.toFixed(2) + "%";
            rtaBar.setAttribute("aria-valuenow", Math.round(pct));
          }
        }
      }
      video.addEventListener("loadedmetadata", updateBar);
      video.addEventListener("timeupdate",     updateBar);
      video.addEventListener("ended", () => {
        if (rtaBar) rtaBar.style.width = "100%";
        if (rtaCur && isFinite(video.duration)) rtaCur.textContent = fmtTime(video.duration);
      });


      if (!m || !m.url) { study.cases[c.id].transcript_segments=[]; return jsPsych.finishTrial(); }
      video.src = m.url;

      let aStream=null, aRec=null, aChunks=[], aStart=0, vStart=0;
      try {
        aStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            /* Disable voice-call processing — these are designed for WebRTC
               calls, not transcription. echoCancellation and noiseSuppression
               in particular actively suppress or distort speech in ways that
               cause Whisper to hallucinate rather than transcribe. */
            echoCancellation:   false,
            noiseSuppression:   false,
            autoGainControl:    false,
            /* Prefer high sample rate — we resample to 16kHz in transcribeBlob
               via OfflineAudioContext, so native quality is better raw input. */
            sampleRate:         { ideal: 48000 }
          }
        });
        aRec    = new MediaRecorder(aStream);
        /* Collect chunks every second — more resilient than waiting for a single
           ondataavailable event on stop() in case of unexpected interruption. */
        aRec.ondataavailable = e => { if(e.data && e.data.size) aChunks.push(e.data); };
        /* Start recording immediately — do not wait for the play event.
           The play event can fire within the same microtask as video.play(),
           before the listener is guaranteed to have run on all browsers.
           Leading silence before the video plays is trimmed by Whisper. */
        aRec.start(1000);
        aStart = performance.now();

        /* Live mic level meter — visual confirmation mic is active.
           Uses an AnalyserNode on the stream; no audio is played back. */
        try {
          const meterCtx  = new (window.AudioContext || window.webkitAudioContext)();
          const analyser  = meterCtx.createAnalyser();
          analyser.fftSize = 256;
          meterCtx.createMediaStreamSource(aStream).connect(analyser);
          const meterBuf  = new Uint8Array(analyser.frequencyBinCount);
          const micBar    = document.getElementById("rta_mic_bar_"+c.id);
          const meterTick = setInterval(() => {
            if (!micBar) { clearInterval(meterTick); return; }
            analyser.getByteFrequencyData(meterBuf);
            const avg = meterBuf.reduce((s, v) => s + v, 0) / meterBuf.length;
            micBar.style.width = Math.min(100, avg * 2.5).toFixed(1) + "%";
          }, 80);
          /* Clean up meter when Done is clicked */
          done.addEventListener("click", () => {
            clearInterval(meterTick);
            try { meterCtx.close(); } catch(e) {}
          }, { once: true });
        } catch(meterErr) {
          /* Non-critical — meter failure doesn't affect recording */
          console.warn("mic meter failed:", meterErr);
        }

      } catch(e) {
        console.error("mic failed", e);
        /* Non-blocking banner — participant must know their narration isn't being captured */
        const micWarn = document.createElement("div");
        micWarn.style.cssText = "position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:20;background:#3a1010;border:2px solid #e05a5a;border-radius:8px;padding:12px 20px;color:#f0b0b0;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;text-align:center;max-width:520px;line-height:1.6;";
        micWarn.innerHTML = "<strong>Microphone access was denied.</strong><br>Your narration cannot be recorded. Please check your browser microphone permissions, then reload and try again.";
        document.body.appendChild(micWarn);
      }

      /* ── Click flash state ──
         Each active flash: { cx, cy, born, fromAOI }
         born = video timestamp (ms) when the click occurred
         cx/cy = canvas coords of the element center that was clicked   */
      const activeFlashes = [];
      const FLASH_DURATION_MS = 600;   // how long the ripple animates

      /* Pre-index click events by AOI so we can look them up by video time */
      const clickEventsForCase = (study.cases[c.id] && study.cases[c.id].click_events) || [];

      function loop() {
        if (video.paused || video.ended) return;
        canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const tMs=video.currentTime*1000;

        // Letterbox-aware scaling using stored fullscreen viewport dims.
        // This ensures AOI highlights land on the video content, not the
        // black bars, regardless of the participant's screen size or DPR.
        const vp=(study.cases[c.id]&&study.cases[c.id].viewport)||{w:window.innerWidth,h:window.innerHeight};
        const cW=canvas.width, cH=canvas.height;
        const vidAspect=vp.w/vp.h, canAspect=cW/cH;
        let drawW, drawH, offX=0, offY=0;
        if (vidAspect>canAspect) { drawW=cW; drawH=cW/vidAspect; offY=(cH-drawH)/2; }
        else { drawH=cH; drawW=cH*vidAspect; offX=(cW-drawW)/2; }
        const sx=drawW/vp.w, sy=drawH/vp.h;

        /* ── Trigger new click flashes ──
           For each click event whose timestamp falls within the last frame's
           worth of video time (~16ms window), spawn a flash on that AOI's rect. */
        const FRAME_MS = 20;
        clickEventsForCase.forEach(ev => {
          if (ev.t > tMs - FRAME_MS && ev.t <= tMs && !ev._flashed) {
            ev._flashed = true;
            /* Prefer stored x,y if available; fall back to AOI rect center */
            let cx, cy;
            if (ev.x && ev.y) {
              cx = offX + ev.x * sx;
              cy = offY + ev.y * sy;
            } else {
              const rect = aoiRects.find(r => r.id === ev.aoi);
              if (rect) {
                cx = offX + ((rect.left + rect.right) / 2) * sx;
                cy = offY + ((rect.top  + rect.bottom) / 2) * sy;
              }
            }
            if (cx != null && cy != null) {
              activeFlashes.push({ cx, cy, born: tMs });
            }
          }
        });

        /* ── Cursor position from click events ──
           Gaze dot removed — WebGazer accuracy drifts enough during a session
           that a floating dot frequently misleads rather than orients.
           Mouse cursor position (stored on every click event) is reliable and
           accurate. We find the most recent click event at or before tMs and
           use its x,y as the cursor position. Between clicks the cursor is
           shown at the last known position with a gentle fade to indicate
           it hasn't moved recently. */
        const cursorEvents = clickEventsForCase.filter(ev => ev.x && ev.y && ev.t <= tMs);
        const lastCursorEv = cursorEvents.length > 0 ? cursorEvents[cursorEvents.length - 1] : null;
        let curX = null, curY = null, curAge = null;
        if (lastCursorEv) {
          curX   = offX + lastCursorEv.x * sx;
          curY   = offY + lastCursorEv.y * sy;
          curAge = tMs - lastCursorEv.t;
        }

        /* ── Draw click flash ripples ──
           Each flash is a pair of expanding concentric rings that fade out.
           Inner ring: white; outer ring: yellow. Both fade over FLASH_DURATION_MS. */
        for (let i = activeFlashes.length - 1; i >= 0; i--) {
          const f = activeFlashes[i];
          const age = tMs - f.born;
          if (age > FLASH_DURATION_MS) { activeFlashes.splice(i, 1); continue; }
          const progress = age / FLASH_DURATION_MS;
          const eased    = 1 - Math.pow(1 - progress, 2);
          const alpha    = 1 - progress;

          /* Outer ripple ring — expands from 18px to 52px */
          const r1 = 18 + eased * 34;
          ctx.beginPath(); ctx.arc(f.cx, f.cy, r1, 0, 2*Math.PI);
          ctx.strokeStyle = `rgba(255,212,0,${alpha * 0.9})`;
          ctx.lineWidth   = 3;
          ctx.stroke();

          /* Inner ripple ring — expands from 10px to 28px */
          const r2 = 10 + eased * 18;
          ctx.beginPath(); ctx.arc(f.cx, f.cy, r2, 0, 2*Math.PI);
          ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.7})`;
          ctx.lineWidth   = 2;
          ctx.stroke();

          /* Static filled dot at center */
          ctx.beginPath(); ctx.arc(f.cx, f.cy, 7, 0, 2*Math.PI);
          ctx.fillStyle   = `rgba(255,212,0,${alpha})`;
          ctx.fill();
          ctx.strokeStyle = `rgba(0,0,0,${alpha * 0.5})`;
          ctx.lineWidth   = 1.5;
          ctx.stroke();
        }

        /* ── Draw cursor ring at last known mouse position ──
           Fades slightly if no click has fired recently (cursor idle),
           so participants understand it's a position marker, not a live pointer.
           Disappears entirely after 10 seconds of no recorded click activity
           to avoid a stale dot being misleading. */
        if (curX != null && curAge < 10000) {
          const idleAlpha = curAge < 2000 ? 1 : Math.max(0.25, 1 - (curAge - 2000) / 8000);

          /* Outer ring */
          ctx.beginPath(); ctx.arc(curX, curY, 18, 0, 2*Math.PI);
          ctx.strokeStyle = `rgba(255,212,0,${0.55 * idleAlpha})`;
          ctx.lineWidth   = 2;
          ctx.stroke();

          /* Inner filled dot */
          ctx.beginPath(); ctx.arc(curX, curY, 7, 0, 2*Math.PI);
          ctx.fillStyle   = `rgba(255,212,0,${0.85 * idleAlpha})`;
          ctx.strokeStyle = `rgba(0,0,0,${0.5 * idleAlpha})`;
          ctx.lineWidth   = 1.5;
          ctx.fill(); ctx.stroke();
        }

        requestAnimationFrame(loop);
      }

      video.addEventListener("play",()=>{
        vStart=performance.now();
        /* aRec already started above — recording began before video play to
           avoid missing the first words. vStart is used for offset calculation. */
        /* Reset flash flags so replays work correctly */
        clickEventsForCase.forEach(ev => { delete ev._flashed; });
        activeFlashes.length = 0;
        requestAnimationFrame(loop);
      });
      let videoHasPlayed = false;
      video.addEventListener("play",    () => { videoHasPlayed = true; });
      video.addEventListener("ended",   () => {
        if (videoHasPlayed) { done.disabled=false; done.style.background="#27ae60"; }
      });
      /* Safety unlock: after RTA_MAX_SECONDS, enable Done regardless —
         but only if the video actually started playing at some point. */
      setTimeout(() => {
        if (videoHasPlayed && done.disabled) {
          done.disabled=false; done.style.background="#27ae60";
        }
      }, CONFIG.RTA_MAX_SECONDS*1000);
      try {
        await video.play();
      } catch(e) {
        /* video.play() rejected — blob may have failed to load.
           Show an error rather than silently enabling Done with no video. */
        console.error("RTA video.play() failed:", e);
        const errDiv = document.createElement("div");
        errDiv.style.cssText = "position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:20;background:#3a1010;border:2px solid #e05a5a;border-radius:8px;padding:14px 22px;color:#f0b0b0;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;text-align:center;max-width:500px;";
        errDiv.innerHTML = "<strong>Recording could not be loaded for playback.</strong><br>Click Done to continue — your typed responses and interaction data are still saved.";
        document.body.appendChild(errDiv);
        done.disabled=false; done.style.background="#e07030";
      }

      done.addEventListener("click", async () => {
        done.disabled=true; done.textContent="Saving…";
        try { video.pause(); } catch(e){}
        const offset=(aStart-vStart)/1000;

        /* Progress indicator — worker runs off main thread so UI stays responsive */
        const progressDiv = document.createElement("div");
        progressDiv.style.cssText = "position:fixed;bottom:80px;right:24px;z-index:20;background:#16263d;color:#cdd9e5;padding:14px 20px;border-radius:8px;border:1px solid #2b9fd6;font-size:14px;font-family:'Segoe UI',Arial,sans-serif;max-width:340px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4);";
        progressDiv.innerHTML = `
          <div style="font-weight:600;margin-bottom:6px;">&#127908; Transcribing narration…</div>
          <div style="font-size:12px;color:#8aa0b6;margin-bottom:10px;">Running locally. Page stays responsive.</div>
          <div style="background:#0f1923;border-radius:4px;height:6px;overflow:hidden;">
            <div id="trans_bar" style="background:#2b9fd6;height:100%;width:0%;transition:width .4s;border-radius:4px;"></div>
          </div>
          <div id="trans_pct" style="font-size:12px;color:#5ab0f0;margin-top:6px;">0%</div>`;
        document.body.appendChild(progressDiv);

        /* Poll worker progress into the bar */
        const barInterval = setInterval(() => {
          const bar = document.getElementById("trans_bar");
          const pct = document.getElementById("trans_pct");
          if (bar) bar.style.width = __modelProgress + "%";
          if (pct) pct.textContent  = __modelProgress + "%";
        }, 300);

        const finalize = async (blob) => {
          clearInterval(barInterval);
          if (progressDiv.parentNode) progressDiv.parentNode.removeChild(progressDiv);

          let segs = [];
          if (blob && blob.size) {
            try {
              const out = await transcribeBlob(blob);   /* non-blocking — runs in worker */
              segs = (out.chunks || []).map(ch => {
                const [s, e] = ch.timestamp || [null, null];
                return {
                  start_ms: s == null ? null : Math.round((s + offset) * 1000),
                  end_ms:   e == null ? null : Math.round((e + offset) * 1000),
                  text: (ch.text || "").trim()
                };
              }).filter(x => x.text);
              study.cases[c.id].transcript_full = out.text.trim();
            } catch(transcribeErr) {
              console.error("Transcription failed:", transcribeErr);
              study.cases[c.id].transcript_full = "[transcription error]";
            }
          }
          study.cases[c.id].transcript_segments = segs;
          delete study.cases[c.id]._gaze_raw;
          uploadCaseInBackground(c.id);
          if (aStream) try { aStream.getTracks().forEach(t => t.stop()); } catch(e){}
          if (m.url){ try { URL.revokeObjectURL(m.url); } catch(e){} m.url=null; m.blob=null; }
          jsPsych.finishTrial();
        };

        if (aRec && aRec.state !== "inactive") {
          aRec.onstop  = () => finalize(new Blob(aChunks, { type: aRec.mimeType || "audio/webm" }));
          aRec.onerror = () => finalize(null);
          try { aRec.stop(); } catch(e) { finalize(null); }
        } else {
          finalize(null);
        }
      });
    }
  };

  return [startRec, ehrTrial, rtaTrial];
}

/* =====================================================================
   ASSEMBLE TIMELINE
   ===================================================================== */

/* ── Stimulated recall instructions (Gass & Mackey, 2017) ── */
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus:`<div style="max-width:700px;margin:6% auto;color:#c8d8e8;text-align:left;padding:0 20px;font-family:'Segoe UI',Arial,sans-serif;">
      <h2 style="color:#5ab0f0;">How this study works: Stimulated Recall</h2>
      <p style="font-size:16px;line-height:1.7;">After you finish each patient case, we will play back a recording of your screen so you can tell us what you were <strong>thinking</strong> as you worked through it.</p>
      <div style="background:#1d3450;border-left:4px solid #5ab0f0;padding:16px 20px;border-radius:6px;margin:18px 0;">
        <p style="margin:0 0 10px;font-weight:700;color:#5ab0f0;">The key rule — and the hardest part:</p>
        <p style="margin:0;font-size:15px;">Tell us what you were thinking <strong>at the time</strong>, not what you think <strong>now</strong> as you watch. It is easy to slip into describing what you see on screen. Try to go back to the moment.</p>

  on_load: function () {
    try { webgazer.showVideo(false); webgazer.showPredictionPoints(false); } catch(e){}
    const dot = document.getElementById("webgazerGazeDot"); if(dot) dot.style.display="none";
    const caseStart=performance.now();
    const prEv=[];
    let   prEvCounter=0;
    const tick=setInterval(()=>{
      const el=document.getElementById("pr_elapsed"); if(!el) return;
      const sec=Math.floor((performance.now()-caseStart)/1000);
      el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
    },1000);
    function renderPrEv(){
      const list=document.getElementById("pr_ev_list");
      const empty=document.getElementById("pr_ev_empty");
      if(!list) return;
      if(!prEv.length){list.innerHTML="";if(empty)empty.style.display="block";return;}
      if(empty) empty.style.display="none";
      list.innerHTML=prEv.map(e=>`<div class="bw-ev-item" role="listitem">

        <button class="bw-ev-rm" data-evid="${e.id}" aria-label="Remove evidence">&times;</button></div>`).join("");
      list.querySelectorAll(".bw-ev-rm").forEach(b=>b.addEventListener("click",()=>{
        prEv.splice(prEv.findIndex(x=>x.id===parseInt(b.dataset.evid)),1); renderPrEv();
      }));
    }

    /* ── Practice: free-text selection → popover (mirrors main case behaviour) ── */
    (function attachPrSelectionHandlers() {
      let popover = null;
      let rafHandle = null;

      function removePopover() {
        if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = null; }
        if (popover)   { popover.remove(); popover = null; }
      }

      function positionPopover(rect) {
        const margin = 8;
        const pw = popover.offsetWidth, ph = popover.offsetHeight;
        const vw = window.innerWidth,   vh = window.innerHeight;
        let top  = rect.top - ph - margin;
        if (top < margin) top = rect.bottom + margin;
        top  = Math.max(margin, Math.min(top,  vh - ph - margin));
        let left = rect.left + rect.width / 2 - pw / 2;
        left = Math.max(margin, Math.min(left, vw - pw - margin));
        popover.style.left = left + "px";
        popover.style.top  = top  + "px";
        popover.style.visibility = "visible";
      }

      function showPopover(selectedText, paraEl, paraId, selectionRect) {
        removePopover();
        popover = document.createElement("div");
        popover.id = "bw-sel-popover";
        popover.style.visibility = "hidden";

        const addBtn = document.createElement("button");
        addBtn.textContent = "＋ Add to Evidence";
        const dismissBtn = document.createElement("button");
        dismissBtn.className = "bw-sel-dismiss";
        dismissBtn.innerHTML = "&times;";
        dismissBtn.setAttribute("aria-label", "Dismiss");
        popover.appendChild(addBtn);
        popover.appendChild(dismissBtn);
        document.body.appendChild(popover);

        rafHandle = requestAnimationFrame(() => {
          rafHandle = null;
          if (!popover) return;
          positionPopover(selectionRect);
        });

        addBtn.addEventListener("click", () => {
          if (!prEv.some(e => e.text === selectedText)) {
            prEv.push({ id: prEvCounter++, text: selectedText });
            paraEl.classList.add("para-added");
            renderPrEv();
          }
          try { window.getSelection().removeAllRanges(); } catch(e) {}
          removePopover();
        });
        dismissBtn.addEventListener("click", () => {
          try { window.getSelection().removeAllRanges(); } catch(e) {}
          removePopover();
        });
      }

      document.querySelectorAll("#bw_root_pr .bw-ev-para").forEach(paraEl => {
        paraEl.addEventListener("mouseup", () => {
          setTimeout(() => {
            try {
              const sel = window.getSelection();
              if (!sel || sel.rangeCount === 0) { removePopover(); return; }
              const text = sel.toString().trim();
              if (!text) { removePopover(); return; }
              const anchor = sel.anchorNode, focus = sel.focusNode;
              if (!anchor || !focus) { removePopover(); return; }
              if (!paraEl.contains(anchor) && !paraEl.contains(focus)) { removePopover(); return; }
              const range = sel.getRangeAt(0);
              const rect  = range.getBoundingClientRect();
              if (!rect || (rect.width === 0 && rect.height === 0)) { removePopover(); return; }
              showPopover(text, paraEl, paraEl.id, rect);
            } catch(err) {
              console.warn("pr-sel mouseup:", err);
              removePopover();
            }
          }, 0);
        });
      });

      document.addEventListener("mousedown", (e) => {
        if (popover && !popover.contains(e.target)) removePopover();
      }, true);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { removePopover(); try { window.getSelection().removeAllRanges(); } catch(ex) {} }
      });
    })();

    /* ── Practice instruction banner dismiss ── */
    const prInstrDismiss = document.getElementById("bw_instr_dismiss_pr");
    const prInstrBanner  = document.getElementById("bw_instr_pr");

      prSubmitBtn.dataset.submitted = "true";
      clearInterval(tick);
      await stopScreenRecording("practice");
      if(document.fullscreenElement) try{await document.exitFullscreen();}catch(fe){}
      jsPsych.finishTrial();

};

    const m=caseMedia["practice"]; const video=document.getElementById("rv_pr"); const done=document.getElementById("rd_pr");
    if(!m||!m.url){return jsPsych.finishTrial();}
    video.src=m.url;
    let aStream=null,aRec=null,aChunks=[];
    try{
      aStream=await navigator.mediaDevices.getUserMedia({audio:true});
      aRec=new MediaRecorder(aStream);
      aRec.ondataavailable=e=>{if(e.data&&e.data.size)aChunks.push(e.data);};
      aRec.start(1000);
    }catch(e){}
    video.addEventListener("ended",()=>{done.disabled=false;done.style.background="#27ae60";});
    setTimeout(()=>{done.disabled=false;done.style.background="#27ae60";},90000);
    try{await video.play();}catch(e){done.disabled=false;done.style.background="#27ae60";}
    done.addEventListener("click",()=>{
      try{video.pause();}catch(e){}
      if(aRec&&aRec.state!=="inactive")aRec.stop();
      if(aStream)aStream.getTracks().forEach(t=>t.stop());
      if(m.url){URL.revokeObjectURL(m.url);m.url=null;m.blob=null;}
      jsPsych.finishTrial(); // practice audio discarded — never transcribed, never saved
    });
  }
